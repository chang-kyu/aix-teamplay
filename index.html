처\n- 담당: 평생학습과 대학협력팀 031-369-1952","say":"담당은 평생학습과 대학협력팀 031-369-1952예요."},{"id":"ANS006#full1","policyId":"ANS006","section":"full","text":"대학생 아이디어 공모전 | 공고 원문 1/2\n추진배경,사업개요,주요내용,성과 및 기대효과,담당부서 순으로 정보를 제공합니다\n추진배경\n시정 전반에 대한 대학생들의 창의적 정책을 발굴하여 실제 행정에 접목함으로써 정책의 실효성 및 참신성 확보\n사업개요\n일정 : 2026. 5. ~ 10.\n응모자격 : 만39세 이하의 (전국)대학생*\n*고등교육법 제2조에 따른 대학 또는 학점인정법 시행령 제3조제5호에 해당하는 직업능력개발시설 중 학점은행제를 통해 전문학사 이상 학위 과정을 운영하는 시설에 재학 중인 학생(휴학생, 대학원생 포함)\n주요내용 : 안산시 지역발전을 위한 행정, 경제/홍보, 문화/관광, 환경/안전 등 주제의 대학생 아이디어 공모\n추진절차\n[공고 및 접수]\n[부서검토 및 심사]\n[결과발표]\n[시상]\n공모주제 선정ㆍ공고 제안작 접수\n1차 서류심사"},{"id":"ANS006#full2","policyId":"ANS006","section":"full","text":"대학생 아이디어 공모전 | 공고 원문 2/2\n2차 발표심사\n수상작 발표\n시상 안내\n시상식\n시상 : 총 6명(팀)(최우수상 1, 우수상 2, 장려상 3)\n성과 및 기대효과\n아이디어의 시정 반영 과정을 통해 관내 대학생의 취업 경쟁력을 제고하고 대학생에게 시정 참여 기회 확대\n대학생의 참신한 아이디어를 지역 현안에 활용하여 지속가능한 지역발전 실현\n담당부서\n평생학습과 대학협력팀(031-369-1952)"},{"id":"ANS007#overview","policyId":"ANS007","section":"overview","text":"청년도전지원사업 | 개요\n- 분야: 교육일자리\n- 한 줄 요약: 맞춤형 취업 프로그램 + 참여수당 (최대 350만원)\n- 대상: 만 18~34세, 거주 조건 없음(주소와 관계없이 신청 가능)\n- 조건: 구직단념청년(최근 6개월 취·창업·교육·훈련 이력 없음) 등","say":"청년도전지원사업은 교육일자리 분야 사업이에요. 맞춤형 취업 프로그램 + 참여수당 (최대 350만원). 대상은 만 18~34세, 거주 조건은 '거주 무관'이에요."},{"id":"ANS007#target","policyId":"ANS007","section":"target","text":"청년도전지원사업 | 지원 대상\n- 나이: 만 18~34세\n- 거주: 거주 조건 없음(주소와 관계없이 신청 가능)\n- 그 밖의 조건(본인 확인): 구직단념청년(최근 6개월 취·창업·교육·훈련 이력 없음) 등","say":"나이 조건은 만 18~34세예요. 거주 조건은 없어요. 주소와 관계없이 신청할 수 있어요. 그 밖에 '구직단념청년(최근 6개월 취·창업·교육·훈련 이력 없음) 등' 조건은 직접 확인해 주세요."},{"id":"ANS007#benefit","policyId":"ANS007","section":"benefit","text":"청년도전지원사업 | 지원 내용\n- 내용: 맞춤형 취업 프로그램 + 참여수당 (최대 350만원)\n- 금액: 단기 50만원 / 중기 150만원 + 인센티브 70만원 / 장기 250만원 + 인센티브 100만원","say":"지원 내용은 '맞춤형 취업 프로그램 + 참여수당 (최대 350만원)'이에요. 금액은 단기 50만원 / 중기 150만원 + 인센티브 70만원 / 장기 250만원 + 인센티브 100만원이에요."},{"id":"ANS007#period","policyId":"ANS007","section":"period","text":"청년도전지원사업 | 신청 기간\n- 접수 기간: 2026.01.20 ~ 2026.12.31\n- 안내: 연중 수시(선착순)\n- 관련 공고: 안산시 공고 제2026-164호(2026-01-20)","say":"수집한 공고의 접수 기간은 2026.01.20 ~ 2026.12.31이에요. 안내: 연중 수시(선착순)."},{"id":"ANS007#method","policyId":"ANS007","section":"method","text":"청년도전지원사업 | 신청 방법\n- 신청 방법: 고용24 홈페이지 또는 운영기관 방문\n- 신청 사이트: 고용24 (https://www.work24.go.kr), 로그인 필요\n- 찾는 법: 로그인한 뒤 검색창에 '청년도전지원사업' 검색 (사이트 첫 화면으로 열림)","say":"신청 방법은 '고용24 홈페이지 또는 운영기관 방문'이에요. 신청 사이트는 고용24예요. 첫 화면이 열리니 로그인한 뒤 검색창에 '청년도전지원사업'을 검색해 주세요."},{"id":"ANS007#contact","policyId":"ANS007","section":"contact","text":"청년도전지원사업 | 문의처\n- 담당: 청년정책관 청년지원팀 031-369-1655 / (사)가치있는누림 031-402-4145","say":"담당은 청년정책관 청년지원팀 031-369-1655 / (사)가치있는누림 031-402-4145예요."},{"id":"ANS007#notes","policyId":"ANS007","section":"notes","text":"청년도전지원사업 | 참고\n- 자립준비·북한이탈 청년 등은 별도 대상이에요. 지역특화 유형은 39세 이하예요","say":"자립준비·북한이탈 청년 등은 별도 대상이에요. 지역특화 유형은 39세 이하예요."},{"id":"ANS007#full1","policyId":"ANS007","section":"full","text":"청년도전지원사업 | 공고 원문 1/3\n추진배경,사업개요,주요내용,성과 및 기대효과,담당부서 순으로 정보를 제공합니다\n추진배경\n고용노동부 공모사업으로, 구직 단념 청년들의 구직 의욕 고취 및 노동시장 참여 지원\n맞춤형 취업프로그램 지원을 통한 자립역량 강화\n사업개요\n지원대상 :\n(구직단념청년) 최근 6개월간 취ㆍ창업 및 교육ㆍ직업훈련 참여 이력이 없는 18~34세 청년\n(자립준비청년) 아동복지시설 등에서 퇴소 5년 이내의 청년 또는 퇴소일을 연장한 청년\n(청소년복지시설 입ㆍ퇴소 청년) 청소년복지시설 입ㆍ퇴소 18~34세 청년\n(북한이탈 청년) 북한을 이탈한 자로서 18~34세 청년\n(가습기살균제 피해청년) 가습기살균제 피해구제를 위한 특별법에 따른 18~34세 청년\n(지역특화) 기타 지원의 필요성이 있다고 인정받은 39세 이하 청년"},{"id":"ANS007#full2","policyId":"ANS007","section":"full","text":"청년도전지원사업 | 공고 원문 2/3\n모집기간 : 연중수시 (선착순 모집)\n진행기간 : 2026. 2. ~ 12.(기수별 운영)\n모집인원 : 218명(단기 58명, 중기 104명, 장기 56명)\n신청방법 : 워크넷\n(https://work.go.kr)\n홈페이지 접속 후 ‘청년도전지원사업’ 검색\n(온라인 신청이 어려운 경우, 운영기관 ‘가치있는 누림’ 방문 가능)\n주요내용\n고용노동부 공모사업으로 미취업 청년 대상으로 맞춤형 취업 프로그램\n(이력서ㆍ면접 컨설팅, 기업탐방, 휴먼북라이브러리 등) 제공을 통한 취업 지원\n단기 프로그램 이수 시 50만원 지급\n중기 프로그램 이수 시 150만원(50만원x3회) 인센티브 최대 70만원\n장기 프로그램 이수 시 250만원(50만원x5회) 인센티브 최대 100만원"},{"id":"ANS007#full3","policyId":"ANS007","section":"full","text":"청년도전지원사업 | 공고 원문 3/3\n이수 후 국민취업지원제도, 직업훈련, 고용촉진장려금 등 연계 지원\n성과 및 기대효과\n구직단념청년, 자립준비청년(보호종료아동), 청소년쉼터 입ㆍ퇴소 청년 등에게 사회활동 참여 의욕 고취를 위한 맞춤형 프로그램을 제공하여, 사회로의 안정적인 진입을 지원\n담당부서\n안산시 청년정책관 청년지원팀 031-369-1655 (문의처 : (사)가치있는누림 031-402-4145)"},{"id":"ANS008#overview","policyId":"ANS008","section":"overview","text":"안산시 청년몰 '소소플래닛' 운영 | 개요\n- 분야: 교육일자리\n- 한 줄 요약: 청년몰 입점 (임대료 50% 감면, 정착비·교육 지원)\n- 대상: 만 39세 이하, 거주 조건 없음(주소와 관계없이 신청 가능)\n- 조건: 예비창업자 또는 동종분야 사업자등록 합산 3년 미만","say":"안산시 청년몰 '소소플래닛' 운영은 교육일자리 분야 사업이에요. 청년몰 입점 (임대료 50% 감면, 정착비·교육 지원). 대상은 만 39세 이하, 거주 조건은 '거주 무관'이에요."},{"id":"ANS008#target","policyId":"ANS008","section":"target","text":"안산시 청년몰 '소소플래닛' 운영 | 지원 대상\n- 나이: 만 39세 이하\n- 거주: 거주 조건 없음(주소와 관계없이 신청 가능)\n- 그 밖의 조건(본인 확인): 예비창업자 또는 동종분야 사업자등록 합산 3년 미만","say":"나이 조건은 만 39세 이하예요. 거주 조건은 없어요. 주소와 관계없이 신청할 수 있어요. 그 밖에 '예비창업자 또는 동종분야 사업자등록 합산 3년 미만' 조건은 직접 확인해 주세요."},{"id":"ANS008#benefit","policyId":"ANS008","section":"benefit","text":"안산시 청년몰 '소소플래닛' 운영 | 지원 내용\n- 내용: 청년몰 입점 (임대료 50% 감면, 정착비·교육 지원)\n- 금액: 임대료 50% 감면","say":"지원 내용은 '청년몰 입점 (임대료 50% 감면, 정착비·교육 지원)'이에요."},{"id":"ANS008#period","policyId":"ANS008","section":"period","text":"안산시 청년몰 '소소플래닛' 운영 | 신청 기간\n- 안내: 입점 모집 시 공고","say":"안내: 입점 모집 시 공고."},{"id":"ANS008#method","policyId":"ANS008","section":"method","text":"안산시 청년몰 '소소플래닛' 운영 | 신청 방법\n- 신청 방법: 이메일 접수(ansanyouthmall@naver.com)","say":"신청 방법은 '이메일 접수(ansanyouthmall@naver.com)'이에요."},{"id":"ANS008#contact","policyId":"ANS008","section":"contact","text":"안산시 청년몰 '소소플래닛' 운영 | 문의처\n- 담당: 청년정책관 청년지원팀 031-369-1789","say":"담당은 청년정책관 청년지원팀 031-369-1789예요."},{"id":"ANS008#full1","policyId":"ANS008","section":"full","text":"안산시 청년몰 '소소플래닛' 운영 | 공고 원문 1/4\n추진배경,사업개요,주요내용,성과 및 기대효과,담당부서 순으로 정보를 제공합니다\n추진배경\n안정적인 청년창업 지원을 통하여 창업 성공률 향상 및 지역경제활성화에 도모\n전통시장 활성화와 상생경영을 통한 지역사회 정착 도모\n사업개요\n복합청년몰 현황\n복합청년몰 현황 -구분, 신안코아 복합청년몰, 다농마트 복합청년몰 순으로 내용을 전달합니다.\n구분\n신안코아 복합청년몰\n다농마트 복합청년몰\n개 장 일"},{"id":"ANS008#full2","policyId":"ANS008","section":"full","text":"안산시 청년몰 '소소플래닛' 운영 | 공고 원문 2/4\n2021. 2.\n2021. 11.\n소 재 지\n상록구 석호로 315 지층\n상록구 예술광장로 1, 3층\n조성면적\n840.24㎡(254.6평)\n528.59㎡(전용) / 311.65㎡(공용)\n1,014.37㎡(307.2평)"},{"id":"ANS008#full3","policyId":"ANS008","section":"full","text":"안산시 청년몰 '소소플래닛' 운영 | 공고 원문 3/4\n434.79㎡(전용) / 579.58㎡(공용)\n조성점포\n음식점 및 디저트, 공방, 회의실, 푸드코트 등\n음식점 및 디저트, 공방, 회의실, 푸드코트 등\n입점조건\n공고일 기준 39세 이하 청년중 예비창업자 또는 최근 5년 이내에 동종 분야 사업자등록 합산 기간이 3년 미만인 자\n청년몰 운영시간 준수 및 단체활동, 화합이 가능한 자\n입점기간\n최초입주일로부터 1년, 평가 후 1년 단위 계약(최대 4년)\n신청방법 : 이메일접수(ansanyouthmall@naver.com)\n주요내용\n청년몰 임대료 50% 감면\n신규 청년상인 정착비 지원\n상주 매니저를 통한 관리\n행사, 이벤트를 통한 홍보\n역량 강화교육 지원\n자기 계발지원 및 영업 지원\n시설 유지보수\n점포 위생지원 등\n성과 및 기대효과"},{"id":"ANS008#full4","policyId":"ANS008","section":"full","text":"안산시 청년몰 '소소플래닛' 운영 | 공고 원문 4/4\n안정적인 창업 공간 제공을 통해 청년들의 창업 진입 장벽을 낮추고 다양한 실전 경험을 쌓을 수 있는 기회 제공\n전통시장 내 공간을 활용하여 새로운 상관을 형성하고 지역경제 활성화 기여\n담당부서\n청년정책관 청년지원팀(031-369-1789)"},{"id":"ANS009#overview","policyId":"ANS009","section":"overview","text":"2026 안산 스타트업 창업경진대회 | 개요\n- 분야: 교육일자리\n- 한 줄 요약: 교육·멘토링, 수상자 사업화자금\n- 대상: 만 39세 이하, 거주 조건 없음(주소와 관계없이 신청 가능)\n- 조건: 예비(초기) 청년창업가","say":"2026 안산 스타트업 창업경진대회는 교육일자리 분야 사업이에요. 교육·멘토링, 수상자 사업화자금. 대상은 만 39세 이하, 거주 조건은 '거주 무관'이에요."},{"id":"ANS009#target","policyId":"ANS009","section":"target","text":"2026 안산 스타트업 창업경진대회 | 지원 대상\n- 나이: 만 39세 이하\n- 거주: 거주 조건 없음(주소와 관계없이 신청 가능)\n- 그 밖의 조건(본인 확인): 예비(초기) 청년창업가","say":"나이 조건은 만 39세 이하예요. 거주 조건은 없어요. 주소와 관계없이 신청할 수 있어요. 그 밖에 '예비(초기) 청년창업가' 조건은 직접 확인해 주세요."},{"id":"ANS009#benefit","policyId":"ANS009","section":"benefit","text":"2026 안산 스타트업 창업경진대회 | 지원 내용\n- 내용: 교육·멘토링, 수상자 사업화자금","say":"지원 내용은 '교육·멘토링, 수상자 사업화자금'이에요."},{"id":"ANS009#period","policyId":"ANS009","section":"period","text":"2026 안산 스타트업 창업경진대회 | 신청 기간\n- 접수 기간: 2026.04.01 ~ 2026.05.31\n- 안내: 모집 4~5월, 본선 7월 (날짜는 안내 문구 기준 추정)","say":"수집한 공고의 접수 기간은 2026.04.01 ~ 2026.05.31이에요. 안내: 모집 4~5월, 본선 7월 (날짜는 안내 문구 기준 추정)."},{"id":"ANS009#method","policyId":"ANS009","section":"method","text":"2026 안산 스타트업 창업경진대회 | 신청 방법\n- 신청 방법: 모집공고 확인","say":"신청 방법은 '모집공고 확인'이에요."},{"id":"ANS009#contact","policyId":"ANS009","section":"contact","text":"2026 안산 스타트업 창업경진대회 | 문의처\n- 담당: 청년정책관 청년일자리팀 031-481-3994","say":"담당은 청년정책관 청년일자리팀 031-481-3994예요."},{"id":"ANS009#notes","policyId":"ANS009","section":"notes","text":"2026 안산 스타트업 창업경진대회 | 참고\n- 29세 이하 고교 재학·졸업생은 가점이 있어요","say":"29세 이하 고교 재학·졸업생은 가점이 있어요."},{"id":"ANS009#full1","policyId":"ANS009","section":"full","text":"2026 안산 스타트업 창업경진대회 | 공고 원문 1/2\n추진배경,사업개요,주요내용,성과 및 기대효과,담당부서 순으로 정보를 제공합니다\n추진배경\n창의적인 아이디어와 기술을 보유한 (예비)청년창업가 발굴을 위한 자리를 마련으로 창업을 실현하고 창업 문화확산에 기여\n사업개요\n사업명 : 안산시 창년창업 경진대회\n지원대상 : 39세 이하 예비(초기) 청년창업가 누구나\n*29세 이하 고등학교 재학생 및 졸업생(졸업예정자), 예비창업자 가점 부여\n모집분야 : 4차산업 융합관련 분야 기술형 창업(loT, 모바일, Al, 로봇 등)\n사업내용\n청년창업자 발굴 및 역량 교육지원, 컨설팅 등\n창업경진대회 개최 및 수상자 사업화 지원\n주요내용\n추진절차 : 모집공고→1차 평가→2차 평가 및 교육→우수자 선정 및 지원\n준비단계\n1단계\n(2차 평가 및 교육)\n2단계\n(경진대회 개최)\n3단계"},{"id":"ANS009#full2","policyId":"ANS009","section":"full","text":"2026 안산 스타트업 창업경진대회 | 공고 원문 2/2\n(후속지원)\n1차평가(발표평가)\n교육 및 멘토링 지원\n이용가능일정 및 쿠폰 문자발송\n2차평가(발표평가)\n청년창업경진대회(본선)\n사업화자금 지원\n공간, 네트워킹 등 지원\n4월~5월\n5월~6월\n7월 중\n8월~12월\n성과 및 기대효과\n성공적인 창업 실현으로 청년의 인구 유입 및 기업의 지속 정착 유도\n창업자 발굴 및 지원으로 창업 성공률 제고\n담당부서\n청년정책관 청년일자리팀(031-481-3994)"},{"id":"ANS010#overview","policyId":"ANS010","section":"overview","text":"안산시 청년큐브 운영 | 개요\n- 분야: 교육일자리\n- 한 줄 요약: 창업공간(4캠프 60실) 입주, 멘토링·마케팅·투자유치 지원\n- 대상: 만 39세 이하, 거주 조건 없음(주소와 관계없이 신청 가능)\n- 조건: 예비창업자 또는 3년 이내 초기 창업자","say":"안산시 청년큐브 운영은 교육일자리 분야 사업이에요. 창업공간(4캠프 60실) 입주, 멘토링·마케팅·투자유치 지원. 대상은 만 39세 이하, 거주 조건은 '거주 무관'이에요."},{"id":"ANS010#target","policyId":"ANS010","section":"target","text":"안산시 청년큐브 운영 | 지원 대상\n- 나이: 만 39세 이하\n- 거주: 거주 조건 없음(주소와 관계없이 신청 가능)\n- 그 밖의 조건(본인 확인): 예비창업자 또는 3년 이내 초기 창업자","say":"나이 조건은 만 39세 이하예요. 거주 조건은 없어요. 주소와 관계없이 신청할 수 있어요. 그 밖에 '예비창업자 또는 3년 이내 초기 창업자' 조건은 직접 확인해 주세요."},{"id":"ANS010#benefit","policyId":"ANS010","section":"benefit","text":"안산시 청년큐브 운영 | 지원 내용\n- 내용: 창업공간(4캠프 60실) 입주, 멘토링·마케팅·투자유치 지원","say":"지원 내용은 '창업공간(4캠프 60실) 입주, 멘토링·마케팅·투자유치 지원'이에요."},{"id":"ANS010#period","policyId":"ANS010","section":"period","text":"안산시 청년큐브 운영 | 신청 기간\n- 안내: 연 1~2회 모집","say":"안내: 연 1~2회 모집."},{"id":"ANS010#method","policyId":"ANS010","section":"method","text":"안산시 청년큐브 운영 | 신청 방법\n- 신청 방법: 청년큐브 홈페이지 / 경기테크노파크 이메일\n- 신청 사이트: 경기 청년큐브 (https://www.youthcube.net)\n- 찾는 법: 검색창에 '안산시 청년큐브 운영' 검색 (사이트 첫 화면으로 열림)","say":"신청 방법은 '청년큐브 홈페이지 / 경기테크노파크 이메일'이에요. 신청 사이트는 경기 청년큐브예요. 첫 화면이 열리니 검색창에 '안산시 청년큐브 운영'을 검색해 주세요."},{"id":"ANS010#contact","policyId":"ANS010","section":"contact","text":"안산시 청년큐브 운영 | 문의처\n- 담당: (재)경기테크노파크 031-487-9970 / 청년일자리팀 031-481-3984","say":"담당은 (재)경기테크노파크 031-487-9970 / 청년일자리팀 031-481-3984예요."},{"id":"ANS010#full1","policyId":"ANS010","section":"full","text":"안산시 청년큐브 운영 | 공고 원문 1/2\n추진배경,사업개요,주요내용,성과 및 기대효과,담당부서 순으로 정보를 제공합니다\n추진배경\n자기콘텐츠를 가진 청년들의 창업 및 맞춤형 성장지원을 통한 청년일자리 창출 및 창업문화 확산\n사업개요\n지원대상 : 창업 아이템을 가지고 창업하고자 하는 39세 이하 예비 또는 3년 이내 초기 창업자\n창업공간 : 4캠프 60실\n한양캠프(한양대학로 60, 한양타운 4층 10실),\n예대캠프(광덕산안길 20, 광덕종합시장 3층 20실)\n초지캠프(원포공원1로 59, 신명트윈타워 A동 5층 24실)\n월피캠프(광덕산3로 51, 청년큐브 월피캠프 6실)\n주요내용\n청년큐브 입주자 모집 : 연 1~2회\n청년큐브 홈페이지(www.youthcube.net)\n(재)경기테크노파크 E-mail 접수"},{"id":"ANS010#full2","policyId":"ANS010","section":"full","text":"안산시 청년큐브 운영 | 공고 원문 2/2\n문의처 : (재)경기테크노파크 (TEL) 031-487-9970\n지원내용 : 멘토링, 마케팅, 투자유치, 지적재산권 인증 등 사업화 지원 시제품 제작지원 및 기술지원, 사업화 브랜딩 등\n성과 및 기대효과\n청년의 자립과 성장지원을 통한 지역경제 활성화 및 도시재생 실현\n담당부서\n전담기관 : (재)경기테크노파크(031-487-9970)\n주관기관 : 청년정책관 청년일자리팀(031-481-3984)"},{"id":"ANS017#overview","policyId":"ANS017","section":"overview","text":"e스포츠산업 아카데미 | 개요\n- 분야: 교육일자리\n- 한 줄 요약: e스포츠 산업 교육·대회운영 실습·견학 (40명)\n- 대상: 만 16~39세, 거주 조건 없음(주소와 관계없이 신청 가능)","say":"e스포츠산업 아카데미는 교육일자리 분야 사업이에요. e스포츠 산업 교육·대회운영 실습·견학 (40명). 대상은 만 16~39세, 거주 조건은 '거주 무관'이에요."},{"id":"ANS017#target","policyId":"ANS017","section":"target","text":"e스포츠산업 아카데미 | 지원 대상\n- 나이: 만 16~39세\n- 거주: 거주 조건 없음(주소와 관계없이 신청 가능)","say":"나이 조건은 만 16~39세예요. 거주 조건은 없어요. 주소와 관계없이 신청할 수 있어요."},{"id":"ANS017#benefit","policyId":"ANS017","section":"benefit","text":"e스포츠산업 아카데미 | 지원 내용\n- 내용: e스포츠 산업 교육·대회운영 실습·견학 (40명)","say":"지원 내용은 'e스포츠 산업 교육·대회운영 실습·견학 (40명)'이에요."},{"id":"ANS017#period","policyId":"ANS017","section":"period","text":"e스포츠산업 아카데미 | 신청 기간\n- 접수 기간: 2026.06.11 ~ 2026.06.25\n- 안내: 교육 2026-07-04~08-29","say":"수집한 공고의 접수 기간은 2026.06.11 ~ 2026.06.25이에요. 안내: 교육 2026-07-04~08-29."},{"id":"ANS017#method","policyId":"ANS017","section":"method","text":"e스포츠산업 아카데미 | 신청 방법\n- 신청 방법: 접수 공고 확인","say":"신청 방법은 '접수 공고 확인'이에요."},{"id":"ANS017#contact","policyId":"ANS017","section":"contact","text":"e스포츠산업 아카데미 | 문의처\n- 담당: 청년정책관 031-369-1787","say":"담당은 청년정책관 031-369-1787이에요."},{"id":"ANS017#notes","policyId":"ANS017","section":"notes","text":"e스포츠산업 아카데미 | 참고\n- 고교 재학생도 참여할 수 있어요","say":"고교 재학생도 참여할 수 있어요."},{"id":"ANS017#full1","policyId":"ANS017","section":"full","text":"e스포츠산업 아카데미 | 공고 원문 1/2\n추진배경,사업개요,주요내용,성과 및 기대효과,담당부서 순으로 정보를 제공합니다\n추진배경\n디지털ㆍ비대면 문화 가속화에 따라 폭발적으로 성장하는 e스포츠 산업\n아시안게임 정식 종목 채택 등 e스포츠에 대한 관심 제고\n사업개요\n사 업 명 : 2026 안산 e스포츠산업 아카데미\n접수기간 : 2026. 6. 11. ~ 2026. 6. 25.\n교육기간 : 2026. 7. 4. ~ 2026. 8. 29.\n교육내용\ne스포츠 대회 운영 실습\ne스포츠 구단 및 스튜디오 견학\ne스포츠 산업 생태계, 마케팅 교육 등\n주요내용\n안산 e스포츠산업 아카데미\n운영기간 : 25. 7. 4. ~ 2026. 8. 29.\n교육대상 : 청소년ㆍ청년(16~39세 또는 고교 재학생)\n교육장소 : 온ㆍ오프라인 병행(e스포츠 경기장, 프로 구단 등)"},{"id":"ANS017#full2","policyId":"ANS017","section":"full","text":"e스포츠산업 아카데미 | 공고 원문 2/2\n교육인원 : 40명\n사업내용 : e스포츠 산업 이론 및 대회 운영 실습, e스포츠 구단 견학, 취업 특강 등\n성과 및 기대효과\n새롭게 성장하는 e스포츠 산업을 알리고 직군 체험 기회를 제공하여 청년층의 견문 확대\n청년층이 열광하고 몰입하는 e스포츠를 통해 청년 문화를 선도하는 도시 브랜딩\n담당부서\n안산시 청년정책관(031-369-1787)"},{"id":"ANS021#overview","policyId":"ANS021","section":"overview","text":"메이커 스페이스 구축ㆍ운영 | 개요\n- 분야: 교육일자리\n- 한 줄 요약: 3D프린터·레이저커팅기 등 시제품 제작 공간(창작나래)\n- 대상: 나이 제한 없음, 거주 조건 없음(주소와 관계없이 신청 가능)\n- 조건: 청소년·창업가·예비창업가","say":"메이커 스페이스 구축ㆍ운영은 교육일자리 분야 사업이에요. 3D프린터·레이저커팅기 등 시제품 제작 공간(창작나래). 대상은 나이 제한 없음, 거주 조건은 '거주 무관'이에요."},{"id":"ANS021#target","policyId":"ANS021","section":"target","text":"메이커 스페이스 구축ㆍ운영 | 지원 대상\n- 나이: 나이 제한 없음\n- 거주: 거주 조건 없음(주소와 관계없이 신청 가능)\n- 그 밖의 조건(본인 확인): 청소년·창업가·예비창업가","say":"나이 제한은 없어요. 거주 조건은 없어요. 주소와 관계없이 신청할 수 있어요. 그 밖에 '청소년·창업가·예비창업가' 조건은 직접 확인해 주세요."},{"id":"ANS021#benefit","policyId":"ANS021","section":"benefit","text":"메이커 스페이스 구축ㆍ운영 | 지원 내용\n- 내용: 3D프린터·레이저커팅기 등 시제품 제작 공간(창작나래)","say":"지원 내용은 '3D프린터·레이저커팅기 등 시제품 제작 공간(창작나래)'예요."},{"id":"ANS021#period","policyId":"ANS021","section":"period","text":"메이커 스페이스 구축ㆍ운영 | 신청 기간\n- 안내: 상시","say":"안내: 상시."},{"id":"ANS021#method","policyId":"ANS021","section":"method","text":"메이커 스페이스 구축ㆍ운영 | 신청 방법\n- 신청 방법: 방문","say":"신청 방법은 '방문'이에요."},{"id":"ANS021#contact","policyId":"ANS021","section":"contact","text":"메이커 스페이스 구축ㆍ운영 | 문의처\n- 담당: 안산시청소년재단 미래전략팀 031-412-1715","say":"담당은 안산시청소년재단 미래전략팀 031-412-1715예요."},{"id":"ANS021#full1","policyId":"ANS021","section":"full","text":"메이커 스페이스 구축ㆍ운영 | 공고 원문 1/2\n추진배경,사업개요,주요내용,성과 및 기대효과,담당부서 순으로 정보를 제공합니다\n추진배경\n메이커 장비를 활용한 시제품 제작 수요 증가 및 창업 연계 요구 확대\n생산적 창업 생태계 조성 및 창작 활동의 일상화 도모\n사업개요\n사 업 명 : 메이커 스페이스\n목    적 : 메이커 전용ㆍ전문 장비를 활용한 시제품(프로토타입) 제작 지원을 통해 창업 기반을 마련하고 창작 활동을 활성화하고자 함\n장    소 : 단원청소년수련관 2층 창작나래\n대    상 : 청소년, 창업기업, 창업가, 예비 창업가 등\n주요내용\n메이커 전용 창작 공간 ‘창작나래’ 상시 운영 및 자율 이용 환경 조성\n3D프린터, 레이저커팅기 등 메이커 장비를 활용한 시제품(프로토타입)제작 지원\n원활한 이용을 위한 상시 장비 관리 및 운영 체계 유지"},{"id":"ANS021#full2","policyId":"ANS021","section":"full","text":"메이커 스페이스 구축ㆍ운영 | 공고 원문 2/2\n일상 속 창작 활동 활성화 및 이용자 중심의 자율적 메이커 문화 확산 도모\n성과 및 기대효과\n지역 내 메이커 문화 활성화 및 창작 기반 확대\n누구나 쉽게 이용할 수 있는 자율형 창작 거점 공간 기능 강화\n시제품 제작을 통한 창업 연계 기반 마련\n담당부서\n안산시청소년재단 경영지원본부 미래전략팀(031-412-1715)"},{"id":"ANS023#overview","policyId":"ANS023","section":"overview","text":"말산업 청년인턴 취업지원 | 개요\n- 분야: 교육일자리\n- 한 줄 요약: 승마장 등 인턴 채용 (10개월, 인건비 지원)\n- 대상: 만 19~39세, 거주 조건 없음(주소와 관계없이 신청 가능)\n- 조건: 미취업","say":"말산업 청년인턴 취업지원은 교육일자리 분야 사업이에요. 승마장 등 인턴 채용 (10개월, 인건비 지원). 대상은 만 19~39세, 거주 조건은 '거주 무관'이에요."},{"id":"ANS023#target","policyId":"ANS023","section":"target","text":"말산업 청년인턴 취업지원 | 지원 대상\n- 나이: 만 19~39세\n- 거주: 거주 조건 없음(주소와 관계없이 신청 가능)\n- 그 밖의 조건(본인 확인): 미취업","say":"나이 조건은 만 19~39세예요. 거주 조건은 없어요. 주소와 관계없이 신청할 수 있어요. 그 밖에 '미취업' 조건은 직접 확인해 주세요."},{"id":"ANS023#benefit","policyId":"ANS023","section":"benefit","text":"말산업 청년인턴 취업지원 | 지원 내용\n- 내용: 승마장 등 인턴 채용 (10개월, 인건비 지원)","say":"지원 내용은 '승마장 등 인턴 채용 (10개월, 인건비 지원)'이에요."},{"id":"ANS023#period","policyId":"ANS023","section":"period","text":"말산업 청년인턴 취업지원 | 신청 기간\n- 접수 기간: 2026.02.05 ~ 2026.02.13\n- 안내: 2026 모집 종료(4명)\n- 관련 공고: 안산시 농업기술센터 공고 제2026-1호(2026-02-05)","say":"수집한 공고의 접수 기간은 2026.02.05 ~ 2026.02.13이에요. 안내: 2026 모집 종료(4명)."},{"id":"ANS023#method","policyId":"ANS023","section":"method","text":"말산업 청년인턴 취업지원 | 신청 방법\n- 신청 방법: 농업기술센터 방문접수","say":"신청 방법은 '농업기술센터 방문접수'예요."},{"id":"ANS023#contact","policyId":"ANS023","section":"contact","text":"말산업 청년인턴 취업지원 | 문의처\n- 담당: 농업정책과 축산정책팀 031-481-2322","say":"담당은 농업정책과 축산정책팀 031-481-2322예요."},{"id":"ANS023#full1","policyId":"ANS023","section":"full","text":"말산업 청년인턴 취업지원 | 공고 원문 1/2\n추진배경,사업개요,주요내용,성과 및 기대효과,담당부서 순으로 정보를 제공합니다\n추진배경\n말산업 관련 분야 취업을 희망하는 청년층에게 실무경험 기회를 제공\n사업개요\n신청대상: 만 19세 이상 ~ 만 39세 이하 청년 중 미취업자\n신청방법: 안산시 홈페이지(채용정보) 확인 후 방문 접수\n추진절차\n①사업자 공모·접수\n시\n②사업자 선정·안내\n시 → 사업체, 청년인턴\n③채용계약\n(근로계약서 작성)\n사업체 ⇄ 청년인턴\n④사업추진\n(인건비 지급)\n사업체 → 청년인턴\n시 → 사업체\n인턴 근로사업장\n상록구 : 세계승마클럽, ㈜안산해피홀스클럽, ㈜엘리트승마스쿨, 트리플밸리승마장\n단원구 대부동: 베르아델승마클럽(주)\n주요내용\n청년을 인턴으로 신규 채용한 사업체(승마장 등)에 인건비 지원"},{"id":"ANS023#full2","policyId":"ANS023","section":"full","text":"말산업 청년인턴 취업지원 | 공고 원문 2/2\n사업체와 근로계약서 체결일로부터 10개월(1회 연장가능)\n경기도 사업계획에 따라 지원내용 등 변경될 수 있음\n성과 및 기대효과\n성공적인 말산업 종사자 정착 도모 및 신규인력 유입 촉진\n담당부서\n농업정책과 축산정책팀(031-481-2322)"},{"id":"ANS024#overview","policyId":"ANS024","section":"overview","text":"청년창업농 영농정착지원 | 개요\n- 분야: 교육일자리\n- 한 줄 요약: 영농정착 지원금 (월 최대 110만원, 3년)\n- 대상: 만 18~39세, 거주 조건 없음(주소와 관계없이 신청 가능)\n- 조건: 독립영농경영 3년 이하","say":"청년창업농 영농정착지원은 교육일자리 분야 사업이에요. 영농정착 지원금 (월 최대 110만원, 3년). 대상은 만 18~39세, 거주 조건은 '거주 무관'이에요."},{"id":"ANS024#target","policyId":"ANS024","section":"target","text":"청년창업농 영농정착지원 | 지원 대상\n- 나이: 만 18~39세\n- 거주: 거주 조건 없음(주소와 관계없이 신청 가능)\n- 그 밖의 조건(본인 확인): 독립영농경영 3년 이하","say":"나이 조건은 만 18~39세예요. 거주 조건은 없어요. 주소와 관계없이 신청할 수 있어요. 그 밖에 '독립영농경영 3년 이하' 조건은 직접 확인해 주세요."},{"id":"ANS024#benefit","policyId":"ANS024","section":"benefit","text":"청년창업농 영농정착지원 | 지원 내용\n- 내용: 영농정착 지원금 (월 최대 110만원, 3년)\n- 상세: 영농정착 지원금(1년차 월 110만원 → 3년차 월 90만원)\n- 금액: 월 최대 110만원(3년)","say":"지원 내용은 '영농정착 지원금 (월 최대 110만원, 3년)'이에요. 상세: 영농정착 지원금(1년차 월 110만원 → 3년차 월 90만원)."},{"id":"ANS024#period","policyId":"ANS024","section":"period","text":"청년창업농 영농정착지원 | 신청 기간\n- 접수 기간: 수집한 자료에 날짜가 없음(공고문에서 확인)","say":"수집한 자료에는 접수 날짜가 없어요. 안산시청 원문에서 확인해 주세요.","thin":true},{"id":"ANS024#method","policyId":"ANS024","section":"method","text":"청년창업농 영농정착지원 | 신청 방법\n- 신청 방법: 수집한 자료에 없음(공고문에서 확인)","say":"수집한 자료에는 신청 방법이 없어요. 안산시청 원문의 신청 안내를 확인해 주세요.","thin":true},{"id":"ANS024#contact","policyId":"ANS024","section":"contact","text":"청년창업농 영농정착지원 | 문의처\n- 담당: 농업기술지원과 영농기획팀 031-481-2567","say":"담당은 농업기술지원과 영농기획팀 031-481-2567이에요."},{"id":"ANS024#notes","policyId":"ANS024","section":"notes","text":"청년창업농 영농정착지원 | 참고\n- 만 40세 미만이 대상이에요","say":"만 40세 미만이 대상이에요."},{"id":"ANS024#full1","policyId":"ANS024","section":"full","text":"청년창업농 영농정착지원 | 공고 원문 1/1\n추진배경,사업개요,주요내용,성과 및 기대효과,담당부서 순으로 정보를 제공합니다\n추진배경\n젊고 유능한 인재의 농업분야 진출을 촉진하여 건실한 경영체로 성장을 유도\n사업개요\n대 상 : 만18세 이상 ~ 만 40세 미만 독립영농경영 3년 이하\n주요내용\n소득이 불안한 영농초기 3년 동안 청년농업인 영농정착 지원금 지급\n(1년차 110만원/월, 2년차 100만원/월, 3년차 90만원/월)\n성과 및 기대효과\n농업인력 구조개선을 통한 농가 고령화 추세 완화\n담당부서\n농업기술지원과 영농기획팀(031-481-2567)"},{"id":"ANS025#overview","policyId":"ANS025","section":"overview","text":"청년어촌정착지원 | 개요\n- 분야: 교육일자리\n- 한 줄 요약: 어촌정착 지원금 (월 최대 110만원, 3년)\n- 대상: 만 18~39세, 거주 조건 없음(주소와 관계없이 신청 가능)\n- 조건: 독립수산업경영 3년 이하","say":"청년어촌정착지원은 교육일자리 분야 사업이에요. 어촌정착 지원금 (월 최대 110만원, 3년). 대상은 만 18~39세, 거주 조건은 '거주 무관'이에요."},{"id":"ANS025#target","policyId":"ANS025","section":"target","text":"청년어촌정착지원 | 지원 대상\n- 나이: 만 18~39세\n- 거주: 거주 조건 없음(주소와 관계없이 신청 가능)\n- 그 밖의 조건(본인 확인): 독립수산업경영 3년 이하","say":"나이 조건은 만 18~39세예요. 거주 조건은 없어요. 주소와 관계없이 신청할 수 있어요. 그 밖에 '독립수산업경영 3년 이하' 조건은 직접 확인해 주세요."},{"id":"ANS025#benefit","policyId":"ANS025","section":"benefit","text":"청년어촌정착지원 | 지원 내용\n- 내용: 어촌정착 지원금 (월 최대 110만원, 3년)\n- 상세: 어촌정착 지원금(1년차 월 110만원 → 3년차 월 90만원)\n- 금액: 월 최대 110만원(3년)","say":"지원 내용은 '어촌정착 지원금 (월 최대 110만원, 3년)'이에요. 상세: 어촌정착 지원금(1년차 월 110만원 → 3년차 월 90만원)."},{"id":"ANS025#period","policyId":"ANS025","section":"period","text":"청년어촌정착지원 | 신청 기간\n- 접수 기간: 2026.11.17 ~ 2026.12.04\n- 안내: 신청기간 : 2026. 11. 17.(화) ~ 2026. 12. 4.(금)","say":"수집한 공고의 접수 기간은 2026.11.17 ~ 2026.12.04이에요. 안내: 신청기간 : 2026. 11. 17.(화) ~ 2026. 12. 4.(금)."},{"id":"ANS025#method","policyId":"ANS025","section":"method","text":"청년어촌정착지원 | 신청 방법\n- 신청 방법: 수집한 자료에 없음(공고문에서 확인)","say":"수집한 자료에는 신청 방법이 없어요. 안산시청 원문의 신청 안내를 확인해 주세요.","thin":true},{"id":"ANS025#contact","policyId":"ANS025","section":"contact","text":"청년어촌정착지원 | 문의처\n- 담당: 대부해양본부 해양수산과 031-481-3954","say":"담당은 대부해양본부 해양수산과 031-481-3954예요."},{"id":"ANS025#notes","policyId":"ANS025","section":"notes","text":"청년어촌정착지원 | 참고\n- 만 40세 미만이 대상이에요","say":"만 40세 미만이 대상이에요."},{"id":"ANS025#full1","policyId":"ANS025","section":"full","text":"청년어촌정착지원 | 공고 원문 1/1\n추진배경,사업개요,주요내용,성과 및 기대효과,담당부서 순으로 정보를 제공합니다\n추진배경\n창업 초기 청년 수산업 경영인의 안정적인 어촌 정착을 지원하여 어촌 이탈을 방지하고 우수한 청년인력의 어촌 유치로 어촌 활성화 도모\n사업개요\n대상 : 만18세 이상 ~ 만 40세 미만 3년 이하 독립수산업경영인\n주요내용\n소득이 불안한 창업 초기 3년 동안 청년어업인 어촌정착 지원금 지급\n(1년차 110만원/월, 2년차 100만원/월, 3년차 90만원/월)\n성과 및 기대효과\n어촌인력 구조개선을 통한 어가 고령화 추세 완화\n담당부서\n대부해양본부 해양수산과 (031-481-3954)"},{"id":"ANS028#overview","policyId":"ANS028","section":"overview","text":"청년월세 지원사업 | 개요\n- 분야: 주거복지\n- 한 줄 요약: 월세 현금 지원 (월 최대 20만원, 총 480만원)\n- 대상: 만 19~34세, 거주 조건 없음(주소와 관계없이 신청 가능)\n- 조건: 부모와 별도 거주 무주택 / 청년가구 중위소득 60% 이하·재산 1.22억 이하 / 원가구 중위소득 100% 이하·재산 4.7억 이하","say":"청년월세 지원사업은 주거복지 분야 사업이에요. 월세 현금 지원 (월 최대 20만원, 총 480만원). 대상은 만 19~34세, 거주 조건은 '거주 무관'이에요."},{"id":"ANS028#target","policyId":"ANS028","section":"target","text":"청년월세 지원사업 | 지원 대상\n- 나이: 만 19~34세\n- 거주: 거주 조건 없음(주소와 관계없이 신청 가능)\n- 그 밖의 조건(본인 확인): 부모와 별도 거주 무주택 / 청년가구 중위소득 60% 이하·재산 1.22억 이하 / 원가구 중위소득 100% 이하·재산 4.7억 이하","say":"나이 조건은 만 19~34세예요. 거주 조건은 없어요. 주소와 관계없이 신청할 수 있어요. 그 밖에 '부모와 별도 거주 무주택', '청년가구 중위소득 60% 이하·재산 1.22억 이하 / 원가구 중위소득 100% 이하·재산 4.7억 이하' 조건은 직접 확인해 주세요."},{"id":"ANS028#benefit","policyId":"ANS028","section":"benefit","text":"청년월세 지원사업 | 지원 내용\n- 내용: 월세 현금 지원 (월 최대 20만원, 총 480만원)\n- 상세: 월세 현금 지원(최대 24개월, 생애 1회)\n- 금액: 월 최대 20만원, 총 480만원","say":"지원 내용은 '월세 현금 지원 (월 최대 20만원, 총 480만원)'이에요. 상세: 월세 현금 지원(최대 24개월, 생애 1회)."},{"id":"ANS028#period","policyId":"ANS028","section":"period","text":"청년월세 지원사업 | 신청 기간\n- 접수 기간: 2026.03.30 ~ 2026.05.29\n- 안내: 2026 모집 종료, 지급 2026.9.~\n- 관련 공고: 안산시 공고 제2026-709호(2026-03-30)","say":"수집한 공고의 접수 기간은 2026.03.30 ~ 2026.05.29이에요. 안내: 2026 모집 종료, 지급 2026.9.~."},{"id":"ANS028#method","policyId":"ANS028","section":"method","text":"청년월세 지원사업 | 신청 방법\n- 신청 방법: 복지로 온라인 / 행정복지센터 방문\n- 신청 사이트: 복지로 (https://www.bokjiro.go.kr), 로그인 필요\n- 찾는 법: 로그인한 뒤 검색창에 '청년월세 지원사업' 검색 (사이트 첫 화면으로 열림)","say":"신청 방법은 '복지로 온라인 / 행정복지센터 방문'이에요. 신청 사이트는 복지로예요. 첫 화면이 열리니 로그인한 뒤 검색창에 '청년월세 지원사업'을 검색해 주세요."},{"id":"ANS028#contact","policyId":"ANS028","section":"contact","text":"청년월세 지원사업 | 문의처\n- 담당: 청년정책관 청년지원팀 031-369-1649","say":"담당은 청년정책관 청년지원팀 031-369-1649예요."},{"id":"ANS028#notes","policyId":"ANS028","section":"notes","text":"청년월세 지원사업 | 참고\n- 1991 ~ 2007년생이 대상이에요","say":"1991 ~ 2007년생이 대상이에요."},{"id":"ANS028#full1","policyId":"ANS028","section":"full","text":"청년월세 지원사업 | 공고 원문 1/2\n추진배경,사업개요,주요내용,성과 및 기대효과,담당부서 순으로 정보를 제공합니다\n추진배경\n경제적 어려움을 겪고 있는 청년층의 주거비 부담 경감을 통해 주거안전망 구축과 정주 여건 개선을 확립하고자 함\n사업개요\n신청기간 : 2026. 3. 30. ~ 2026. 5. 29.\n지급기간 : 2026. 9. ~ 2028. 12.\n(매월 25일 지급, 지급일이 휴일이나 주말인 경우 전날 지급)\n대상청년：19~34세 이하 부모님과 별도 거주 무주택 청년\n* 2026년 신청 나이 : 1991. 01. 01. ~ 2007. 12. 31. 출생자\n청년가구 기준 중위소득 60%이하(1인 153만원) 및 재산 122백만원 이하\n원가구 기준 중위소득 100%이하(3인 535만원) 및 재산 470백만원 이하\n주요내용"},{"id":"ANS028#full2","policyId":"ANS028","section":"full","text":"청년월세 지원사업 | 공고 원문 2/2\n지원내용 : 월 최대 20만원, 최대 24개월(총 480만원 현금 지급), 생애 1회\n주거급여 수급자의 경우 청년월세 지원액에서 주거급여액 월차임분(청년 주거급여 분리지급액 포함)을 차감한 금액만 지원\n신청방법 : 온라인\n(복지로 www.bokjiro.go.kr)\n, 오프라인(관할동 행정복지센터)\n성과 및 기대효과\n경제적 어려움을 겪는 청년층의 주거비 부담경감\n담당부서\n청년정책관 청년지원팀(031-369-1649) 또는 관할 행정복지센터 청년월세 담당자"},{"id":"ANS035#overview","policyId":"ANS035","section":"overview","text":"청년내일저축계좌 | 개요\n- 분야: 주거복지\n- 한 줄 요약: 본인 월 10만원 적립 + 근로소득장려금 월 30만원 (3년)\n- 대상: 만 15~39세, 거주 조건 없음(주소와 관계없이 신청 가능)\n- 조건: 가구 기준 중위소득 50% 이하(차상위 이하) / 근로(월 10만원 이상 근로소득)","say":"청년내일저축계좌는 주거복지 분야 사업이에요. 본인 월 10만원 적립 + 근로소득장려금 월 30만원 (3년). 대상은 만 15~39세, 거주 조건은 '거주 무관'이에요."},{"id":"ANS035#target","policyId":"ANS035","section":"target","text":"청년내일저축계좌 | 지원 대상\n- 나이: 만 15~39세\n- 거주: 거주 조건 없음(주소와 관계없이 신청 가능)\n- 그 밖의 조건(본인 확인): 가구 기준 중위소득 50% 이하(차상위 이하) / 근로(월 10만원 이상 근로소득)","say":"나이 조건은 만 15~39세예요. 거주 조건은 없어요. 주소와 관계없이 신청할 수 있어요. 그 밖에 '가구 기준 중위소득 50% 이하(차상위 이하)', '근로(월 10만원 이상 근로소득)' 조건은 직접 확인해 주세요."},{"id":"ANS035#benefit","policyId":"ANS035","section":"benefit","text":"청년내일저축계좌 | 지원 내용\n- 내용: 본인 월 10만원 적립 + 근로소득장려금 월 30만원 (3년)\n- 금액: 3년 장려금 1,080만원","say":"지원 내용은 '본인 월 10만원 적립 + 근로소득장려금 월 30만원 (3년)'이에요. 금액은 3년 장려금 1,080만원이에요."},{"id":"ANS035#period","policyId":"ANS035","section":"period","text":"청년내일저축계좌 | 신청 기간\n- 안내: 2026년 차상위 초과자 모집 중단","say":"안내: 2026년 차상위 초과자 모집 중단."},{"id":"ANS035#method","policyId":"ANS035","section":"method","text":"청년내일저축계좌 | 신청 방법\n- 신청 방법: 행정복지센터 방문","say":"신청 방법은 '행정복지센터 방문'이에요."},{"id":"ANS035#contact","policyId":"ANS035","section":"contact","text":"청년내일저축계좌 | 문의처\n- 담당: 복지정책과 031-481-2377","say":"담당은 복지정책과 031-481-2377이에요."},{"id":"ANS035#full1","policyId":"ANS035","section":"full","text":"청년내일저축계좌 | 공고 원문 1/2\n추진배경,사업개요,주요내용,성과 및 기대효과,담당부서 순으로 정보를 제공합니다\n추진배경\n최근 높은 청년실업률이 사회문제로 대두됨에 따라 근로빈곤층으로의 하락을 선제적으로 예방하고 일하는 청년계층이 사회에 무사히 안착하고 자산을 형성할 수 있도록 정부에서 지원\n사업개요\n지원내용(3년만기)\n차상위 이하(기준 중위소득 50% 이하)\n본인적립금 매월 10만원 ＋ 월 근로소득장려금(30만원) = 근로소득장려금 1,080만원\n차상위 초과(기준 중위소득 50% 초과 ~ 100% 이하)\n본인적립금 매월 10만원 + 월 근로소득장려금(10만원) = 근로소득장려금 360만원\n2026년 차상위초과자 모집 중단으로 기 가입자 유지ㆍ지원\n지원조건\n3년간 근로활동 지속, 자립역량교육 10시간 이수, 자금사용계획서 제출\n주요내용"},{"id":"ANS035#full2","policyId":"ANS035","section":"full","text":"청년내일저축계좌 | 공고 원문 2/2\n가입대상\n복합청년몰 현황 -구분,차상위 이하 순으로 내용을 전달합니다.\n구분\n차상위 이하\n가구소득\n기준 중위소득 50% 이하\n연령\n신청 당시 만 15세 이상 ~ 만 39세 이하\n근로기준\n월 10만원 이상\n3가지 조건 모두 충족 시 가입가능\n유의사항\n본인적립금을 입금하지 않는 경우 해당 월 근로소득장려금 미지급\n정기확인 조사 시 근로활동 없는 가입자로 확인될 경우, 장려금 전액 환수 및 해지\n성과 및 기대효과\n저소득 청년근로자의 목돈 마련에 도움을 주어 소득 안전망을 강화하고 근로의욕을 고취하고자 함.\n담당부서\n안산시 복지정책과(031-481-2377) 또는 관할 행정복지센터"},{"id":"ANS036#overview","policyId":"ANS036","section":"overview","text":"일상돌봄서비스 | 개요\n- 분야: 주거복지\n- 한 줄 요약: 재가돌봄·가사·병원동행·심리지원 등\n- 대상: 만 13~64세, 거주 조건 없음(주소와 관계없이 신청 가능)\n- 조건: 소득 제한 없음(본인부담 차등)","say":"일상돌봄서비스는 주거복지 분야 사업이에요. 재가돌봄·가사·병원동행·심리지원 등. 대상은 만 13~64세, 거주 조건은 '거주 무관'이에요."},{"id":"ANS036#target","policyId":"ANS036","section":"target","text":"일상돌봄서비스 | 지원 대상\n- 나이: 만 13~64세\n- 거주: 거주 조건 없음(주소와 관계없이 신청 가능)\n- 그 밖의 조건(본인 확인): 소득 제한 없음(본인부담 차등)","say":"나이 조건은 만 13~64세예요. 거주 조건은 없어요. 주소와 관계없이 신청할 수 있어요. 그 밖에 '소득 제한 없음(본인부담 차등)' 조건은 직접 확인해 주세요."},{"id":"ANS036#benefit","policyId":"ANS036","section":"benefit","text":"일상돌봄서비스 | 지원 내용\n- 내용: 재가돌봄·가사·병원동행·심리지원 등","say":"지원 내용은 '재가돌봄·가사·병원동행·심리지원 등'이에요."},{"id":"ANS036#period","policyId":"ANS036","section":"period","text":"일상돌봄서비스 | 신청 기간\n- 안내: 연중","say":"안내: 연중."},{"id":"ANS036#method","policyId":"ANS036","section":"method","text":"일상돌봄서비스 | 신청 방법\n- 신청 방법: 행정복지센터 방문","say":"신청 방법은 '행정복지센터 방문'이에요."},{"id":"ANS036#contact","policyId":"ANS036","section":"contact","text":"일상돌봄서비스 | 문의처\n- 담당: 복지정책과 031-481-2833","say":"담당은 복지정책과 031-481-2833이에요."},{"id":"ANS036#notes","policyId":"ANS036","section":"notes","text":"일상돌봄서비스 | 참고\n- 가족돌봄 청년은 39세 이하가 대상이에요","say":"가족돌봄 청년은 39세 이하가 대상이에요."},{"id":"ANS036#full1","policyId":"ANS036","section":"full","text":"일상돌봄서비스 | 공고 원문 1/2\n추진배경,사업개요,주요내용,성과 및 기대효과,담당부서 순으로 정보를 제공합니다\n추진배경\n돌봄이 필요한 중장년과 청년(질병, 부상, 고립 등), 가족돌봄청년 등 일상생활에 도움이 필요한 대상에게 재가 돌봄ㆍ가사, 병원 동행, 심리지원 등 서비스를 통합적으로 제공\n사업개요\n기간 : 연중\n대상\n질병, 부상, 고립을 겪는 청ㆍ중장년 13세 이상 64세 이하\n일상생활이 어려운 가족을 돌보는 청(소)년 39세 이하\n내용 : 재가돌봄가사 기본 서비스 및 특화서비스 지원\n주요내용\n대상자 욕구에 따라 기본 및 특화서비스 1년(최대 3년) 지원\n서비스 -구분,서비스명,제공시간(월),서비스 수혜자,비고 순으로 내용을 전달합니다.\n구분\n서비스명\n제공시간(월)\n서비스 수혜자\n비고\n기본 서비스\n재가 돌봄ㆍ가사\nA형\n(기본돌봄형)"},{"id":"ANS036#full2","policyId":"ANS036","section":"full","text":"일상돌봄서비스 | 공고 원문 2/2\n재가돌봄+가사\n+긴급돌봄\n+동행지원\n36시간\n돌봄 필요 청ㆍ중장년\n가족돌봄 청년가구의 돌봄대상가족\n특화 1개 가능\nC형\n(추가돌봄형)\n72시간\n특화 미제공\nB형\n(추가가사형)\n가사만 지원\n24시간\n특화 2개 가능\nD형\n(특화형)\n특화만 지원\n-\n특화 2개 가능\n특화 서비스\n식사관리\n8회\n병원동행\n16시간\n찾아가는 맞춤재활\n4회\n심리지원\n4회\n돌봄 필요 청ㆍ중장년\n가족돌봄 청년\n청년신체건강증진\n8회\n돌봄필요중장년 제외\n소득제한 없이 신청 가능하나, 소득수준별 본인부담 차등 부담\n성과 및 기대효과\n돌봄이 필요한 중장년과 청년 대상 서비스 제공으로 서비스 사각지대를 해소하고 삶의 질 향상 제고\n담당부서\n복지국 복지정책과 (031-481-2833)"},{"id":"ANS038#overview","policyId":"ANS038","section":"overview","text":"전세보증금반환보증 보증료 지원 | 개요\n- 분야: 주거복지\n- 한 줄 요약: 반환보증 보증료 실납부액 지원 (최대 30만원)\n- 대상: 나이 제한 없음, 거주 조건 없음(주소와 관계없이 신청 가능)\n- 조건: 무주택 임차인, 보증금 3억 이하, 반환보증 가입 / 청년 연소득 5천만원 이하","say":"전세보증금반환보증 보증료 지원은 주거복지 분야 사업이에요. 반환보증 보증료 실납부액 지원 (최대 30만원). 대상은 나이 제한 없음, 거주 조건은 '거주 무관'이에요."},{"id":"ANS038#target","policyId":"ANS038","section":"target","text":"전세보증금반환보증 보증료 지원 | 지원 대상\n- 나이: 나이 제한 없음\n- 거주: 거주 조건 없음(주소와 관계없이 신청 가능)\n- 그 밖의 조건(본인 확인): 무주택 임차인, 보증금 3억 이하, 반환보증 가입 / 청년 연소득 5천만원 이하","say":"나이 제한은 없어요. 거주 조건은 없어요. 주소와 관계없이 신청할 수 있어요. 그 밖에 '무주택 임차인, 보증금 3억 이하, 반환보증 가입', '청년 연소득 5천만원 이하' 조건은 직접 확인해 주세요."},{"id":"ANS038#benefit","policyId":"ANS038","section":"benefit","text":"전세보증금반환보증 보증료 지원 | 지원 내용\n- 내용: 반환보증 보증료 실납부액 지원 (최대 30만원)\n- 금액: 최대 30만원","say":"지원 내용은 '반환보증 보증료 실납부액 지원 (최대 30만원)'이에요."},{"id":"ANS038#period","policyId":"ANS038","section":"period","text":"전세보증금반환보증 보증료 지원 | 신청 기간\n- 안내: 페이지엔 2025년 신청기간만 기재","say":"안내: 페이지엔 2025년 신청기간만 기재."},{"id":"ANS038#method","policyId":"ANS038","section":"method","text":"전세보증금반환보증 보증료 지원 | 신청 방법\n- 신청 방법: 경기민원24 온라인\n- 신청 사이트: 경기민원24 (https://gg24.gg.go.kr), 로그인 필요\n- 찾는 법: 로그인한 뒤 검색창에 '전세보증금반환보증 보증료 지원' 검색 (사이트 첫 화면으로 열림)","say":"신청 방법은 '경기민원24 온라인'이에요. 신청 사이트는 경기민원24예요. 첫 화면이 열리니 로그인한 뒤 검색창에 '전세보증금반환보증 보증료 지원'을 검색해 주세요."},{"id":"ANS038#contact","policyId":"ANS038","section":"contact","text":"전세보증금반환보증 보증료 지원 | 문의처\n- 담당: 통합돌봄과 031-481-2618","say":"담당은 통합돌봄과 031-481-2618이에요."},{"id":"ANS038#notes","policyId":"ANS038","section":"notes","text":"전세보증금반환보증 보증료 지원 | 참고\n- 2026년 신청 일정은 확인이 필요해요(페이지엔 2025년 일정만 있어요).","say":"2026년 신청 일정은 확인이 필요해요(페이지엔 2025년 일정만 있어요)."},{"id":"ANS038#full1","policyId":"ANS038","section":"full","text":"전세보증금반환보증 보증료 지원 | 공고 원문 1/2\n추진배경,사업개요,주요내용,성과 및 기대효과,담당부서 순으로 정보를 제공합니다\n추진배경\n사회초년생 등 청년 임차인의 전세보증금 미반환 피해를 사전에 예방하여 주거안정 도모\n사업개요\n신청기간 : 2025. 1. 1. ~ 2025. 12. 31.(※ 예산소진시 조기 마감)\n지급기간 : 신청일 기준 유효한 전세금반환보증(HUG, HF, SGI)에 가입한 임차보증금 3억원 이하, 연소득 (청년) 5천만원, (청년 외) 6천만원, (신혼부부) 7.5천만원 이하인 무주택 임차인\n접수방법：경기민원24\n(https://gg24.gg.go.kr)\n온라인 신청\n구비서류\n전세보증금반환보증 보증증서, 보증료 납부 증빙서류(납부액 기재)\n임대차계약서, 부동산 등기사항 전부증명서\n주민등록등본, 혼인관계증명서\n본인명의 통장 사본"},{"id":"ANS038#full2","policyId":"ANS038","section":"full","text":"전세보증금반환보증 보증료 지원 | 공고 원문 2/2\n전년도 소득금액증명\n소득이 발생하지 않아 소득금액증명이 발급되지 않는 경우에는 ‘사실증명(신고사실없음)’ 제출\n기혼자는 배우자의 소득증빙 서류도 필수 제출\n주요내용\n지원내용 :\n(청년, 신혼부부) 실 납부 전세보증금반환보증 보증료(최대 30만원)\n(청년 외) 실납부 보증료 90%지원(최대 30만원)\n성과 및 기대효과\n청년층의 전세보증금반환보증 가입을 유도하여 전세사기 피해 예방\n담당부서\n안산시 통합돌봄과(031-481-2618) 또는 관할 행정복지센터"},{"id":"ANS039#overview","policyId":"ANS039","section":"overview","text":"자립준비청년 자립정착금 | 개요\n- 분야: 주거복지\n- 한 줄 요약: 자립정착금 1,500만원 (2회 분할)\n- 대상: 나이 제한 없음, 거주 조건 없음(주소와 관계없이 신청 가능)\n- 조건: 보호종료 자립준비청년","say":"자립준비청년 자립정착금은 주거복지 분야 사업이에요. 자립정착금 1,500만원 (2회 분할). 대상은 나이 제한 없음, 거주 조건은 '거주 무관'이에요."},{"id":"ANS039#target","policyId":"ANS039","section":"target","text":"자립준비청년 자립정착금 | 지원 대상\n- 나이: 나이 제한 없음\n- 거주: 거주 조건 없음(주소와 관계없이 신청 가능)\n- 그 밖의 조건(본인 확인): 보호종료 자립준비청년","say":"나이 제한은 없어요. 거주 조건은 없어요. 주소와 관계없이 신청할 수 있어요. 그 밖에 '보호종료 자립준비청년' 조건은 직접 확인해 주세요."},{"id":"ANS039#benefit","policyId":"ANS039","section":"benefit","text":"자립준비청년 자립정착금 | 지원 내용\n- 내용: 자립정착금 1,500만원 (2회 분할)\n- 금액: 1,500만원","say":"지원 내용은 '자립정착금 1,500만원 (2회 분할)'이에요."},{"id":"ANS039#period","policyId":"ANS039","section":"period","text":"자립준비청년 자립정착금 | 신청 기간\n- 접수 기간: 수집한 자료에 날짜가 없음(공고문에서 확인)","say":"수집한 자료에는 접수 날짜가 없어요. 안산시청 원문에서 확인해 주세요.","thin":true},{"id":"ANS039#method","policyId":"ANS039","section":"method","text":"자립준비청년 자립정착금 | 신청 방법\n- 신청 방법: 행정복지센터·아동권리과 방문","say":"신청 방법은 '행정복지센터·아동권리과 방문'이에요."},{"id":"ANS039#contact","policyId":"ANS039","section":"contact","text":"자립준비청년 자립정착금 | 문의처\n- 담당: 아동권리과 아동보호팀 031-481-2319","say":"담당은 아동권리과 아동보호팀 031-481-2319예요."},{"id":"ANS039#full1","policyId":"ANS039","section":"full","text":"자립준비청년 자립정착금 | 공고 원문 1/2\n추진배경,사업개요,주요내용,성과 및 기대효과,담당부서 순으로 정보를 제공합니다\n추진배경\n자립준비청년(보호종료아동)의 보호종료 후 안정적 사회 안착을 위해 자립기반 마련 지원\n사업개요\n사업대상 : 만 15세 이후 아동복지시설 및 가정위탁 보호가 조기 종료되었거나\n(단, 아동복지법 시행(’24.2.9)이후 만 18 세가 된 자부터 적용), 만 18세 이후 보호종료된 자립준비청년(보호종료아동)\n※ 보호 조기종료 후 원가정 복귀한 경우 지원 불가\n신청방법 : 필수 서류 구비하여 관할 동행정복지센터 혹은 안산시청 아동권리과 방문신청\n주요내용\n1인당 1,500만원 지급(1차:1000만원, 2차:500만원)\n성과 및 기대효과"},{"id":"ANS039#full2","policyId":"ANS039","section":"full","text":"자립준비청년 자립정착금 | 공고 원문 2/2\n아동복지시설 퇴소 및 가정위탁 종료 아동의 자립을 위한 최소한의 생활비용을 지원함으로써 건전한 홀로서기 뒷받침을 제공하고자 함\n담당부서\n아동권리과 아동보호팀(031-481-2319)"},{"id":"ANS040#overview","policyId":"ANS040","section":"overview","text":"자립준비청년 자립수당 | 개요\n- 분야: 주거복지\n- 한 줄 요약: 매월 50만원 현금 (최대 60회)\n- 대상: 나이 제한 없음, 거주 조건 없음(주소와 관계없이 신청 가능)\n- 조건: 보호종료 5년 이내","say":"자립준비청년 자립수당은 주거복지 분야 사업이에요. 매월 50만원 현금 (최대 60회). 대상은 나이 제한 없음, 거주 조건은 '거주 무관'이에요."},{"id":"ANS040#target","policyId":"ANS040","section":"target","text":"자립준비청년 자립수당 | 지원 대상\n- 나이: 나이 제한 없음\n- 거주: 거주 조건 없음(주소와 관계없이 신청 가능)\n- 그 밖의 조건(본인 확인): 보호종료 5년 이내","say":"나이 제한은 없어요. 거주 조건은 없어요. 주소와 관계없이 신청할 수 있어요. 그 밖에 '보호종료 5년 이내' 조건은 직접 확인해 주세요."},{"id":"ANS040#benefit","policyId":"ANS040","section":"benefit","text":"자립준비청년 자립수당 | 지원 내용\n- 내용: 매월 50만원 현금 (최대 60회)\n- 금액: 월 50만원","say":"지원 내용은 '매월 50만원 현금 (최대 60회)'예요. 금액은 월 50만원이에요."},{"id":"ANS040#period","policyId":"ANS040","section":"period","text":"자립준비청년 자립수당 | 신청 기간\n- 접수 기간: 수집한 자료에 날짜가 없음(공고문에서 확인)","say":"수집한 자료에는 접수 날짜가 없어요. 안산시청 원문에서 확인해 주세요.","thin":true},{"id":"ANS040#method","policyId":"ANS040","section":"method","text":"자립준비청년 자립수당 | 신청 방법\n- 신청 방법: 행정복지센터 방문 / 복지로 온라인\n- 신청 사이트: 복지로 (https://www.bokjiro.go.kr), 로그인 필요\n- 찾는 법: 로그인한 뒤 검색창에 '자립준비청년 자립수당' 검색 (사이트 첫 화면으로 열림)","say":"신청 방법은 '행정복지센터 방문 / 복지로 온라인'이에요. 신청 사이트는 복지로예요. 첫 화면이 열리니 로그인한 뒤 검색창에 '자립준비청년 자립수당'을 검색해 주세요."},{"id":"ANS040#contact","policyId":"ANS040","section":"contact","text":"자립준비청년 자립수당 | 문의처\n- 담당: 아동권리과 아동보호팀 031-481-2319","say":"담당은 아동권리과 아동보호팀 031-481-2319예요."},{"id":"ANS040#full1","policyId":"ANS040","section":"full","text":"자립준비청년 자립수당 | 공고 원문 1/2\n추진배경,사업개요,주요내용,성과 및 기대효과,담당부서 순으로 정보를 제공합니다\n추진배경\n자립준비청년(보호종료아동)의 보호종료 후 안정적 자립을 위한 경제적·제도적 지원 필요성 대두\n사업개요\n사업대상 : 아동복지시설, 가정위탁 보호종료 아동 중 보호종료일을 기준으로 과거\n2년 이상 연속하여 보호받은 자로서 다음 사항 중 어느 하나에 해당하는 경우\n만 18세 이후 만기 또는 연장 보호 종료된 자로서 보호종료 5년 이내인 자\n만 15세 이후 보호조치가 조기 종료된 자로서 만 18세가 된 때로부터 5년 이내인 자\n(단, 아동복지법 시행(’24.2.9.)이후 만 18세가 된 자부터 적용)\n※ 보호 조기종료 후 원가정 복귀, 타 법령상 자립지원수당 수급시 지원 불가"},{"id":"ANS040#full2","policyId":"ANS040","section":"full","text":"자립준비청년 자립수당 | 공고 원문 2/2\n신청방법 : 필수서류 구비하여 관할 동행정복지센터 방문신청 혹은 온라인 신청(복지로)\n주요내용\n본인 명의 계좌로 매월 50만원 현금 지급\n보호종료일이 속한 달부터 최대 60회차까지 가능\n성과 및 기대효과\n자립준비청년(보호종료아동)에게 보호종료 후 경제적 부담을 완화하고 복지향상을 통해 성공적인 자립에 기여\n담당부서\n아동권리과 아동보호팀(031-481-2319)"},{"id":"ANS048#overview","policyId":"ANS048","section":"overview","text":"청년 공공주택(매입·전세임대) | 개요\n- 분야: 주거복지\n- 한 줄 요약: LH 전세임대(1인 1.2억 한도)·매입임대\n- 대상: 만 19~39세, 거주 조건 없음(주소와 관계없이 신청 가능)\n- 조건: 무주택 / 소득·자산 기준(공고문 참조)","say":"청년 공공주택(매입·전세임대)는 주거복지 분야 사업이에요. LH 전세임대(1인 1.2억 한도)·매입임대. 대상은 만 19~39세, 거주 조건은 '거주 무관'이에요."},{"id":"ANS048#target","policyId":"ANS048","section":"target","text":"청년 공공주택(매입·전세임대) | 지원 대상\n- 나이: 만 19~39세\n- 거주: 거주 조건 없음(주소와 관계없이 신청 가능)\n- 그 밖의 조건(본인 확인): 무주택 / 소득·자산 기준(공고문 참조)","say":"나이 조건은 만 19~39세예요. 거주 조건은 없어요. 주소와 관계없이 신청할 수 있어요. 그 밖에 '무주택', '소득·자산 기준(공고문 참조)' 조건은 직접 확인해 주세요."},{"id":"ANS048#benefit","policyId":"ANS048","section":"benefit","text":"청년 공공주택(매입·전세임대) | 지원 내용\n- 내용: LH 전세임대(1인 1.2억 한도)·매입임대\n- 금액: 전세금 지원 1인 1.2억원","say":"지원 내용은 'LH 전세임대(1인 1.2억 한도)·매입임대'예요. 금액은 전세금 지원 1인 1.2억원이에요."},{"id":"ANS048#period","policyId":"ANS048","section":"period","text":"청년 공공주택(매입·전세임대) | 신청 기간\n- 안내: LH 공고 시","say":"안내: LH 공고 시."},{"id":"ANS048#method","policyId":"ANS048","section":"method","text":"청년 공공주택(매입·전세임대) | 신청 방법\n- 신청 방법: LH 청약(LH청약플러스)\n- 신청 사이트: LH청약플러스 (https://apply.lh.or.kr), 로그인 필요\n- 찾는 법: 로그인한 뒤 검색창에 '청년 공공주택' 검색 (사이트 첫 화면으로 열림)","say":"신청 방법은 'LH 청약(LH청약플러스)'예요. 신청 사이트는 LH청약플러스예요. 첫 화면이 열리니 로그인한 뒤 검색창에 '청년 공공주택'을 검색해 주세요."},{"id":"ANS048#contact","policyId":"ANS048","section":"contact","text":"청년 공공주택(매입·전세임대) | 문의처\n- 담당: LH 1600-1004","say":"담당은 LH 1600-1004예요."},{"id":"ANS048#notes","policyId":"ANS048","section":"notes","text":"청년 공공주택(매입·전세임대) | 참고\n- 대학생·취업준비생도 대상에 포함돼요","say":"대학생·취업준비생도 대상에 포함돼요."},{"id":"ANS048#full1","policyId":"ANS048","section":"full","text":"청년 공공주택(매입·전세임대) | 공고 원문 1/2\n추진배경,사업개요,주요내용,성과 및 기대효과,담당부서 순으로 정보를 제공합니다\n추진배경\n청년들의 주거비부담 완화를 위하여 저렴하게 임대하는 공공임대주택\n사업개요\n전세임대란?\n기존주택을 전세계약을 체결하여 저렴하게 재임대하는 제도\n전세금 지원 한도액: 1인거주 1.2억원, 2인거주 1.5억원, 3인거주 2.0억원(수도권기준)\n매입임대란?\n민간주택을 매입하여 임대해주는 정책\n주요내용\n입주대상(우선순위등 자세한 사항은 공고문을 참조)\n전세임대: 무주택요건 및 소득·자산기준을 충족하는대학생, 취업준비생, 만 19세~39세\n본인이 무주택자이고 사업대상지역내 대학에 재학중이거나 입학예정인 대학생\n본인이 무주택자이고 대학 또는 고등·고등기술학교를 졸업하거나 중퇴한 후 2년 이내이며 직장에 재직중이지 않은 자"},{"id":"ANS048#full2","policyId":"ANS048","section":"full","text":"청년 공공주택(매입·전세임대) | 공고 원문 2/2\n본인이 무주택자이면서 만 19세 이상 39세 이하인 사람\n매입임대: 전세임대와 동일\n성과 및 기대효과\n안정적이고 저렴한 주택공급을 통한 주거권 보장\n담당부서\nLH(1600-1004)"},{"id":"ANS050#overview","policyId":"ANS050","section":"overview","text":"e스포츠 페스티벌 | 개요\n- 분야: 문화예술\n- 한 줄 요약: e스포츠 대회·체험\n- 대상: 나이 제한 없음, 거주 조건 없음(주소와 관계없이 신청 가능)","say":"e스포츠 페스티벌은 문화예술 분야 사업이에요. e스포츠 대회·체험. 대상은 나이 제한 없음, 거주 조건은 '거주 무관'이에요."},{"id":"ANS050#target","policyId":"ANS050","section":"target","text":"e스포츠 페스티벌 | 지원 대상\n- 나이: 나이 제한 없음\n- 거주: 거주 조건 없음(주소와 관계없이 신청 가능)\n- 공고 원문: \"참여대상 : e스포츠를 좋아하는 누구나\"","say":"나이 제한은 없어요. 거주 조건은 없어요. 주소와 관계없이 신청할 수 있어요.","quote":"참여대상 : e스포츠를 좋아하는 누구나"},{"id":"ANS050#benefit","policyId":"ANS050","section":"benefit","text":"e스포츠 페스티벌 | 지원 내용\n- 내용: e스포츠 대회·체험","say":"지원 내용은 'e스포츠 대회·체험'이에요."},{"id":"ANS050#period","policyId":"ANS050","section":"period","text":"e스포츠 페스티벌 | 신청 기간\n- 접수 기간: 2026.08.29 ~ 2026.08.29\n- 안내: 행사일","say":"수집한 공고의 접수 기간은 2026.08.29 ~ 2026.08.29이에요. 안내: 행사일."},{"id":"ANS050#method","policyId":"ANS050","section":"method","text":"e스포츠 페스티벌 | 신청 방법\n- 신청 방법: 수집한 자료에 없음(공고문에서 확인)","say":"수집한 자료에는 신청 방법이 없어요. 안산시청 원문의 신청 안내를 확인해 주세요.","thin":true},{"id":"ANS050#contact","policyId":"ANS050","section":"contact","text":"e스포츠 페스티벌 | 문의처\n- 담당: 청년정책관 031-369-1787","say":"담당은 청년정책관 031-369-1787이에요."},{"id":"ANS050#notes","policyId":"ANS050","section":"notes","text":"e스포츠 페스티벌 | 참고\n- 2026-08-29는 행사일이에요. 누구나 참여할 수 있어요","say":"2026-08-29는 행사일이에요. 누구나 참여할 수 있어요."},{"id":"ANS050#full1","policyId":"ANS050","section":"full","text":"e스포츠 페스티벌 | 공고 원문 1/2\n추진배경,사업개요,주요내용,성과 및 기대효과,담당부서 순으로 정보를 제공합니다\n추진배경\n디지털ㆍ비대면 문화 가속화에 따라 폭발적으로 성장하는 e스포츠 산업\n아시안게임 정식 종목 채택 등 e스포츠에 대한 관심 제고\n사업개요\n행 사 명 : 2026 안산 e스포츠 페스티벌\n행사일정 : 2026. 8. 29.(토)\n참여대상 : e스포츠를 좋아하는 누구나\n주최ㆍ주관 : 안산시\n장 소 : 안산 상록수체육관\n예선 : 온라인 진행 / 결선 : 상록수체육관\n대회종목 : e스포츠 인기 종목(리그오브레전드 등)\n내 용\ne스포츠 전국 대회 및 관내 중ㆍ고교 대항전 개최\n코스프레 존, 브롤스타즈 존, 레트로 게임 존, 보드 게임 존 등 다양한 체험ㆍ참여 프로그램 병행\n성과 및 기대효과"},{"id":"ANS050#full2","policyId":"ANS050","section":"full","text":"e스포츠 페스티벌 | 공고 원문 2/2\n청년 세대의 관심과 수요가 높은 e스포츠를 활성화하여 청년 문화 향유 기회 확대\n전국 단위의 e스포츠 페스티벌을 통해 청년이 즐거운 청년 문화도시 브랜딩\n담당부서\n안산시 청년정책관(031-369-1787)"},{"id":"EXT002#overview","policyId":"EXT002","section":"overview","text":"제4기 온라인 청년패널 | 개요\n- 분야: 참여권리\n- 한 줄 요약: 안산시 정책 설문·제안 참여 (300명), 추첨 모바일 쿠폰\n- 대상: 만 19~39세, 거주 조건 없음(주소와 관계없이 신청 가능)","say":"제4기 온라인 청년패널은 참여권리 분야 사업이에요. 안산시 정책 설문·제안 참여 (300명), 추첨 모바일 쿠폰. 대상은 만 19~39세, 거주 조건은 '거주 무관'이에요."},{"id":"EXT002#target","policyId":"EXT002","section":"target","text":"제4기 온라인 청년패널 | 지원 대상\n- 나이: 만 19~39세\n- 거주: 거주 조건 없음(주소와 관계없이 신청 가능)\n- 공고 n응모작은 본인\n(\n또는 팀\n)\n이 직접 기획\n·\n제작한 순수 창작물이어야 하며\n,\n저작권\n·\n초상권\n·\n음원\n·\n폰트\n·\n대여권 등 법적 문제가 없어야 함"},{"id":"EXT003#full20","policyId":"EXT003","section":"full","text":"2026 안산시 정책 홍보 숏폼 대학생 공모전 | 공고 원문 20/32\n○\nAI\n활용 시 사용 도구명\n·\n활용 과정\n·\n활용 범위를 참가신청서 내\n명시해야 함\n○\nAI 생성물과 관련하여 분쟁 발생 시 모든 책임은 응모자에게 있으며, 주최측은 분쟁에 대해 책임을 지지 않음\n2. 심사 및 수상 관련 유의사항"},{"id":"EXT003#full21","policyId":"EXT003","section":"full","text":"2026 안산시 정책 홍보 숏폼 대학생 공모전 | 공고 원문 21/32\n○\n안산시는 심사 목적으로 작품을 복제하거나 전송할 수 있고 응모자는\n응모 시 이에 동의한 것으로 간주하며, 심사 종료 후 복제 자료는 즉시 폐기함\n○\n심사과정 및 점수 등은 공개하지 않으며\n,\n심사 결과에 대해 이의를\n제기할 수 없음"},{"id":"EXT003#full22","policyId":"EXT003","section":"full","text":"2026 안산시 정책 홍보 숏폼 대학생 공모전 | 공고 원문 22/32\n○\n적격 작품이 없을 경우 시상작의 전부 또는 일부를 선정하지 않을 수 있음\n○\n시상 작품 수 및 시상금 등 세부 내역은 변경될 수 있음\n3. 기타 유의사항\n○\n부득이한 사정 발생 시 공모전 일정이 변경될 수 있으며, 이에 대한 이의를 제기할 수 없음"},{"id":"EXT003#full23","policyId":"EXT003","section":"full","text":"2026 안산시 정책 홍보 숏폼 대학생 공모전 | 공고 원문 23/32\n○\n출품된 작품에 대한 저작권(저작재산권, 저작인격권)은 응모자에게 있으며, 수상 후에도 입상자에게 귀속됨을 원칙으로 함\n○\n안산시는 입상작에 한하여 공익적 홍보 목적 등으로 배포\n·\n복\n제\n·\n2\n차 가공 등의 활용을 할 수 있고\n,\n응모자는 응모와 동시에\n이와 같은 저작물 이용을 허락한 것으로 간주하며, 입상작의 저작재산권에 대한 이용료는 입상에 따른 시상금으로 대체함"},{"id":"EXT003#full24","policyId":"EXT003","section":"full","text":"2026 안산시 정책 홍보 숏폼 대학생 공모전 | 공고 원문 24/32\n○\n팀 응모작이 입상작으로 선정될 경우 상금은 대표자\n1\n인에게 일괄\n지급하며\n,\n상금 배분 등 문제에 대하여 안산시가 관여하지 않음\n○\n상금에 대한 제세공과금은 입상자 본인이 부담함\n○ 타 공모전 입상작\n,\n표절\n,\n도용\n,\n중복 응모 등 기타 부정행위 발생\n시 입상을 취소하며 상장·부상(시상금)은 환수함"},{"id":"EXT003#full25","policyId":"EXT003","section":"full","text":"2026 안산시 정책 홍보 숏폼 대학생 공모전 | 공고 원문 25/32\n○\n주최측은 응모작의 제반 권리를 개별적으로 확인하지 않으며,\n향후 응모작의 저작권 등과 관련한 분쟁이 발생하는 경우\n민·형사상의 모든 책임은 응모자에게 있음\n○\n명시되지 않은 사항 발생 시 관련 법규\n,\n일반적인 사례\n,\n국내 공모전\n운영의 통상적인 관례 등을 참고하여 주최 측의 결정에 따름\n【붙임 1】\n안산시 정책 홍보 숏폼 대학생 공모전 참가신청서\n팀명\n※ 단독 참가 시\n미작성해도 무방함\n팀원수\n명\n홍보분야\n구 분\n성 명\n생년월일\n소속(학교/학과)\n전화번호 및 이메일\n참가자\n(대표자)\n작품이름\n작품설명\n기획의도\n제작과정\n작품내용\n※ AI 활용 시 사용 프로그램명, 활용과정, 활용범위\n제출자료\n①영상파일 ②\n참가신청서 및 개인정보 수집\n·\n이용 동의서\n③\n참가서약서"},{"id":"EXT003#full26","policyId":"EXT003","section":"full","text":"2026 안산시 정책 홍보 숏폼 대학생 공모전 | 공고 원문 26/32\n④재(휴)학증명서(공고일 이후 발급분) ⑤\n초상권자 사용\n동의서(해당자)\n개인정보\n수집·이용\n동의\n개인정보 보호법 제\n15\n조제\n1\n항\n(\n개인정보의 수집\n·\n이용\n)\n에 의거하여 본인의 개인정보를\n제공할 것을 동의합니다.\n• 수집항목 : 성명, 생년월일, 연락처, 주소, 이메일 등\n• 수집목적 : 공모전 참가자 확인 및 심사 진행, 선정 시 공지 및 통보\n• 보유기간 : 1년\n동의함 (\n)\n동의하지 않음(\n)\n동의 여부\n\n필수.\n※ 위 사항에 대해 거부할 수 있으며, 다만 이 경우 참여가 제한됩니다.\n위와 같이\n2026\n안산시 정책 홍보 숏폼 대학생 공모전 참가를 신청합니다\n.\n2026년\n월\n일\n참가자(대표자) :\n(서명)\n안산시장 귀하\n【붙임 2】\n참가서약서\n•"},{"id":"EXT003#full27","policyId":"EXT003","section":"full","text":"2026 안산시 정책 홍보 숏폼 대학생 공모전 | 공고 원문 27/32\n본인은 공모전의 공고문 및 유의사항을 충분히 숙지하였으며 성실히 준수할\n것을 서약합니다\n.\n•\n제출된 작품과 참가서류는 변경할 수 없고 반환되지 않으며\n,\n입상작 이외의\n출품작은 3개월 이내에 파기함을 숙지하며 서약합니다.\n• 심사 과정·결과에 이의를 제기하지 않음을 서약합니다.\n• 심사 목적으로 필요한 범위 내에서 작품을 복제하거나 전송할 수 있음을 동의합니다.\n•\n상금에 대한 제세공과금은 입상자가 부담함을 확인하며\n,\n입상자는 개별통지를\n받은 후 주최측이 요청하는 필요 서류를 제출해야 입상이 가능함을 서약합니다.\n• 본인은 제출한 응모작이 타 공모전 수상작이 아니며, 제3자의 저작권 등\n어떠한 권리도 침해하지 않았음을 보증합니다\n.\n위 보증 사항을 위반할 경우"},{"id":"EXT003#full28","policyId":"EXT003","section":"full","text":"2026 안산시 정책 홍보 숏폼 대학생 공모전 | 공고 원문 28/32\n입상 취소 및 상금 환수 등 주최측의 조치에 이의 없이 따를 것을 동의하며, 이로 인해 주최 측에 손해가 발생할 경우를 포함하여 모든 민·형사상 법적 책임은 전적으로 본인이 부담할 것을 확약합니다.\n•\n부정행위\n(\n표절\n,\n도용\n,\n허위작성 등\n)\n가 확인될 경우 입상 취소 및 상장\n·\n부상\n환수 등의 제재 조치를 따를 것을 서약합니다.\n•\n입상작의 경우 안산시가 공익적 홍보 목적 등으로 저작물을 이용하는 것을\n허락하고, 필요한 범위 내에서 배포 및 2차 가공 등 활용하는 것에 동의합니다.\n본인은 위 내용을 충분히 숙지하였으며, 내용에 동의함을 서약합니다.\n2026년\n월\n일\n서약자 :\n(서명)\n안산시장 귀하\n【붙임 3】\n초상권자 사용동의서"},{"id":"EXT003#full29","policyId":"EXT003","section":"full","text":"2026 안산시 정책 홍보 숏폼 대학생 공모전 | 공고 원문 29/32\n‘2026 안산시 정책 홍보 숏폼 대학생 공모전’과 관련하여 안산시가 수집·이용하는 초상권자의 개인정보에 대하여 관계 법령에 따라 아래와 같이 알려드립니다.\n▶ 수집·이용 항목\n(\n필수항목\n)\n이름\n,\n생년월일\n,\n성별\n,\n연락처\n,\n얼굴\n·\n모습\n·\n음성 등이 포함된 사진\n·\n영상 등"},{"id":"EXT003#full30","policyId":"EXT003","section":"full","text":"2026 안산시 정책 홍보 숏폼 대학생 공모전 | 공고 원문 30/32\n▶ 수집·이용 목적\n• 정보주체(초상권자)의 초상권 사용 동의 사실 확인\n• 공모전 업무 처리 및 수상작 홍보, 공식 홈페이지·SNS 등 온라인 게시\n▶ 이용 및 보유기간\n수집된 개인정보는 공모전이 종료된 시점으로부터 1년간 보관하며, 해당 기간이\n경과한 경우 즉시 파기합니다\n.\n다만\n,\n입상작의 경우 초상권 및 저작권 관리를 위해\n보관합니다."},{"id":"EXT003#full31","policyId":"EXT003","section":"full","text":"2026 안산시 정책 홍보 숏폼 대학생 공모전 | 공고 원문 31/32\n▶ 동의거부 권리\n정보주체(초상권자)는 개인정보 수집에 대한 동의를 거부할 수 있습니다.\n단, 정보주체(초상권자)가 필수 작성사항 기재 및 초상권 사용동의서에 서명을 거부하는 경우 공모전 출품 및 입상이 불가함을 알려드립니다.\n참 가 자\n성\n명\n연락처\n작품명\n초상권자\n성\n명\n연락처\n생년월일\n성\n별\n2026년\n월\n일"},{"id":"EXT003#full32","policyId":"EXT003","section":"full","text":"2026 안산시 정책 홍보 숏폼 대학생 공모전 | 공고 원문 32/32\n▶\n본인의 초상\n(\n얼굴\n,\n음성\n,\n신체 등 식별 가능한 영상\n)\n을 참가자\n에게 사용 허가하도록\n동의하였습니다.\n초상권자\n(서명)\n▶\n참가자\n의 응모작품은 제3자의 초상권 및 기타 제반 권리를 침해하지 않았음을 증명합니다.\n참 가 자\n(서명)"},{"id":"EXT010#overview","policyId":"EXT010","section":"overview","text":"2026 안산시 관광사진 공모전 | 개요\n- 분야: 문화예술\n- 한 줄 요약: 안산 관광지 사진 공모 (최우수 100만원, 총 500만원)\n- 대상: 나이 제한 없음, 거주 조건 없음(주소와 관계없이 신청 가능)","say":"2026 안산시 관광사진 공모전은 문화예술 분야 사업이에요. 안산 관광지 사진 공모 (최우수 100만원, 총 500만원). 대상은 나이 제한 없음, 거주 조건은 '거주 무관'이에요."},{"id":"EXT010#target","policyId":"EXT010","section":"target","text":"2026 안산시 관광사진 공모전 | 지원 대상\n- 나이: 나이 제한 없음\n- 거주: 거주 조건 없음(주소와 관계없이 신청 가능)\n- 공고 원문: \"공모자격 : 대한민국 국민 누구나(개인 또는 팀)\"","say":"나이 제한은 없어요. 거주 조건은 없어요. 주소와 관계없이 신청할 수 있어요.","quote":"공모자격 : 대한민국 국민 누구나(개인 또는 팀)"},{"id":"EXT010#benefit","policyId":"EXT010","section":"benefit","text":"2026 안산시 관광사진 공모전 | 지원 내용\n- 내용: 안산 관광지 사진 공모 (최우수 100만원, 총 500만원)\n- 상세: 안산 관광지 사진 공모, 20점 시상\n- 금액: 최우수 100만원(총 500만원)","say":"지원 내용은 '안산 관광지 사진 공모 (최우수 100만원, 총 500만원)'이에요. 상세: 안산 관광지 사진 공모, 20점 시상."},{"id":"EXT010#period","policyId":"EXT010","section":"period","text":"2026 안산시 관광사진 공모전 | 신청 기간\n- 접수 기간: 2026.10.01 ~ 2026.10.16","say":"수집한 공고의 접수 기간은 2026.10.01 ~ 2026.10.16이에요."},{"id":"EXT010#method","policyId":"EXT010","section":"method","text":"2026 안산시 관광사진 공모전 | 신청 방법\n- 신청 방법: 이메일 또는 등기우편","say":"신청 방법은 '이메일 또는 등기우편'이에요."},{"id":"EXT010#contact","policyId":"EXT010","section":"contact","text":"2026 안산시 관광사진 공모전 | 문의처\n- 담당: 관광과","say":"담당은 관광과예요."},{"id":"EXT010#full1","policyId":"EXT010","section":"full","text":"2026 안산시 관광사진 공모전 | 공고 원문 1/25\n안산시의 아름다운 관광지와 숨겨진 매력을 발굴하여 지역관광 홍보에 적극 활용하고자 「안산을 담은 그 순간의 기록」 2026년 안산시 관광사진 공모전을 아래과 같이 개최하오니 많은 관심과 참여 바랍니다.\n1. 공 모 명 : 2026년 안산시 관광사진 공모전 「안산을 담은 그 순간의 기록」"},{"id":"EXT010#full2","policyId":"EXT010","section":"full","text":"2026 안산시 관광사진 공모전 | 공고 원문 2/25\n2. 접수기간 : 2026. 10. 1.(목) ~ 10. 16.(금)\n3. 공모분야 : 관광사진(안산12경 등 안산 관광지의 주・야간 또는 사계절 등을 담은 사진)\n※ 2025년 11월 이후 촬영되고, 안산 관광지를 소재로 한 미발표 사진"},{"id":"EXT010#full3","policyId":"EXT010","section":"full","text":"2026 안산시 관광사진 공모전 | 공고 원문 3/25\n4. 공모자격 : 대한민국 국민 누구나(개인 또는 팀)\n5. 접수방법 : 이메일 또는 등기우편 접수\n- 이메일 접수 : dagyeong321@korea.kr\n- 등기우편 접수 : 경기도 안산시 단원구 화랑로 260(초지동), 안산 와~스타디움 3층 관광과 사무실\n붙임 공고문 및 신청서식 1부.  끝."},{"id":"EXT010#full4","policyId":"EXT010","section":"full","text":"2026 안산시 관광사진 공모전 | 공고 원문 4/25\n[첨부 17891441866134WW9BEN5CRC6WQB3SXQP52RPO]\n안산시 공고 제2026-2043호\n⌜안산을 담은 그 순간의 기록⌟\n2026\n년 안산시 관광사진 공모전 공고\n(\n수정\n)\n안산시의 아름다운 관광지와 숨겨진 매력을 발굴하여 지역 관광\n홍보에 활용하고자\n⌜안산을 담은 그 순간의 기록⌟\n, 2026년 관광 사진 공모전\n을 아래와 같이 개최하오니 많은 관심과 참여 바랍니다.\n2026\n년\n9\n월\n11\n일\n안 산 시 장\n※\n접수 이메일 주소 변경(dagyeong321@korea.kr)\n에 따른 수정 공\n고이며\n,\n그 밖의 사항은 기 공고\n(\n제\n2026-943\n호\n, 2026. 4. 23.)\n내용과 동일함\n."},{"id":"EXT010#full5","policyId":"EXT010","section":"full","text":"2026 안산시 관광사진 공모전 | 공고 원문 5/25\n1. 공모개요\n가. 공모기간 : 2026.\n4. 23.(목) ~ 10. 16.(금)\n나. 접수기간 :\n2026. 10. 1.(목) ~ 10. 16.(금)\n다. 공모자격 : 대한민국 국민 누구나(개인 또는 팀)\n※ 단, 본인이 아닌 타인의 명의로 작품 제출 시 상권 취소(상금 반환)"},{"id":"EXT010#full6","policyId":"EXT010","section":"full","text":"2026 안산시 관광사진 공모전 | 공고 원문 6/25\n라. 공모분야 : 관광사진\n- 안산12경 등 안산 관광지의 주·야간, 4계절 등을 담은 사진\n※\n2025년 11월 이후\n촬영되고, 안산 관광지를 소재로 한 미발표 사진\n마. 공모일정\n공 모 명\n공고\n접수\n심사\n결과발표\n시상 및 전시\n⌜안산을 담은 그 순간의 기록⌟\n2026\n년 안산시 관광사진 공모전"},{"id":"EXT010#full7","policyId":"EXT010","section":"full","text":"2026 안산시 관광사진 공모전 | 공고 원문 7/25\n2026.\n4. 23. ~ 10. 16.\n2026.\n10. 1.~ 10. 16.\n2026. \n사진\n개인정보 수집\n동의 여부\n동의(\n) / 동의하지 않음(\n)\n※ 개인정보 제공 동의를 거부할 권리가 있으며\n,\n이 경우 동의 거부에 따른 불이익이 발생할 수 있습니다\n.\n※\n본 신청서에 기재되는 인적 사항은\n2026\n년 안산시 관광사진\n공모전 심사 및 수상자에 한하여 상금 발송 및 홍보 자료를 위한 목적으로 수집하며 다른 목적으로는 활용하지 않습니다.\n제출자료\n① 참가신청서\n1\n부\n.\n② 서약서\n1\n부\n.\n③ 개인정보 수집 동의\n1\n부\n.\n④ 출품작\n(\n사진\n)\n⑤ 출품표\n※ 출품작품\n1\n점당 참가신청서\n1\n매 작성"},{"id":"EXT010#full20","policyId":"EXT010","section":"full","text":"2026 안산시 관광사진 공모전 | 공고 원문 20/25\n2026.\n.\n.\n출품자 :\n(서명)\n안산시장 귀하\n[\n서식\n2]\n⌜안산을 담은 그 순간의 기록⌟\n2026년 안산시 관광사진 공모전 서약서\n본인은 안산시가 개최하는\n⌜안산을 담은 그 순간의 기록⌟\n2026년 안산시\n관광사진 공모전\n의 공모내용\n,\n응시방법\n등에 대해\n확인\n하였으며\n,\n유의사항 및 각 호에 해당하는 경우로\n불이익이\n발생할 수 있다는 사실을 충분히 인지하고\n,\n다음 사항에\n대해\n동의하며 서약합니다."},{"id":"EXT010#full21","policyId":"EXT010","section":"full","text":"2026 안산시 관광사진 공모전 | 공고 원문 21/25\n1.\n응모자는 응모작이 제\n3\n자의 저작권을 침해하지 않도록 주의 의무를 다해야 하며\n,\n제\n3\n자의 저작권을 침해하여 발생한 민\n·\n형사상의 책임은 응모자 본인에게 있다\n.\n2.\n사진 공모전의 수상작은 안산시의 미적 가치 전달과 우수한 관광자원의 홍보 목적을 위해 사용되며\n,\n저작재산권은 안산시에 귀속된다\n."},{"id":"EXT010#full22","policyId":"EXT010","section":"full","text":"2026 안산시 관광사진 공모전 | 공고 원문 22/25\n3.\n안산시 수상작에 한하여 공모전의 취지\n,\n목적 달성을 위해 기간 제한 없이 사진\n전시\n,\n홍보물 제작\n,\n발간물 게재\n,\n온라인 게시 등의 목적으로 저작물을 변형하거나\n복제\n·\n배포할 수 있으며\n,\n공익적인 사유에만 제\n3\n자에게 제공할 수 있다\n."},{"id":"EXT010#full23","policyId":"EXT010","section":"full","text":"2026 안산시 관광사진 공모전 | 공고 원문 23/25\n2026.\n.\n.\n서약자\n성명 :\n(서명)\n※\n미성년자의 경우 작성필수\n법정대리인 성명\n/\n관계\n(서명 또는 인)\n법정대리인 연락처\n안산시장 귀하\n[\n서식\n3]\n⌜안산을 담은 그 순간의 기록⌟\n2026년 안산시 관광사진 공모전 출품표\n⌜안산을 담은 그 순간의 기록⌟\n2026년 안산시 관광사진 공모전 출품표\n* 접수번호\n기재 x\n성\n명\n주\n소\n연 락 처\n작 품 명\n작품설명\n촬영일시\n촬영장소\n[\n서식\n4]\n초상권자 개인정보 수집 동의 안내\n안산시에서 개최하는\n2026\n년 안산시 관광사진 공모전\n과 관련하여 안산시가\n수집‧이용하는\n초상권자의 개인정보에 대하여 관계 법령에 따라 아래와 같이 알려드립니다\n.\n[수집/이용 항목]\n(필수항목) 이름, 생년월일 및 성별, 연락처(핸드폰 및 자택 전화번호)"},{"id":"EXT010#full24","policyId":"EXT010","section":"full","text":"2026 안산시 관광사진 공모전 | 공고 원문 24/25\n[수집/이용 목적]\n정보주체(초상권자)의 초상권 사용 동의 사실 확인 목적으로 이용되며, 수집한 개인정보는 본 수집‧이용 목적 외의 다른 목적으로 사용되지 않습니다.\n[이용 및 보유 기간]\n수집된 개인정보는 공모전 행사가 종료된 시점으로부터\n1\n년간 보관하며\n,\n해당 기간이 경과한\n경우\n즉시 파기합니다\n.\n다만\n,\n해당 사진이 수상작품으로 선정된 경우 초상권 및 저작권 관리를\n위해 보관\n합니다.\n[동의거부 권리]\n정보주체\n(\n초상권자\n)\n는 개인정보 수집에 동의를 거부할 수 있으며\n,\n정보주체\n(\n초상권자\n)\n가 필수\n작성\n사항 기재 및 초상권 사용 동의서에 서명을 거부하는 경우\n,\n출품자는 수상이 불가함을 알려드립니다\n.\n▢\n동의\n▢\n동의하지 않음\n2026\n년 안산시 관광사진 초상권 사용 동의서\n출품자\n성"},{"id":"EXT010#full25","policyId":"EXT010","section":"full","text":"2026 안산시 관광사진 공모전 | 공고 원문 25/25\n명\n연락처\n촬영지\n작품명\n초상\n권자\n성\n명\n연락처\n생년월일\n성\n별\n2026년\n월\n일\n□\n해당 사진의 초상을 출품자\n에게 사용 허가하도록 동의하였습니다\n.\n초상권자\n(인)\n□\n출품자\n의 응모작품은 제\n3\n자의 초상권 및 기타 제반 권리를 침해하지\n않았음을 증명합니다.\n출품자\n(인)"},{"id":"EXT013#overview","policyId":"EXT013","section":"overview","text":"2026 안산시 공공데이터·AI 활용 아이디어 공모전 | 개요\n- 분야: 참여권리\n- 한 줄 요약: 공공데이터·AI 활용 아이디어 공모 (최우수 200만원)\n- 대상: 나이 제한 없음, 거주 조건 없음(주소와 관계없이 신청 가능)","say":"2026 안산시 공공데이터·AI 활용 아이디어 공모전은 참여권리 분야 사업이에요. 공공데이터·AI 활용 아이디어 공모 (최우수 200만원). 대상은 나이 제한 없음, 거주 조건은 '거주 무관'이에요."},{"id":"EXT013#target","policyId":"EXT013","section":"target","text":"2026 안산시 공공데이터·AI 활용 아이디어 공모전 | 지원 대상\n- 나이: 나이 제한 없음\n- 거주: 거주 조건 없음(주소와 관계없이 신청 가능)\n- 공고 원문: \"참가자격 : 전 국민 (개인 또는 3인 이내 팀)\"","say":"나이 제한은 없어요. 거주 조건은 없어요. 주소와 관계없이 신청할 수 있어요.","quote":"참가자격 : 전 국민 (개인 또는 3인 이내 팀)"},{"id":"EXT013#benefit","policyId":"EXT013","section":"benefit","text":"2026 안산시 공공데이터·AI 활용 아이디어 공모전 | 지원 내용\n- 내용: 공공데이터·AI 활용 아이디어 공모 (최우수 200만원)\n- 상세: 공공데이터·AI 활용 아이디어 공모. 최우수팀은 범정부 공공데이터 창업경진대회 본선 진출\n- 금액: 최우수 200만원","say":"지원 내용은 '공공데이터·AI 활용 아이디어 공모 (최우수 200만원)'이에요. 상세: 공공데이터·AI 활용 아이디어 공모. 최우수팀은 범정부 공공데이터 창업경진대회 본선 진출."},{"id":"EXT013#period","policyId":"EXT013","section":"period","text":"2026 안산시 공공데이터·AI 활용 아이디어 공모전 | 신청 기간\n- 접수 기간: 2026.06.08 ~ 2026.07.10\n- 안내: 매년 6~7월","say":"수집한 공고의 접수 기간은 2026.06.08 ~ 2026.07.10이에요. 안내: 매년 6~7월."},{"id":"EXT013#method","policyId":"EXT013","section":"method","text":"2026 안산시 공공데이터·AI 활용 아이디어 공모전 | 신청 방법\n- 신청 방법: 이메일","say":"신청 방법은 '이메일'이에요."},{"id":"EXT013#contact","policyId":"EXT013","section":"contact", n서명 또는 인\n)\n성명\n:\n개인 참여일 경우 미기재\n(\n서명 또는 인\n)\n성명\n:\n개인 참여일 경우 미기재\n(\n서명 또는 인\n)\n안산시장 귀하\n붙임4\n참가자 서약서\n2026년 안산시 공공데이터·AI 활용\n아이디어 공모전 참가자 서약서"},{"id":"EXT013#full24","policyId":"EXT013","section":"full","text":"2026 안산시 공공데이터·AI 활용 아이디어 공모전 | 공고 원문 24/31\n본인은 「2026년 안산시 공공데이터·AI 활용 공모전」에 참가함에 있어 다음 각 호의 사항을 준수할 것을 서약합니다.\n1. 본 공모전의 운영지침 및 제반 규정을 준수하며, 이를 위반할 경우 심사 제외, 수상 취소 등 불이익을 받을 수 있음에 동의합니다."},{"id":"EXT013#full25","policyId":"EXT013","section":"full","text":"2026 안산시 공공데이터·AI 활용 아이디어 공모전 | 공고 원문 25/31\n2. 본인이 제출한 출품작은 순수 창작물로서, 타인의 저작권, 초상권, 특허권 등 일체의 권리를 침해하지 않았음을 보증하며, 이로 인하여 발생하는 민·형사상 책임은 전적으로 본인에게 있습니다.\n3. 본 공모전에 제출한 출품작이 타 공모전 및 경진대회 수상작이거나, 표절·도용·모방 등 부정행위가 확인될 경우 심사 제외, 수상 취소 및 상금 환수 등의 조치에 이의를 제기하지 않으며, 이에 따른 모든 책임은 본인에게 있습니다."},{"id":"EXT013#full26","policyId":"EXT013","section":"full","text":"2026 안산시 공공데이터·AI 활용 아이디어 공모전 | 공고 원문 26/31\n4. 제출서류(참가신청서, 기획서 등)의 내용이 허위로 판명될 경우 관련 규정에 따른 불이익을 감수하며, 이에 대하여 이의를 제기하지 않습니다.\n5. 출품작과 관련하여 발생하는 저작권, 데이터 이용, 초상권 등 제반 법적 분쟁에 대한 책임은 전적으로 본인에게 있습니다."},{"id":"EXT013#full27","policyId":"EXT013","section":"full","text":"2026 안산시 공공데이터·AI 활용 아이디어 공모전 | 공고 원문 27/31\n6. 수상작의 저작권은 원칙적으로 참가자에게 있으나, 주최 측은 수상작에 한하여 홍보, 전시, 교육, 정책 활용 등 공익적 목적 범위 내에서 무상으로 활용할 수 있으며, 참가자는 이에 동의합니다.\n7. 심사 결과에 따라 적합한 수상작이 없을 경우 수상작을 선정하지 않거나 시상 규모가 조정될 수 있으며, 이에 대하여 이의를 제기하지 않습니다."},{"id":"EXT013#full28","policyId":"EXT013","section":"full","text":"2026 안산시 공공데이터·AI 활용 아이디어 공모전 | 공고 원문 28/31\n8. 본 공모전과 관련하여 분쟁이 발생할 경우 주최 측의 해석 및 결정에 따릅니다.\n※ 동의를 거부할 권리와 거부에 따른 불이익\n-\n지\n원자는 원하지 않는 경우 개인정보의 제공 동의\n(\n제\n3\n자의 제공을 포함한다\n)\n를 거부할\n권\n리가 있습니다\n.\n다만\n,\n지원자가 동의를 거부하는 경우 심사대상에서 제외될 수 있음\n을 알려드립니다.\n본인은 개인정보 수집\n·\n이용에 대해 충분히 숙지 및 동의함을 서약하며 상기와 같이\n동의서를\n제출합니다.\n2026\n년\n월\n일\n성명\n:\n(\n서명 또는 인\n)\n성명\n:\n개인 참여일 경우 미기재\n(\n서명 또는 인\n)\n성명\n:\n개인 참여일 경우 미기재\n(\n서명 또는 인\n)\n안산시장 귀하\n붙임5\n아이디어 기획서\n아이디어 기획서\n공 모 명\n2026\n년 안산시 공공데이터\n·AI"},{"id":"EXT013#full29","policyId":"EXT013","section":"full","text":"2026 안산시 공공데이터·AI 활용 아이디어 공모전 | 공고 원문 29/31\n활용 아이디어 공모전\n성명(팀명)\n연 락 처\n아이디어 제목\n■ 아이디어 개요\n- 배경(현황과 문제점), 해결의 필요성, 핵심과제, 기대효과, 아이디어 내용 등 요약하여 기재\n- 문제해결을 위해 활용하고자 하는 공공데이터와 AI 개요\n- 활용데이터 및 참고 문헌 출처 기재"},{"id":"EXT013#full30","policyId":"EXT013","section":"full","text":"2026 안산시 공공데이터·AI 활용 아이디어 공모전 | 공고 원문 30/31\n■ 세부 추진방안\n- 아이디어 내용 상세\n- 공공데이터·AI 활용 작동 방식 및 분석 방안\n- 데이터 전처리, 분석 툴, 알고리즘 및 방법론, 스토리보드(시각화) 등\n■ 기대효과\n- 공공데이터 분석 및 AI 활용을 통한 시민편익과 사회적 기대효과 등\n%-\n아이디어의 현실성 및 지속가능성"},{"id":"EXT013#full31","policyId":"EXT013","section":"full","text":"2026 안산시 공공데이터·AI 활용 아이디어 공모전 | 공고 원문 31/31\n■\n(자유 기재)\n-\n추가 내용 작성\n[도표, 그래픽 등 활용 가능하며, 기재란 부족 시 별지 작성]"},{"id":"EXT014#overview","policyId":"EXT014","section":"overview","text":"2025년 기준 경제총조사 조사요원 | 개요\n- 분야: 교육일자리\n- 한 줄 요약: 사업체 대상 통계조사 단기 일자리 (203명)\n- 대상: 나이 제한 없음, 거주 조건 없음(주소와 관계없이 신청 가능)","say":"2025년 기준 경제총조사 조사요원은 교육일자리 분야 사업이에요. 사업체 대상 통계조사 단기 일자리 (203명). 대상은 나이 제한 없음, 거주 조건은 '거주 무관'이에요."},{"id":"EXT014#target","policyId":"EXT014","section":"target","text":"2025년 기준 경제총조사 조사요원 | 지원 대상\n- 나이: 나이 제한 없음\n- 거주: 거주 조건 없음(주소와 관계없이 신청 가능)\n- 가점·우대: 대부도 현지인 우선 선발\n- 공고 원문: \"(거주 조건 없음) 우대: 대부도 지역 현지인 및 조사 가능자 우선 선발\"","say":"나이 제한은 없어요. 거주 조건은 없어요. 주소와 관계없이 신청할 수 있어요. 가점·우대: 대부도 현지인 우선 선발.","quote":"(거주 조건 없음) 우대: 대부도 지역 현지인 및 조사 가능자 우선 선발"},{"id":"EXT014#benefit","policyId":"EXT014","section":"benefit","text":"2025년 기준 경제총조사 조사요원 | 지원 내용\n- 내용: 사업체 대상 통계조사 단기 일자리 (203명)\n- 금액: 조사완료 수에 따른 도급금액 + 교통비","say":"지원 내용은 '사업체 대상 통계조사 단기 일자리 (203명)'이에요. 금액은 조사완료 수에 따른 도급금액 + 교통비예요."},{"id":"EXT014#period","policyId":"EXT014","section":"period","text":"2025년 기준 경제총조사 조사요원 | 신청 기간\n- 접수 기간: 2026.04.07 ~ 2026.04.17\n- 안내: 5년 주기 총조사","say":"수집한 공고의 접수 기간은 2026.04.07 ~ 2026.04.17이에요. 안내: 5년 주기 총조사."},{"id":"EXT014#method","policyId":"EXT014","section":"method","text":"2025년 기준 경제총조사 조사요원 | 신청 방법\n- 신청 방법: 경제총조사 홈페이지 또는 방문\n- 신청 사이트: 경제총조사 누리집 (https://www.ecensus.go.kr)\n- 찾는 법: 검색창에 '2025년 기준 경제총조사 조사요원' 검색 (사이트 첫 화면으로 열림)","say":"신청 방법은 '경제총조사 홈페이지 또는 방문'이에요. 신청 사이트는 경제총조사 누리집이에요. 첫 화면이 열리니 검색창에 '2025년 기준 경제총조사 조사요원'을 검색해 주세요."},{"id":"EXT014#contact","policyId":"EXT014","section":"contact","text":"2025년 기준 경제총조사 조사요원 | 문의처\n- 담당: 스마트도시과","say":"담당은 스마트도시과예요."},{"id":"EXT014#full1","policyId":"EXT014","section":"full","text":"2025년 기준 경제총조사 조사요원 | 공고 원문 1/26\n□ 2025년 기준 경제총조사 조사요원 모집\n○ 모집인원 : 총 203명(총관리자 2명, 조사괸라자 33명, 조사지원담당자 8명, 조사원 160명)\n○ 접수기간 : 2026. 4. 7. 〜 4. 17\n○ 접수방법\n- 온라인접수 : 경제총조사 홈페이지(www.ecensus.go.kr)\n- 방문접수 : 2026. 4. 15(수) ~ 4. 17.(금)\n※ 안산도시정보센터 1층 안내실 방문 제출  *12:00 ~13:00 제외"},{"id":"EXT014#full2","policyId":"EXT014","section":"full","text":"2025년 기준 경제총조사 조사요원 | 공고 원문 2/26\n○ 채용기간 및 제출서류 : 공고문 참조\n붙임 1. 공고문 1부.\n2. 모집신청서 및 개인정보 이용동의서 각 1부.  끝.\n\n[첨부 1775486693748SC2PHRJ6EMOA75CK9FD4612G4]\n안산시 공고 제\n2026\n–\n791\n호\n2025년 기준 경제총조사 조사요원 모집공고\n안산시에서는\n2025\n년 기준 경제총조사 조사요원을 다음과 같이 모집하오니 많은 지원 바랍니다\n."},{"id":"EXT014#full3","policyId":"EXT014","section":"full","text":"2025년 기준 경제총조사 조사요원 | 공고 원문 3/26\n2026.\n4.\n.\n안산시장\n1\n모집인원 및 기간\n모집구분\n모집\n인원\n계 약 기 간\n계약금액\n계약\n방법\n총관리자\n2명\n‧\n2026. 6. 1. ~ 7. 22.\n1일 85,680원\n근로\n계약\n조사\n관리자\n스마트\n조사관리자\n3명\n‧"},{"id":"EXT014#full4","policyId":"EXT014","section":"full","text":"2025년 기준 경제총조사 조사요원 | 공고 원문 4/26\n2026. 6. 1. ~ 7. 22.\n조사관리자\n30명\n‧\n2026. 6. 8. ~ 7. 22.\n조사지원담당자\n8명\n‧\n2026. 6. 1. ~ 7. 31.\n1일 82,560원\n조사원\n160명\n‧ 준비조사\n: 2026. 6. 11. (1\n일\n)\n‧ 본조사\n: 2026. 6. 12.~7. 22. (28\n일\n)\n1일 82,560원\n실적급 지급\n(조사실적 기준)\n도급\n계약\nㅇ\n교육\n:\n대면 집합교육 필수 이수\n(\n교육장소 추후 공지\n)\n‘"},{"id":"EXT014#full5","policyId":"EXT014","section":"full","text":"2025년 기준 경제총조사 조사요원 | 공고 원문 5/26\n26. 5. 19.\n~ 22.\n(\n기간 중\n2\n일\n)\nㅇ\n지정된 조사업무를 기한 내 정상적으로 완료한 경우 조사완료 수에 따라 도급계약 금액 지급\n※ 소득세, 지방소득세 3.3% 공제 후 수당 지급, 중도포기 및 부실·허위조사 시 도급금액 감액 지급\nㅇ\n교통비\n:\n실적에 따라 지급\n(1\n일\n6,000\n원\n),\n교육일은 미지급\nㅇ\n조사원\n상해보험 가입 의무화:\n상해보험에 가입되지 않았을 경우 개인상해보험 또는 산재보험에 의무가입 하여야 하며, 이를 거부할 경우 합격을 취소할 수 있음\nㅇ\n기관의 사정에 따라 모집기간 및 모집인원은 변경될 수 있으며\n,\n업무 사정 및 예산규모에\n따라\n계약기간이 변경될 수 있음\nㅇ\n스마트조사관리자는 조사관리자 합격자 중 경력 및 면접 심사 등을 고려하여 선발\nㅇ"},{"id":"EXT014#full6","policyId":"EXT014","section":"full","text":"2025년 기준 경제총조사 조사요원 | 공고 원문 6/26\n합격자가 포기하면 평가기준에 따라 차순위자 순으로 대체 모집하며\n,\n부적합한 지원자는 모집하지 않을 수 있음\nㅇ\n최종합격 후 조사구 배치 및 업무 배정에 따른 이의제기는 할 수 없음\nㅇ\n총관리자 및 조사관리자는\n7. 23. ~ 7. 31.\n중 내검요원으로 연계 채용\nㅇ\n스마트조사관리자는"},{"id":"EXT014#full7","policyId":"EXT014","section":"full","text":"2025년 기준 경제총조사 조사요원 | 공고 원문 7/26\n6. 1. ~ 6. 7.\n이후 조사관리자로 전환 채용\n2\n자격요건 및 수행업무\n인력구분\n자격\n수행업무\n총관리자\n◦\n총조사 또는 사업체 대상 통계조사 유경험자\n◦컴퓨터 활용 가능한 자\n◦다른 직업을 갖고 있지 않으며 채용기간 동안 업무수행이 가능한 자\n◦\n조사관리자 및 조사원을 통솔할 수 있는 자\n◦총조사 담당 공무원 업무 지원\n◦조사관리자 및 조사원의 업무분장\n◦조사관리자 및 조사원 관리\n◦조사 용품 배부 및 관리 총괄\n◦일일상황보고 총괄\n◦통합시스템 관련 업무 총괄\n◦온라인조사 관리 총괄\n◦조사 불응 사업체 설득 지원 등\n◦조사표류 정리\n,\n편철 및 제출 총괄\n(\n스마트\n)\n조사\n관리자\n◦사업체 대상 통계조사 유경험자\n◦컴퓨터 활용 가능한 자\n◦\n다른 직업을 갖고 있지 않으며 채용기간"},{"id":"EXT014#full8","policyId":"EXT014","section":"full","text":"2025년 기준 경제총조사 조사요원 | 공고 원문 8/26\n동안 업무수행이 가능한 자\n◦\n조사원 통솔\n,\n조사 지도 및 불응사업체\n설득 등 조사 관리가 가능한 자\n◦\n지자체의 지역사정에 밝고\n,\n대인관계가\n좋은 자\n◦총관리자 업무 지원\n◦조사원의 현장조사 지도 및 지원\n◦불응사업체 설득 지원\n◦온라인조사 관리\n◦조사표 내용검토 및 보완\n◦사업체명부 및 조사표 입력\n◦조사원별 조사 진도 파악 및 관리\n◦\n대체조사원 교육 및 현장조사 지도\n◦조사표류 정리\n·\n편철 및 제출\n조사지원\n담당자\n◦\n통계조사 유경험자\n◦컴퓨터 활용 가능한 자\n◦\n다른 직업을 갖고 있지 않으며 채용기간 동안 업무수행이 가능한 자\n◦\n조사 업무를 성실히 지원할 수 있는 자\n◦홍보 업무를 위해 차량운행 가능자\n◦공무원 및 총관리자 업무 지원\n◦총조사 홍보 업무\n◦통합시스템 관련 업무"},{"id":"EXT014#full9","policyId":"EXT014","section":"full","text":"2025년 기준 경제총조사 조사요원 | 공고 원문 9/26\n◦온라인조사 관리 지원\n◦조사표 입력\n◦기타 총조사 관련 업무 지원\n도급\n조사원\n◦조사 기간 동안 업무수행이 가능한 자\n◦\n사업체를 방문하여 조사표 작성을 위한 질문 및 설명을 원활히 할 수 있는 자\n◦사업체단위 통계조사 또는 회계 관련 업무 유경험자 우대\n◦온라인조사 참여 홍보\n◦사업체명부 수정 및 보완\n◦사업체 방문 및 조사표 작성\n◦조사표 내용검토 및 정리\n3\n우대사항\n구\n분\n내 용\n우대사항\n* 관련 서류 제출자\n• 경제총조사\n,\n사업체조사\n,\n광업제조업조사 등 통계조사 유경험자\n• 대부도 지역 현지인 및 조사 가능자 우선 선발\n• 전산\n(\n한글프로세스\n,\n엑셀\n)\n자격증 소지자 우대 선발\n•\n국가유공자 등 예우 및 지원에 관한 법률 및"},{"id":"EXT014#full10","policyId":"EXT014","section":"full","text":"2025년 기준 경제총조사 조사요원 | 공고 원문 10/26\n5.18\n민주 유공자 예우에 관한\n법률 등에 따른 지원대상자\n 조\n,\n제\n22\n조에 따라 입사\n지원자의 개인정보를 수집·이용하고자 합니다. 수집하는 개인정보는 목적 외의 용도로는 이용되지\n않으며\n,\n이용목적이 변경되는 경우에는 개인정보 보호법에 따라 별도의 동의를 받는 등 필요한 조치를 이행할 예정입니다\n."},{"id":"EXT014#full22","policyId":"EXT014","section":"full","text":"2025년 기준 경제총조사 조사요원 | 공고 원문 22/26\n□\n[\n필수\n]\n개인정보 수집‧이용 내역\n항목\n수집목적\n보유기간\n공\n통\n성명\n,\n성별\n,\n생년월일\n,\n주소\n,\n연락처\n(\n휴대전화\n)\n채용절차 진행,\n본인확인,\n겸업관리,\n채용요건\n(\n자격\n·\n경력 등\n),\n채용우대 확인\n미채용자\n「채용절차공정화에 관한\n법률」에 따라 채용 종료\n후\n180일까지\n해\n당\n자\n자격‧경력‧\n저소득\n‧\n다자녀\n‧\n북한이탈주민\n‧\n장애인‧\n국가유공자 등\n(\n취업지원\n대상자\n)\n채용자\n계약 종료 후 3년\n※\n위의 개인정보 수집‧이용에 대한 동의를 거부할 권리가\n있\n습니다\n.\n그러나 동의를 거부할 경우 채용절차에\n따른 심사를 원활하게 진행할 수 없어 채용에 제한을 받을 수 있습니다\n.\n☞ 위와 같이 개인정보를 처리하는데 동의하십니까?\n동의\n미동의"},{"id":"EXT014#full23","policyId":"EXT014","section":"full","text":"2025년 기준 경제총조사 조사요원 | 공고 원문 23/26\n□\n[\n필수\n]\n민감정보 수집‧이용 내역\n항목\n수집목적\n보유기간\n<\n해당자\n>\n국가유공자정보, 장애정보,\n북한이탈주민정보\n근로계약 체결 및 고용유지, 법적사무처리\n미채용자\n「채용절차공정화에 관한\n법률」에 따라 채용 종료\n후\n180일까지\n채용자\n계약 종료 후 3년\n※\n위의 개인정보 수집‧이용에 대한 동의를 거부할 권리가\n있\n습니다\n.\n그러나 동의를 거부할 경우 채용절차에\n따른 심사를 원활하게 진행할 수 없어 채용에 제한을 받을 수 있습니다\n.\n☞ 위와 같이 민감정보를 처리하는데 동의하십니까?\n동의\n미동의"},{"id":"EXT014#full24","policyId":"EXT014","section":"full","text":"2025년 기준 경제총조사 조사요원 | 공고 원문 24/26\n□\n[\n필수\n]\n기본 개인정보 수집\n·\n이용 내역\n(\n채용자\n)\n수집‧이용 항목\n수집․이용 목적\n보유기간\n성명, 생년월일, 주소, 연락처, 경력\n인사감사 등 채용절차의 사후관리\n계약 종료 후 10년\n※\n위의 개인정보 수집‧이용에 대한 동의를 거부할 권리가\n있\n습니다\n.\n그러나 동의를 거부할 경우 채용절차에\n따른 심사를 원활하게 진행할 수 없어 채용에 제한을 받을 수 있습니다\n.\n☞ 위와 같이 개인정보를 처리하는데 동의하십니까?\n동의\n미동의\n2026년\n월\n일\n성명:\n(서명)\n안산지장 귀하\n【붙임 3】(모집 전)개인(신용)정보의 수집·이용 동의서(도급계약)\n(\n모집 전\n)\n개인정보 수집\n·\n이용 동의서\n안산시는\n도급조사원의 모집 및 관리를 위해 「개인정보 보호법」\n제\n15조,\n제\n17\n조\n,\n제\n22\n조에 따라"},{"id":"EXT014#full25","policyId":"EXT014","section":"full","text":"2025년 기준 경제총조사 조사요원 | 공고 원문 25/26\n지원자의 개인정보를 수집\n·\n이용하고자\n합니다\n.\n수집하는 개인정보는 목적 외의 용도로는 이용되지\n않으며, 이용목\n적이 변경되는 경우에는 개인정보 보호법에 따라 별도의 동의를 받\n는 등 필요한 조치를 이행할 예정입니다."},{"id":"EXT014#full26","policyId":"EXT014","section":"full","text":"2025년 기준 경제총조사 조사요원 | 공고 원문 26/26\n□ 개인정보 수집‧이용 내역\n항목\n수집목적\n보유기간\n성명\n,\n성별\n,\n생년월일\n,\n주소\n,\n연락처\n(\n휴대전화\n)\n모집절차 진행\n,\n본인확인\n,\n겸업 관리\n,\n경력증명서 발급용 기록관리\n미계약자\n「\n채용절차 공정화에\n관\n한\n법률\n」\n을 준용함에\n따라\n모집 종료 후\n180\n일까지\n계약자\n공공\n기록\n물\n관리\n에\n관\n한\n법령 및 지침에\n따라 처리\n※\n위의 개인정보 수집‧이용에 대한 동의를 거부할 권리가\n있\n습니다\n.\n그러나 동의\n를 거부할 경우 모집절차에 따른 심사를 원활하게 진행할 수 없어 모집에\n제한을 받을 수 있습니다\n.\n☞\n위와 같이 개인정보를 처리하는데 동의하십니까\n?\n동의\n미동의\n2026년\n월\n일\n성명:\n(서명)\n안산시장 귀하"},{"id":"EXT015#overview","policyId":"EXT015","section":"overview","text":"2025 농림어업총조사 조사요원 | 개요\n- 분야: 교육일자리\n- 한 줄 요약: 농림어가 대상 통계조사 단기 일자리 (75명, 24일)\n- 대상: 만 18세 이상, 거주 조건 없음(주소와 관계없이 신청 가능)","say":"2025 농림어업총조사 조사요원은 교육일자리 분야 사업이에요. 농림어가 대상 통계조사 단기 일자리 (75명, 24일). 대상은 만 18세 이상, 거주 조건은 '거주 무관'이에요."},{"id":"EXT015#target","policyId":"EXT015","section":"target","text":"2025 농림어업총조사 조사요원 | 지원 대상\n- 나이: 만 18세 이상\n- 거주: 거주 조건 없음(주소와 관계없이 신청 가능)\n- 공고 원문: \"만 18세이상 사명감과 책임감이 투철한 자 (거주 조건 없음)\"","say":"나이 조건은 만 18세 이상이에요. 거주 조건은 없어요. 주소와 관계없이 신청할 수 있어요.","quote":"만 18세이상 사명감과 책임감이 투철한 자 (거주 조건 없음)"},{"id":"EXT015#benefit","policyId":"EXT015","section":"benefit","text":"2025 농림어업총조사 조사요원 | 지원 내용\n- 내용: 농림어가 대상 통계조사 단기 일자리 (75명, 24일)\n- 금액: 일 80,240원 + 교통비 6,000원","say":"지원 내용은 '농림어가 대상 통계조사 단기 일자리 (75명, 24일)'이에요. 금액은 일 80,240원 + 교통비 6,000원이에요."},{"id":"EXT015#period","policyId":"EXT015","section":"period","text":"2025 농림어업총조사 조사요원 | 신청 기간\n- 접수 기간: 2025.10.28 ~ 2025.11.10\n- 안내: 5년 주기 총조사","say":"수집한 공고의 접수 기간은 2025.10.28 ~ 2025.11.10이에요. 안내: 5년 주기 총조사."},{"id":"EXT015#method","policyId":"EXT015","section":"method","text":"2025 농림어업총조사 조사요원 | 신청 방법\n- 신청 방법: 농림어업총조사 홈페이지 또는 방문\n- 신청 사이트: 농림어업총조사 누리집 (https://www.affcensus.go.kr)\n- 찾는 법: 검색창에 '2025 농림어업총조사 조사요원' 검색 (사이트 첫 화면으로 열림)","say":"신청 방법은 '농림어업총조사 홈페이지 또는 방문'이에요. 신청 사이트는 농림어업총조사 누리집이에요. 첫 화면이 열리니 검색창에 '2025 농림어업총조사 조사요원'을 검색해 주세요."},{"id":"EXT015#contact","policyId":"EXT015","section":"contact","text":"2025 농림어업총조사 조사요원 | 문의처\n- 담당: 스마트도시과","say":"담당은 스마트도시과예요."},{"id":"EXT015#full1","policyId":"EXT015","section":"full","text":"2025 농림어업총조사 조사요원 | 공고 원문 1/25\n□ 2025 농림어업총조사 조사요원 모집\n○ 모집인원 : 총 75명(조사괸라자 9명, 조사지원담당자 2명, 조사원 64명)\n○ 접수기간 : 2025. 10. 28. 〜 11. 10.\n○ 접수방법\n- 인터넷 : 농림어업총조사 홈페이지(www.affcensus.go.kr)\n- 방  문 : 상록구청 지하 인구주택총조사 상황실 방문 제출"},{"id":"EXT015#full2","policyId":"EXT015","section":"full","text":"2025 농림어업총조사 조사요원 | 공고 원문 2/25\n○ 채용기간 및 제출서류 : 공고문 참조\n붙임 1. 공고문 1부.\n2. 모집신청서 및 개인정보 이용동의서 각 1부.  끝.\n\n[첨부 176222045200120BVQ0AI6SB7ZHN611NGUAOZ7]\n안산시 공고 제\n2025\n–\n2443\n호\n2025 농림어업총조사 조사요원 모집공고\n안산시에서는\n2025\n농림어업총조사 조사요원을 다음과 같이 모집하오니 많은 지원 바랍니다\n."},{"id":"EXT015#full3","policyId":"EXT015","section":"full","text":"2025 농림어업총조사 조사요원 | 공고 원문 3/25\n2025.\n10.\n28.\n안산시장\n1\n모집인원 및 기간\n구\n분\n인원\n계약금액(원)\n계\n약\n기\n간\n비\n고\n조사관리자\n9\n명\n83,230/1일\n채용기간: ’25.11.24.(월)~12.24.(수)\n-\n교육\n:\n’\n25.11.24.(\n월\n)~28.(\n금\n)(\n기간 중\n3\n일\n)\n-\n사전준비\n:\n’"},{"id":"EXT015#full4","policyId":"EXT015","section":"full","text":"2025 농림어업총조사 조사요원 | 공고 원문 4/25\n25.11.25.(\n화\n)~11.28.(\n금\n)(\n기간 중\n2\n일\n)\n근로계약\n조사지원담당자\n2\n명\n80,240/1일\n조사원\n64\n명\n80,240/1일\n총 24일\n-\n교육\n:\n’\n25.11.25.(\n화\n)~11.28.(\n금\n)(\n기간 중\n2\n일\n)\n- 준비조사: ‘25.12.1.(월)(1일)\n- 본조사: ’25.12.2.(화)~12.22.(월)(21일)\n도급계약\n(상해보험\n의무가입)\n※ 근로시간 및 형태: 주 5일제(40시간), 1일 8시간(9시~18시) 근무\n※ 조사관리자 합격자 중 조사총괄 및 최근 통계조사 경력 등을 고려하여 총관리자 별도 선정\n※ 조사\n지원담당자는 조사 일정에 따라 일부 인원 조기채용 할 수 있음\n※\n조사가 완료된 모든 조사원에게 교통비 1일 6,000원 추가 지급(교육일 제외)\n※"},{"id":"EXT015#full5","policyId":"EXT015","section":"full","text":"2025 농림어업총조사 조사요원 | 공고 원문 5/25\n최종합격 후 조사구 배치에 따른 이의제기는 할 수 없음\n2\n주요 수행 업무\n구\n분\n주요 수행 업무\n총관리자\n• 조사원 및 조사관리자, 조사지원담당자 지도\n·\n관리 총괄\n- 업무무 진행률 관리,\n업무 지시사항 및 공지사항 수시 전달\n- 유고 조사원 파악, 대체 조사원 교육 및 현장조사 지도\n- 부실조사 의심 가구 현장 확인\n·\n점검\n- 준비조사 시 조사지침 보충 교육(필요시) 등\n• 조사원 및 조사관리자 업무량 배정 총괄\n• 인터넷 조사와 현장 조사 관리 업무 총괄\n- 조사안내문 조사원 배부, 인터넷조사 응답가구 관리\n- 준비조사 및 방문 면접조사 기간 중 현장조사 관리\n- 불응가구 조사 지원, 장기 부재가구 확인 및 처리 등\n• 업무보고 및 상황실 실무 관리, 시스템 관련 업무 총괄\n• 조사내용 검토\n·"},{"id":"EXT015#full6","policyId":"EXT015","section":"full","text":"2025 농림어업총조사 조사요원 | 공고 원문 6/25\n내검 및 조사표 등 정리\n·\n제출 총괄\n•\n기타 상황실 및 조사원 관리에 필요한 사항\n조사관리자\n• 담당 공무원 및 총관리자 업무 지원\n•\n조사원 및 조사지원담당자 지도·관리\n- 조사원의 현장조사 독려 및 지도 점검\n- 유고 조사원 파악, 대체 조사원 교육 및 현장조사 지도\n- 부실 조사가 의심되는 경우 대상처 방문 확인 점검\n•\n인터넷 조사와 현장 조사 관리 업무\n- 조사안내문 조사원 배부, 인터넷조사 응답가구 관리\n- 준비조사 및 방문 면접조사 기간 중 현장조사 관리\n- 불응가구 조사 지원, 장기 부재가구 확인 및 처리 등\n•\n상황실 실무 관리, 시스템 관련 업무\n• 조사내용 검토\n·\n내검 및 조사표 등 정리\n·\n제출\n- 가구명부, 태블릿 PC 농림어가 조사 작성 내용 검토(수시)"},{"id":"EXT015#full7","policyId":"EXT015","section":"full","text":"2025 농림어업총조사 조사요원 | 공고 원문 7/25\n- 조사표, 입력자료 등을 활용한 내검 및 보완 요구(관리자→조사원)\n• 기타 상황실 및 조사원 관리에 필요한 사항\n조사지원담당자\n• 담당 공무원 및 (총)관리자 업무 지원\n• 반송된 조사안내문 확인 및 통합관리시스템에 반송 가구 입력\n• 현장 관리 지원\n• 가구명부 및 전자요도 관리\n• 조사 준비\n- 태블릿PC 및 조사용품 수령 및 관리, 통합관리시스템 등록 등\n- 현수막\n·\n포스터 부착, 마을 방송 실시 요청 등 홍보 업무 지원\n- 통합관리시스템에 업무량 배정 내역 지원\n• 태블릿PC, 상황실 PC 등 IT 기기 관리 업무\n• 지역 조사표 및 행정리 경계지도 입력 및 내검\n• 농가\n·\n임가\n·\n어가 인터넷 조사 지원\n• 조사표 및 조사용품 등 정리\n·\n제출(조사표 편철)"},{"id":"EXT015#full8","policyId":"EXT015","section":"full","text":"2025 농림어업총조사 조사요원 | 공고 원문 8/25\n• 기타 조사지원 및 업무보조에 필요한 사항\n조사원\n• 준비 조사 및 인터넷 조사 안내\n- 현지 답사 및 담당조사구 경계 확인 및 가구 명부 보완 업무\n- 우편 미발송 및 반송 가구 대상 조사안내문 배부, 인터넷조사 홍보\n• 방문면접 조사 수행 및 담당 조사구 가구 명부 보완\n·\n입력\n- 담당 조사구 방문 태블릿PC 조사 입력\n·\n내검\n·\n보완 실시\n- 가구명부에 변동 사항이 있을 경우 보완 및 태블릿PC에 입력·제출\n- 방문조사이력 작성 및 응답 거부 가구 설득\n- 조사실적 및 특이사항 보고\n• 조사표 내용 검토 및 보완\n- 조사표 오류사항 확인 및 보완 등\n• 조사완료 후 조사용품 제출\n• 기타 조사 업무에 필요한 사항\n3\n자격요건 및 우대사항\n구\n분\n내 용\n자격요건\n• 만\n18"},{"id":"EXT015#full9","policyId":"EXT015","section":"full","text":"2025 농림어업총조사 조사요원 | 공고 원문 9/25\n세이상 사명감과 책임감이 투철한 자\n• 조사기간 중 조사에 전념할 수 있는 자\n(\n이중취업자가 아닌 자\n)\n• 태블릿 등 스마트기기 활용이 가능한 자\n(CAPI\n조사 가능자\n)\n우대사항\n•\n가구주택기초조사\n,\n인구주택총조사\n,\n농림어업총조사 등 통계조사 경험자\n• 전산\n(\n한글프로세스\n,\n엑셀 등\n)\n자격증 소지자\n• 장애인 고용촉진 및 직업재활법률에 따른 장애인\n•\n국가유공자 등 예우 및 지원에 관한 법률 및"},{"id":"EXT015#full10","policyId":"EXT015","section":"full","text":"2025 농림어업총조사 조사요원 | 공고 원문 10/25\n5.18\n민주 유공자 예우에 관한 법률 등에 따른 지원대상자\n• 저소득층 또는 한부모 가족\n,\n다자녀보육가구 대상자\n• 자가차량 운행 가능자\n4\n모집일정 및 제출서류\n접수기간\n2025. 10. 28.(화) ～ 11. 10.(월) 〔14일간〕\n접수방법\n-\n인터넷\n:\n농림어업총조사 홈페이지\n(www.affcensus.go.kr)\n조사요원 모집공고문 하단의 지원서 작성\n※ 인구주택총조사 홈페이지에서 지원시 본인 명의의 휴대폰이 아닌 경우 지원 불가\n- 방문접수 : 2025. 10. 28(화) ~ 11. 10.(월)\n※ 상록구청 지하 인구주택총조사 상황실 방문 제출\n*12:00 ~13:00 점심시간 제외\n제출서류\n-\n(공통)\n응시원서 및 개인정보 수집·이용 동의서 *사진\n-\n(조사관리자)"},{"id":"EXT015#full11","policyId":"EXT015","section":"full","text":"2025 농림어업총조사 조사요원 | 공고 원문 11/25\n건강보험 자격득실여부 확인서\n-\n(조사원)\n상해보험 가입증명서(조사원만 제출) * 사전 제출 권장\n- (해당자) 통계조사 경력증명서(타시군 또는 그 외 통계작성기관에서 참여한 경우 제출)\n- (해당자) 전산(한글, 엑셀 등) 자격증\n- (해당자) 국가유공자, 장애인, 저소득층, 한부모가족, 다자녀보육 증명서\n※ 해당자 우대사항 증빙서류 미 제출시 인정되지 않음\n5\n합격자 발표\nㅇ 홈페이지 공고 및 개별 문자 통보\n- ‘25. 11. 17.(월)\n※\n합격자는 조사요원 교육을 반드시\n참여하여야 하며 미 이수시 선발\n(\n합격\n)\n이 취소될 수 있음\n6\n유의사항\nㅇ 조사기간 중 안산시청 통계상황실 근무함\n(관리자 및 지원담당자 해당)\nㅇ 응시원서 등에 거짓 기재 또는 기재착오, 구비서류 미제출 등으로 인한 불이익은"},{"id":"EXT015#full12","policyId":"EXT015","section":"full","text":"2025 농림어업총조사 조사요원 | 공고 원문 12/25\n응시자 본인의 책임으로 함\nㅇ\n정당한 사유없이 중도포기 한 경우\n보수 감액함\nㅇ 응시원서에 기재하는 선호 읍면동의 경우 업무 배정시 참고되며, 실제 배정되는\n동은 응시원서에 기재한 동과 다를 수 있음.\nㅇ\n겸업 또는 이중취업 사실을 숨기고 조사에 참여한 경우 계약 해지할 수 있음\nㅇ 조사요원은 개인의 위치정보수집(태블릿을 이용)에 동의하여야 하며, 미동의시\n계약이 불가함\nㅇ 개인상해보험 또는 산재보험은 의무가입하여야 하며, 이를 거부할 경우 합격을\n취소할 수 있음(조사원 해당)\n7\n기 타\nㅇ 공고사항 중 운용일정 등은 사정에 따라 변동될 수 있음.\nㅇ\n유경험자 중 조사인력과의 마찰 등 업무수행에 지장을 주었거나\n,\n기타 사회통념상\n부적절한 행동으로 조사업무를 일탈한 자는 우선순위에서 제외될 수 있음"},{"id":"EXT015#full13","policyId":"EXT015","section":"full","text":"2025 농림어업총조사 조사요원 | 공고 원문 13/25\nㅇ 조사원 방문접수 상록구청 인구주택총조사 상황실(\n☎\n031-408-0926)\n로 문의\nㅇ\n기타 문의는\n안산시 스마트도시과\n(\n☎\n031-481-2084/2820)\n로 문의하시기 바랍니다\n.\n\n[첨부 17622204524891OCHOM62ZDRXGPKFNK8MY1NJA]\n2025 농림어업총조사 조사요원 응시원서\n지원구분"},{"id":"EXT015#full14","policyId":"EXT015","section":"full","text":"2025 농림어업총조사 조사요원 | 공고 원문 14/25\n□\n조사관리자\n□\n조사지원담당자\n□\n조사원\n성\n명\n생년월일\n성명(영어)\n성\n별\n□ 남\n□ 여\n연 락 처\n주\n소\n우편번호 □□□□□\n통계조사경험\n□ 2020 농림어업총조사 조\n사요원 경험 여부\n(\n□있음\n,\n□없음\n)"},{"id":"EXT015#full15","policyId":"EXT015","section":"full","text":"2025 농림어업총조사 조사요원 | 공고 원문 15/25\n□ 2025 인구주택총조사\n조사요원 경험 여부\n(\n□있음\n,\n□없음\n)\n□\n2024\n가구주택기초조사 조사요원 경험 여부\n(\n□있음\n,\n□없음\n)\n□ 2021년 이후 기타 통계조사요원 경험 횟수 (\n)회\n건강보험\n(정확히 기입)"},{"id":"EXT015#full16","policyId":"EXT015","section":"full","text":"2025 농림어업총조사 조사요원 | 공고 원문 16/25\n□ 지역가입자\n□ 직장가입자\n□ 피부양자\n(\n직장보험가입자는 상실신고 이후 지원 가능\n)\n상해보험\n□ 가입(가입증서 제출)\n□ 미가입\n*\n현장조사원 의무가입 사항\n전산자격증\n□\n있음(자격증 사본 제출)\n□\n없음\n스마트기기활용"},{"id":"EXT015#full17","policyId":"EXT015","section":"full","text":"2025 농림어업총조사 조사요원 | 공고 원문 17/25\n□ 상\n□ 중\n□ 하\n조사시 이용교통수단\n□ 자동차\n□ 자전거\n□ 대중교통\n□ 기타(\n)\n지원동기\n□\n경제적 이유\n□\n여가활용\n□\n사회활동 참여\n□\n주위 권유\n□\n기타\n기타\n(우대)\n국가유공자\n□ 대상\n□ 비대상\n장애인"},{"id":"EXT015#full18","policyId":"EXT015","section":"full","text":"2025 농림어업총조사 조사요원 | 공고 원문 18/25\n□ 대상\n□ 비대상\n저소득층\n□ 대상\n□ 비대상\n다자녀보육\n□ 대상\n□ 비대상\n한부모가족\n□ 대상\n□ 비대상\n※ 조사요원 모집신청서 작성 시 정확하게 작성(허위 작성 시 선발 불가)\n※ 조사관리자‧조사지원담당자는 근로계약 대상이며, 4대보험 신고가능자\n※ 전산자격증: 컴퓨터 활용능력, 워드프로세서, MOS Master, 사회조사분석사 등\n※ 조사관리자는 건강보험 자격득실여부 확인서 제출\n위와 같이 2025 농림어업총조사 조사요원에 지원합니다."},{"id":"EXT015#full19","policyId":"EXT015","section":"full","text":"2025 농림어업총조사 조사요원 | 공고 원문 19/25\n2025.\n.\n.\n신 청 자 :\n서명(인)\n안산시장 귀하\n(채용 전) 개인정보 수집·이용동의서(근로계약)\n(\n채용 전\n)\n개인정보 수집\n·\n이용 동의서\n안산시 및 국가데이터처는\n근로자의 채용 및 관리를 위해 「개인정보 보호법」 제\n15\n조\n,\n제\n17\n조\n,\n제\n22\n조에 따라 입사\n지원자의 개인정보를 수집\n·\n이용하고자 합니다\n.\n수집하는 개인정보는 목적 외의 용도로는 이용되지\n않으며, 이용목적이 변경되는 경우에는 개인정보 보호법에 따라 별도의 동의를 받는 등 필요한 조치를 이행할 예정입니다."},{"id":"EXT015#full20","policyId":"EXT015","section":"full","text":"2025 농림어업총조사 조사요원 | 공고 원문 20/25\n□\n[\n필수\n]\n개인정보 수집‧이용 내역\n항목\n수집목적\n보유기간\n공\n통\n성명\n,\n성별\n,\n생년월일\n,\n주소\n,\n연락처\n(\n휴대전화\n)\n채용절차 진행, 본인확인,\n겸업관리,\n채용요건\n(\n자격\n·\n경력 등\n),\n채용우대 확인\n미채용자\n「채용절차공정화에 관한\n법률」에 따라 채용 종료\n후\n180일까지\n해\n당\n자\n자격‧경력‧\n저소득\n‧\n다자녀\n‧한부모\n,\n장애인\n‧\n국가유공자 등\n채용자\n계약 종료 후 3년\n※\n위의 개인정보 수집‧이용에 대한 동의를 거부할 권리가\n있\n습니다\n.\n그러나 동의를 거부할 경우 채용절차에\n따른 심사를 원활하게 진행 할 수 없어 채용에 제한을 받을 수 있습니다\n.\n☞ 위와 같이 개인정보를 처리하는데 동의하십니까?\n동의\n미동의"},{"id":"EXT01 대상자 제외\n)\n가 채용서류의 반환을 요청하는 경우\n본인 확인 후 반환가능하며\n,\n제출된 서류의 내용이 허위일 경우 채용을 취소할 수 있음\n「채용절차의 공정화에 관한 법률」\n제\n11\n조\n(\n채용서류의 반환 등\n)\n① 구인자는 구직자의 채용 여부가 확정된 이후 구직자\n(\n확정된 채용대상자는 제외한다\n)\n가 채용서류의 반환을 청구하는 경우에는 본인임을 확인한 후 대통령령으로 정하는 바에 따라 반환하여야 한다\n.\n다만\n,\n제\n7\n조제\n1\n항에 따라 홈페이지 또는 전자우편으로 제출된 경우나 구직자가 구인자의 요구 없이 자발적으로 제출한 경우에는 그러하지 아니하다\n.\n② 제\n1"},{"id":"EXT016#full8","policyId":"EXT016","section":"full","text":"2026 지역사회건강조사 조사원 | 공고 원문 8/22\n항에 따른 구직자의 채용서류 반환 청구는 서면 또는 전자적 방법 등 고용노동부령으로 정하는 바에 따라 하여야 한다\n.\n③ 구인자는 제\n1\n항에 따른 구직자의 반환 청구에 대비하여 대통령령으로 정하는 기간 동안 채용서류를 보관하여야 한다\n.\n다만\n,\n천재지변이나 그 밖에 구인자에게 책임 없는 사유로 채용서류가 멸실된 경우 구인자는 제\n1\n항에 따른 채용서류의 반환 의무를 이행한 것으로 본다\n.\n④ 구인자는 대통령령으로 정한 반환의 청구기간이 지난 경우 및 채용서류를 반환하지 아니한 경우에는 「개인정보 보호법」에 따라 채용서류를 파기하여야 한다\n.\n⑤ 제\n1\n항에 따른 채용서류의 반환에 소요되는 비용은 원칙적으로 구인자가 부담한다\n.\n다만\n,"},{"id":"EXT016#full9","policyId":"EXT016","section":"full","text":"2026 지역사회건강조사 조사원 | 공고 원문 9/22\n구인자는 대통령령으로 정하는 범위에서 채용서류의 반환에 소요되는 비용을 구직자에게 부담하게 할 수 있다\n.\n5. 지원서 접수\n□\n접수기간\n:\n2026. 3. 9.(\n월\n) ~ 3. 13.(\n금\n)(5\n일간\n)\n(\n※ 중식시간\n12:00~13:00\n제외\n)"},{"id":"EXT016#full10","policyId":"EXT016","section":"full","text":"2026 지역사회건강조사 조사원 | 공고 원문 10/22\n□\n접수방법\n:\n본인 직접 방문접수 및 이메일접수\n(\n※마감일 도착분까지 유효\n)\n□\n접수 및 문의\n문의처\n방\n법\n접수처\n담당자\n전화번호\n상록수보건소\n방문접수\n안산시 상록구 차돌배기로\n1\n길\n5\n(\n상록수보건소 건강증진과\n3\n층\n)\n류은하\n031-481-5699\n이메일접수\nryueun12@korea.kr\n단원보건소\n방문접수\n안산시 단원구 화랑로\n250\n(\n단원보건소 건강증진과\n4\n층\n)\n박찬경\n031-481-6759\n이메일접수\nckck0707@korea.kr"},{"id":"EXT016#full11","policyId":"EXT016","section":"full","text":"2026 지역사회건강조사 조사원 | 공고 원문 11/22\n6. 심사일정\n□ 서류합격자 발표\n: 2026. 3. 18.(\n수\n)\n※\n개별 문자 통보\n(\n미합격자 별도 안내 없음\n)\n□ 면접일시 및 장소\n응시지역\n일시\n면접 장소\n비고\n단원구\n2026. 3. 20.(금) 14:00\n상록수보건소 3층\n큰마당\n※ 면접자 대기실\n:\n상록수보건소\n3\n층\n로비\n상록구"},{"id":"EXT016#full12","policyId":"EXT016","section":"full","text":"2026 지역사회건강조사 조사원 | 공고 원문 12/22\n2026. 3. 20.(금) 16:00\n□ 최종합격자 발표\n: 2026. 3. 23.(\n월\n) 14\n시\n-\n개별 유선 통보\n(\n미합격자 별도 안내 없음\n)\n※ 합격자 발표 및 면 \n모자에게\n있으나\n,\n안산시는\n목적의\n범위\n안에서\n선정작의\n일부\n나\n전체를\n2\n차\n저작물로\n가공\n(\n수정·변형\n)\n할\n수\n있으며\n이를\n일반에\n공개하고\n홍보물로\n제작\n,\n복제\n,\n배포\n등에\n활용할\n수\n있습니다\n."},{"id":"EXT024#full21","policyId":"EXT024","section":"full","text":"2025 안산시 SNS 공모전 '안산의 □□을 담다' | 공고 원문 21/22\n4.\n제출작품이\n타\n공모전\n수상작\n,\n지적재산권\n침해\n,\n표절\n작품으로\n판명될\n경우\n심사\n대상에서\n제외되며\n선정\n후에라도\n선정은\n취소\n되며\n시상금을\n반납하겠습니다\n.\n5.\n공모전\n개최\n공고문에\n명시한\n유의사항을\n확인하였습니다\n."},{"id":"EXT024#full22","policyId":"EXT024","section":"full","text":"2025 안산시 SNS 공모전 '안산의 □□을 담다' | 공고 원문 22/22\n2025.\n.\n.\n참가자\n:\n(\n서명\n또는\n인\n)\n안산시장\n귀하"},{"id":"HELP_PERIOD","policyId":null,"section":"help","title":"거주 기간 계산","text":"거주 기간 계산 | 도움말\n- 거주 기간은 주민등록 전입일부터 기준일(공고일 또는 신청일)까지로 계산\n- '연속 3년'은 중간에 다른 시·군으로 전출하지 않고 이어진 기간\n- '합산 10년'은 예전에 살았던 기간까지 모두 더한 기간\n- 이 서비스는 '내 조건'의 안산 전입일과 이전 거주 연수로 계산하고, 모자라면 언제부터 충족되는지 날짜를 보여 줌\n- 실제로 살았어도 전입신고를 안 했으면 기간에 들어가지 않음","say":"거주 기간은 주민등록 전입일부터 기준일(공고일 또는 신청일)까지로 계산해요. '연속 3년'은 중간에 전출 없이 이어진 기간이고, '합산 10년'은 예전에 살았던 기간까지 모두 더한 기간이에요. 실제로 살았어도 전입신고를 안 했으면 기간에 들어가지 않아요. '내 조건'에 전입일을 넣으면 언제부터 충족되는지 날짜로 보여 드려요.","sourceUrl":null,"keywords":["거주기간","거주 기간","연속","합산","계산","몇 년"]},{"id":"HELP_BASIS","policyId":null,"section":"help","title":"공고일 기준과 신청일 기준","text":"공고일 기준과 신청일 기준 | 도움말\n- 공고일 기준: 공고가 올라온 날에 이미 조건(주민등록 등)을 갖추고 있어야 함. 공고가 난 뒤에 전입신고하면 그 회차는 인정되지 않음\n- 신청일 기준: 신청서를 내는 날까지 조건을 갖추면 됨. 접수 기간 안에 전입신고를 마치고 신청하면 인정\n- 원문에 기준일이 없는 사업은 이 서비스에서 신청일 기준으로 가정하고 화면에 표시함","say":"공고일 기준이면 공고가 올라온 날에 이미 조건(주민등록 등)을 갖추고 있어야 해요. 공고가 난 뒤에 전입신고하면 그 회차는 인정되지 않아요. 신청일 기준이면 신청하는 날까지만 갖추면 돼서, 접수 기간 안에 전입신고를 마치고 신청하면 돼요. 원문에 기준일이 없는 사업은 신청일 기준으로 가정했고 화면에 표시해 뒀어요.","sourceUrl":null,"keywords":["기준일","공고일","신청일","기준","언제까지 전입"]},{"id":"HELP_INCOME","policyId":null,"section":"help","title":"기준 중위소득","text":"기준 중위소득 | 도움말\n- 기준 중위소득: 전국 가구를 소득 순으로 줄 세웠을 때 한가운데 가구의 소득. 보건복지부가 매년 고시\n- 2026년 기준 중위소득(100%): 1인 가구 월 2,564,238원, 4인 가구 월 6,494,738원\n- '중위소득 120% 이하'는 가구 소득이 그 금액의 1.2배 이하라는 뜻\n- 1인 가구 계산값(월): 50% 약 128만 2천원, 60% 약 153만 9천원, 70% 약 179만 5천원, 120% 약 307만 7천원, 150% 약 384만 6천원, 180% 약 461만 6천원\n- 가구원 수를 세는 방법과 소득을 재는 방법(건강보험료 등)은 사업마다 다르므로 공고문을 확인\n- 이 서비스는 소득 조건을 판정하지 않고 '직접 확인해야 하는 조건'으로 보여 줌","say":"기준 중위소득은 전국 가구를 소득 순으로 줄 세웠을 때 한가운데 가구의 소득이에요. 2026년에는 1인 가구 월 2,564,238원, 4인 가구 월 6,494,738원이에요. '중위소득 120% 이하'는 가구 소득이 그 금액의 1.2배 이하라는 뜻이고, 1인 가구라면 약 307만 7천원(60%는 약 153만 9천원, 150%는 약 384만 6천원, 180%는 약 461만 6천원) 정도예요. 가구원 수와 소득을 재는 방법은 사업마다 달라서 공고문을 확인해야 해요. 소득 조건은 이 서비스가 판정하지 않아요.","sourceUrl":"https://www.korea.kr/multi/visualNewsView.do?newsId=148953762","keywords":["중위소득","기준 중위소득","소득 기준","소득 조건","120%","150%","180%","60%"]},{"id":"HELP_MOVEIN","policyId":null,"section":"help","title":"전입신고","text":"전입신고 | 도움말\n- 전입신고: 이사한 뒤 주민등록 주소를 새 주소로 옮기는 신고. 이사한 날부터 14일 안에 해야 함\n- 방법: 새 주소지 행정복지센터 방문 또는 정부24(gov.kr) 온라인 신고\n- 안산에 살고 있어도 전입신고를 하지 않으면 '안산 주민등록' 조건은 충족하지 못함\n- 이 서비스의 '전입하면 충족'은 전입신고만 하면 자격이 생기는 사업","say":"전입신고는 이사한 뒤 주민등록 주소를 새 주소로 옮기는 신고예요. 이사한 날부터 14일 안에 새 주소지 행정복지센터를 방문하거나 정부24에서 온라인으로 하면 돼요. 안산에 살고 있어도 전입신고를 안 했으면 '안산 주민등록' 조건은 충족하지 못해요. 결과 화면의 '전입하면 충족'은 전입신고만 하면 자격이 생기는 사업이에요.","sourceUrl":"https://www.gov.kr","keywords":["전입신고","전입","주소 이전","주민등록 옮기기","이사"]},{"id":"HELP_AGE","policyId":null,"section":"help","title":"만 나이 계산","text":"만 나이 계산 | 도움말\n- 만 나이: 올해 연도에서 태어난 연도를 뺀 뒤, 올해 생일이 아직 안 지났으면 1을 뺌\n- 이 서비스는 생년월일로 오늘 기준 만 나이를 계산하고, 하한 나이에 못 미치면 언제부터 충족되는지 보여 줌\n- 일부 공고는 출생연도 범위로 대상을 정하므로 원문 확인 필요","say":"만 나이는 올해 연도에서 태어난 연도를 빼고, 올해 생일이 아직 안 지났으면 1을 더 빼요. 이 서비스는 생년월일로 오늘 기준 만 나이를 계산하고, 하한 나이에 못 미치면 언제부터 충족되는지 날짜로 알려 드려요. 출생연도 범위로 대상을 정한 공고도 있어서 원문을 같이 확인해 주세요.","sourceUrl":null,"keywords":["만 나이","나이 계산","몇 살","만나이"]},{"id":"HELP_STATUS","policyId":null,"section":"help","title":"판정 결과 읽는 법","text":"판정 결과 읽는 법 | 도움말\n- 충족: 지금 거주·나이 조건을 모두 채움\n- 전입하면 충족: 안산으로 전입신고만 하면 조건을 채움\n- 곧 충족: 거주 기간이나 나이가 모자라지만 날짜가 지나면 채워짐. 그 날짜를 보여 줌\n- 확인필요: 입력한 정보가 부족해서 판정하지 못함\n- 미충족: 지금도, 계산할 수 있는 미래에도 조건을 채우지 못함\n- 모집 마감: 자격과 별개로 이번 접수 기간이 끝난 사업. 맨 아래에 따로 모음\n- 판정은 거주 조건과 나이만 봄. 소득·취업·학적·주택 조건은 직접 확인해야 함","say":"'충족'은 지금 거주·나이 조건을 모두 채웠다는 뜻이에요. '전입하면 충족'은 안산으로 전입신고만 하면 되는 사업, '곧 충족'은 거주 기간이나 나이가 모자라지만 날짜가 지나면 채워지는 사업이에요. '확인필요'는 입력 정보가 부족한 경우, '미충족'은 조건을 채울 수 없는 경우예요. '모집 마감'은 자격과 별개로 이번 접수 기간이 끝난 사업이에요. 판정은 거주와 나이만 보고, 소득·취업·학적 조건은 직접 확인해야 해요.","sourceUrl":null,"keywords":["충족","곧 충족","전입하면 충족","확인필요","미충족","모집 마감","판정","무슨 뜻"]},{"id":"HELP_PRIVACY","policyId":null,"section":"help","title":"개인정보 저장","text":"개인정보 저장 | 도움말\n- 입력한 생년월일·전입일은 이 기기의 브라우저(localStorage)에만 저장\n- 로그인 없음, 서버로 보내지 않음\n- 브라우저 데이터를 지우면 입력값도 사라짐\n- AI 도우미에게 한 질문도 기본 설정에서는 기기 밖으로 나가지 않음(서버 연결을 켠 경우는 그 서버로 전송)","say":"입력한 생년월일과 전입일은 이 기기의 브라우저에만 저장돼요. 로그인도 없고 서버로 보내지도 않아요. 브라우저 데이터를 지우면 같이 사라져요. AI 도우미에게 한 질문도 기본 설정에서는 기기 밖으로 나가지 않아요.","sourceUrl":null,"keywords":["개인정보","저장","내 정보","로그인","서버"]},{"id":"HELP_SITE","policyId":null,"section":"help","title":"신청 사이트에서 공고 찾기","text":"신청 사이트에서 공고 찾기 | 도움말\n- 잡아바 어플라이·경기민원24·고용24·복지로 같은 신청 사이트는 공고로 바로 가는 주소가 없어 첫 화면이 열림\n- 순서: ① 로그인 ② 검색창에 사업명 검색 ③ 못 찾으면 안산시청 공고 원문의 신청 안내 확인\n- 상세 화면의 '검색어 복사하고 열기' 버튼을 누르면 사업명이 복사됨\n- 접수 기간이 아니면 사이트에서 검색되지 않을 수 있음","say":"잡아바 어플라이나 경기민원24 같은 신청 사이트는 공고로 바로 가는 주소가 없어서 첫 화면이 열려요. 로그인한 뒤 검색창에 사업명을 검색해 주세요. 상세 화면의 '검색어 복사하고 열기' 버튼을 누르면 사업명이 복사돼요. 접수 기간이 아니면 검색되지 않을 수 있고, 못 찾으면 안산시청 공고 원문의 신청 안내를 확인해 주세요.","sourceUrl":null,"keywords":["잡아바","경기민원24","고용24","복지로","신청 사이트","못 찾","로그인","검색"]},{"id":"HELP_SCOPE","policyId":null,"section":"help","title":"이 서비스가 다루는 범위","text":"이 서비스가 다루는 범위 | 도움말\n- 안산시청 청년정책 페이지와 고시·공고에서 모은 청년이 신청할 수 있는 사업 52건\n- 판정하는 조건: 거주 요건과 나이. 판정하지 않는 조건: 소득·취업·학적·주택\n- 신청 기간은 2026년 공고 기준. 새 공고가 나오면 달라질 수 있음\n- 다른 시·도 사업과 중앙정부 사업 전체는 다루지 않음\n- 최종 선정은 담당 기관이 확인. 이 서비스의 결과는 참고용","say":"안산시청 청년정책 페이지와 고시·공고에서 모은, 청년이 신청할 수 있는 사업 52건을 다뤄요. 거주 요건과 나이만 판정하고 소득·취업·학적·주택 조건은 직접 확인해야 해요. 신청 기간은 2026년 공고 기준이라 새 공고가 나오면 달라질 수 있어요. 다른 지역 사업은 다루지 않고, 최종 선정은 담당 기관이 확인해요.","sourceUrl":"https://www.ansan.go.kr/www/common/cntnts/selectContents.do?cntnts_id=www01665","keywords":["범위","어떤 사업","몇 건","출처","
