    '선발·심사 방법': /선발\s*(방법|기준|절차)|선정\s*(방법|기준|절차)|심사\s*(방법|기준|항목|절차)|평가\s*(방법|기준|항목)|평가\s*[ㆍ·]\s*선발|서류\s*심사|면접\s*(심사|전형)/,
    '결과 발표·지급 시기': /결과\s*발표|합격자\s*발표|선정\s*발표|발표\s*(일|일시|예정)|지급\s*(일|시기|일정|방법)|입금/,
    '사용처': /사용처|가맹점|사용\s*(가능|범위|기한|용도)|사용할\s*수\s*있/,
    '중복 수혜': /중복\s*(지원|수혜|참여|신청|불가|가능)/,
    '세부 근무·이용 조건': /근무\s*(시간|조건|장소|지|형태|요일)|활동\s*(시간|장소)|대여\s*기간|반납/,
    '보험·세금': /4대\s*보험|사대\s*보험|고용보험|산재보험|국민연금|원천징수|소득세|퇴직금/,
    '중도 해지·포기': /중도\s*(해지|포기|탈락|중단)|해지|환수/,
    '받는 중에 사정이 바뀐 경우': /전출|주소\s*(변경|이전)|자격\s*(상실|변동)|지원\s*중단/,
  };
  // 다른 지역을 콕 집은 질문 (안산·경기도는 범위 안)
  const OTHER_REGION = /(서울|부산|대구|인천|대전|울산|세종|수원|성남|용인|화성|시흥|부천|안양|평택|강원|충북|충남|전북|전남|경북|경남|제주)(특별시|광역시|특별자치시|특별자치도|시|도)?(?=\s|$|의|에서|에|은|는|도|로)|(고양|구리|광주|이천|여주|양주|포천|김포|파주|오산|안성|하남|군포|의왕|광명|과천|남양주|의정부|동두천|가평|양평|연천)(시|군)/;

  const STATUS_LABEL = { eligible: '충족', eligible_if_move_in: '전입하면 충족', eligible_from: '곧 충족', check: '확인필요', ineligible: '미충족' };
  const dot = (d) => (d ? d.replaceAll('-', '.') : '');
  const hasFinal = (w) => { const ch = String(w).replace(/[\s)\]'"」』.]+$/, '').slice(-1); if (ch >= '가' && ch <= '힣') return (ch.charCodeAt(0) - 0xAC00) % 28 !== 0; return '013678lmn'.includes(ch.toLowerCase()); };
  const josa = (w, a, b) => w + (hasFinal(w) ? a : b);
  const shortName = (name) => name.replace(/\([^)]*\)/g, '').replace(/\s+/g, ' ').trim();

  // 사업을 부르는 이름들: 정식 이름에서 연도·기관명·꼬리말을 떼고, 따옴표·괄호 안 이름과 사업별 검색어를 더한다
  function aliasesOf(name, kws) {
    const raw = new Set();
    const inner = [...name.matchAll(/[「『'‘“<]([^」』'’”>]+)[」』'’”>]/g)].map((m) => m[1]);
    const paren = [...name.matchAll(/\(([^)]*)\)/g)].flatMap((m) => m[1].split(/[·,]/));
    let base = name.replace(/\([^)]*\)/g, ' ').split(/[「『'‘“<]/)[0];
    base = base.replace(/^\s*20\d\d년?\s*(기준\s*)?/, '').replace(/^\s*제\d+기\s*/, '');
    for (const b of [base, base.replace(/^\s*(안산시?|경기도)\s+/, '')]) {
      let x = b.trim(), prev;
      do { raw.add(x); prev = x; x = x.replace(/\s*(구성·운영|구축·운영|구성ㆍ운영|구축ㆍ운영|운영|조성|참여자 모집|지원사업|사업|지원)\s*$/, '').trim(); } while (x !== prev && x.length > 1);
    }
    inner.forEach((x) => raw.add(x)); paren.forEach((x) => raw.add(x));
    raw.add(name);
    const names = [...new Set([...raw].map(compact))];
    // 사업별 검색어는 정식 이름의 일부일 때만 '이름'으로 친다 ('청년인턴'·'기본소득'·'응시료' O, '게임 대회'·'토익' X → 이런 말은 검색 점수로만 반영)
    const frag = (kws || []).map(compact).filter((k) => k.length >= 3 && names.some((n) => n.includes(k)));
    return [...new Set([...names.filter((a) => a.length >= 4), ...frag])];
  }

  // ============================================================
  // 4. 엔진
  // ============================================================
  function create({ corpus, policies, judgePolicy, options = {} }) {
    // minMass·specificIdf·minRatio: 낱말 근거 기준 / denseZ: 의미 검색 1위가 뚜렷하다고 보는 기준 / candZ: 후보로라도 보여 줄 기준
    // denseFloor: 의미 검색 1위 유사도가 이보다 낮으면 관련 없는 질문으로 본다 / oosMargin: 범위 밖 예시가 사업 1위보다 이만큼 더 가까우면 범위 밖
    const opt = { bigram: true, keywords: true, mention: true, scope: true, minMass: 3.5, specificIdf: 2.5, minRatio: 0.5, denseZ: 2.4, candZ: 1.5, denseFloor: 0.45, oosMargin: 0.12, ...options };
    const P = new Map(policies.map((p) => [p.id, p]));
    const meta = corpus.policyMeta || {};
    // 공고 원문(section 'full')은 사업을 '찾는' 데 쓰지 않는다. 원문에는 '서류'·'온라인' 같은 흔한 낱말이 많아서 넣어 보니
    // 범위 밖 질문에 후보가 뜨고, 보고 있던 공고에서 다른 사업으로 새는 일이 늘었다(4차 실험). 사업이 정해진 뒤 그 사업 안에서 답을 찾을 때만 쓴다
    const fullChunks = corpus.chunks.filter((c) => c.section === 'full');
    const chunks = corpus.chunks.filter((c) => c.section !== 'full');
    for (const c of fullChunks) {                      // 크기를 줄이려고 코퍼스에는 글만 넣었다 → 보여 줄 문장은 여기서 만든다
      if (c.say) continue;
      const body = c.text.split('\n').slice(1).join('\n');
      c.say = '공고 원문에는 이렇게 적혀 있어요: ' + (body.length <= 300 ? body : body.slice(0, 300) + '…');
      c.quote = body.slice(0, 200);
    }
    const byId = new Map(corpus.chunks.map((c) => [c.id, c]));
    // 검색 단위: 사업 1건 / 도움말 1개 / 범위 밖 유형 1개 (청크 여러 개가 한 단위로 묶인다)
    const unitOf = (c) => c.unit || c.policyId || c.id;
    const chunksOf = new Map();
    chunks.forEach((c) => { const k = unitOf(c); if (!chunksOf.has(k)) chunksOf.set(k, []); chunksOf.get(k).push(c); });
    const unitType = (key) => (P.has(key) ? 'policy' : (chunksOf.get(key)?.[0]?.section === 'oos' ? 'oos' : 'help'));
    const chunkNo = new Map(chunks.map((c, i) => [c.id, i]));
    const titleOf = (c) => (c.policyId ? P.get(c.policyId).name : c.title);

    const index = buildIndex(chunks.map((c) => ({
      id: c.id, oos: c.section === 'oos',
      fields: {
        title: titleOf(c),
        body: c.text.split('\n').slice(1).join('\n'),
        kw: opt.keywords ? (c.policyId ? [...(meta[c.policyId]?.kw || []), ...(meta[c.policyId]?.tags || [])] : (c.keywords || [])).join(' ') : '',
      },
    })), { bigram: opt.bigram, fieldWeights: options.fieldWeights });

    // 공고 원문 전용 색인: 정해진 사업 안에서 질문과 가까운 원문 조각을 고를 때만 쓴다
    const fullOf = new Map();
    fullChunks.forEach((c) => { if (!fullOf.has(c.policyId)) fullOf.set(c.policyId, []); fullOf.get(c.policyId).push(c); });
    const fullIndex = fullChunks.length ? buildIndex(fullChunks.map((c) => ({ id: c.id, fields: { body: c.text.split('\n').slice(1).join('\n') } })), { bigram: opt.bigram }) : null;
    const fullNo = new Map(fullChunks.map((c, i) => [c.id, i]));
    function fullRanked(pid, query) {
      const list = fullOf.get(pid) || [];
      if (!list.length) return [];
      const sc = scoreAll(fullIndex, query);
      return list.map((c) => ({ chunk: c, score: sc[fullNo.get(c.id)] })).sort((a, b) => b.score - a.score);
    }
    const bodyOf = (c) => c.text.split('\n').slice(1).join(' ');

    // 단위별 '이름·검색어' 낱말 (본문에만 나오는 낱말과 구분한다)
    const anchorCache = new Map();
    function anchorOf(key) {
      if (!anchorCache.has(key)) {
        const cs = chunksOf.get(key) || [], c0 = cs[0];
        const kw = !c0 ? [] : (c0.policyId ? [...(meta[c0.policyId]?.kw || []), ...(meta[c0.policyId]?.tags || [])] : cs.flatMap((c) => c.keywords || []));
        anchorCache.set(key, new Set(c0 ? wordTokens([titleOf(c0), ...kw].join(' ')) : []));
      }
      return anchorCache.get(key);
    }

    // 한 사업만 가리키는 이름 (여러 사업이 같이 쓰는 말은 묶음 질문·검색 점수로만 쓴다)
    const aliasOwner = new Map();
    for (const p of policies) for (const a of aliasesOf(p.name, opt.keywords ? meta[p.id]?.kw : [])) {
      if (!aliasOwner.has(a)) aliasOwner.set(a, new Set()); aliasOwner.get(a).add(p.id);
    }
    const kwOwner = new Map();                 // 검색어 → 그 검색어를 쓰는 사업들 (다른 사업도 쓰는 말은 한 사업의 이름으로 치지 않는다: '조사원')
    for (const p of policies) for (const k of (opt.keywords ? meta[p.id]?.kw || [] : []).map(compact)) { if (!kwOwner.has(k)) kwOwner.set(k, new Set()); kwOwner.get(k).add(p.id); }
    const uniqueAliases = [...aliasOwner].filter(([a, s]) => s.size === 1 && (kwOwner.get(a)?.size || 1) === 1).map(([a, s]) => [a, [...s][0]]).sort((x, y) => y[0].length - x[0].length);
    // 질문에서 사업 이름을 지운 나머지 (의도를 읽을 때 '청년기본소득'의 '소득' 같은 글자에 속지 않게)
    function withoutNames(query, pids) {
      let t = rewrite(query);
      for (const pid of pids) for (const [a, owner] of uniqueAliases) {
        if (owner !== pid) continue;
        t = t.replace(new RegExp([...a].map((ch) => ch.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('[^a-z0-9가-힣]*')), ' ');
      }
      return t;
    }

    function mentions(query) {
      if (!opt.mention) return [];
      const q = compact(rewrite(query)), taken = [], found = [];
      for (const [a, pid] of uniqueAliases) {
        const at = q.indexOf(a); if (at < 0) continue;
        if (taken.some(([s, e]) => at < e && at + a.length > s)) continue;      // 더 긴 이름이 이미 차지한 자리
        taken.push([at, at + a.length, pid]);
      }
      taken.sort((x, y) => x[0] - y[0]);                                          // 질문에 나온 순서대로
      for (const [, , pid] of taken) if (!found.includes(pid)) found.push(pid);
      return found;
    }

    // ---- 검색: 청크 점수 → 단위(사업·도움말·범위 밖 유형) 순위 ----
    function rankUnits(scores, isDense) {
      const groups = new Map();
      for (let i = 0; i < chunks.length; i++) {
        const sc = scores[i];
        if (!isDense && sc <= 0) continue;
        const key = unitOf(chunks[i]);
        let g = groups.get(key); if (!g) groups.set(key, (g = []));
        g.push({ chunk: chunks[i], score: sc });
      }
      return [...groups].map(([key, list]) => {
        list.sort((a, b) => b.score - a.score);
        return { key, type: unitType(key), score: isDense ? list[0].score : list[0].score + 0.3 * (list[1]?.score || 0), chunks: list };
      }).sort((a, b) => b.score - a.score);
    }
    // dense(청크별 코사인 유사도 배열)가 오면 의미 검색 순위를 쓰고, 없으면 BM25 순위를 쓴다. 이름이 나온 사업은 어느 쪽이든 맨 앞.
    // ranked·all 은 사업·도움말만 담는다. 범위 밖 예시가 1위였는지는 scope 에 따로 담는다
    function search(query, k = 5, dense = null) {
      const lexAll = rankUnits(scoreAll(index, query), false);
      const denAll = dense ? rankUnits(dense, true) : null;
      const inScope = (r) => r.type !== 'oos';
      const lex = lexAll.filter(inScope), den = denAll ? denAll.filter(inScope) : null;
      const ranked = (den || lex).slice();
      // 의미 검색일 때: 1위가 전체 분포에서 얼마나 튀는지(z). 범위 밖 질문은 어느 문서와도 비슷하게 낮아서 z 가 작다
      let z = null;
      if (den && ranked.length > 2) {
        const v = ranked.map((r) => r.score), mean = v.reduce((a, b) => a + b, 0) / v.length;
        const sd = Math.sqrt(v.reduce((a, b) => a + (b - mean) ** 2, 0) / v.length) || 1;
        z = (v[0] - mean) / sd;
      }
      const natural = ranked[0] || null, naturalScore = natural ? natural.score : 0;
      // 범위 밖인지: 낱말 쪽은 유형별 낱말·이름이 질문에 있을 때, 의미 쪽은 범위 밖 예시가 사업 1위보다 가까울 때(차이는 margin)
      const denTop = denAll ? denAll[0] : null;
      const scope = !opt.scope ? { lex: null, den: null } : {
        lex: scopeLex(query),
        den: denTop && denTop.type === 'oos' ? { key: denTop.key, score: denTop.score, margin: denTop.score - naturalScore } : null,
      };
      const lexEv = evidence(query, lex[0] || null);
      const m = mentions(query);
      if (m.length) {
        const top = naturalScore || 1;
        for (const pid of m) {
          let r = ranked.find((x) => x.key === pid);
          if (!r) ranked.push((r = { key: pid, type: 'policy', score: 0, chunks: [] }));
          else ranked[ranked.indexOf(r)] = (r = { ...r });
          r.score += top + 1 + (m.length - m.indexOf(pid)) * 1e-6; r.mentioned = true;      // 질문에 먼저 나온 사업이 앞에 오게
        }
        ranked.sort((a, b) => b.score - a.score);
      }
      return { ranked: ranked.slice(0, k), all: ranked, mentioned: m, evidence: den ? evidence(query, natural) : lexEv, lexEvidence: lexEv, lexTop: lex[0] || null, z, dense: !!dense, scope, natural };
    }

    const NAME_TAIL_WORD = /^(적금|통장|계좌|저축|장학금|수당|급여|연금|지원금|장려금|바우처|이용권|카드|패스|대출|보험|공제|주택|임대|청약|제도)$/;
    // 수집한 자료(사업·도움말)에 없는 낱말인지: 4글자 이상 한글 낱말이고, 자료에 있는 낱말들로 쪼개지지도 않을 때
    //  '월세지원금' = 월세+지원금 → 있는 말 / '청년희망적금' = 청년+희망(없음)+적금 → 없는 말(이름일 수 있다)
    const known = (w) => (index.dfIn.get(w) || 0) > 0 || NAME_TAIL_WORD.test(w);
    function splits(w) {
      if (known(w)) return true;
      for (let i = 2; i <= w.length - 2; i++) if (known(w.slice(0, i)) && splits(w.slice(i))) return true;
      return false;
    }
    const isUnseen = (w) => /^[가-힣]{4,}$/.test(w) && !splits(w);
    // 제도 이름처럼 생긴 낱말: 자료에 없는 말이면서 제도 종류를 나타내는 말로 끝난다 ('행복주택', '청년희망적금', '국가장학금')
    const NAME_TAIL = /(적금|통장|계좌|저축|장학금|수당|급여|연금|지원금|장려금|바우처|이용권|카드|패스|대출|보험|공제|주택|임대|청약|제도)$/;
    const unknownNames = (query) => [...new Set(wordTokens(query))].filter((w) => isUnseen(w) && NAME_TAIL.test(w));

    // 범위 밖 유형별 낱말(머리 청크의 keywords)과 자료에 없는 제도 이름(names).
    // 낱말 검색 쪽 판단은 이 낱말이 질문에 '그대로' 있을 때만 한다 (예시 문장에 우연히 들어간 '제도'·'영어' 같은 말로는 판단하지 않는다)
    const scopeUnits = chunks.filter((c) => c.section === 'oos' && c.id === unitOf(c)).map((h) => ({
      key: h.id, kws: (h.keywords || []).filter((k) => !(h.names || []).includes(k)).map((k) => wordTokens(k)).filter((t) => t.length),
      names: (h.names || []).map((n) => [n, compact(n)]).filter(([, c]) => c.length >= 3),
    }));
    function scopeLex(query) {
      const qt = new Set(wordTokens(query)), cq = compact(rewrite(query));
      let best = null;
      for (const u of scopeUnits) {
        const name = u.names.find(([, c]) => cq.includes(c));
        const hits = u.kws.filter((t) => t.every((w) => qt.has(w)));          // 낱말 여러 개짜리('영화 추천')는 모두 있어야 한다
        const n = hits.length + (name ? 2 : 0);
        if (n && (!best || n > best.n)) best = { key: u.key, n, name: name ? name[0] : null, words: hits.map((t) => t.join(' ')) };
      }
      return best;
    }

    // 어느 사업 이야기에나 나올 수 있는 말. 자료가 짧아서 드물게 나오지만(idf 가 높지만) 그 사업을 가리키는 근거로는 치지 않는다
    const GENERIC = new Set(['지원금', '지원', '혜택', '사업', '제도', '프로그램', '서비스', '정보', '추천', '방법', '신청', '접수', '모집', '참여', '활동', '운영', '대상', '기간', '내용', '문의', '안산', '안산시', '안산시청', '시청', '청년']);
    // 검색 1위가 믿을 만한지: 질문의 낱말 중 그 단위의 청크에 '그대로' 있는 낱말의 idf 합(mass)과 비율(ratio).
    // 글자 2-gram만 겹친 경우는 세지 않는다 → '국민취업지원제도'처럼 자료에 없는 이름을 비슷한 사업으로 답하지 않게
    function evidence(query, top) {
      const words = [...new Set(wordTokens(query))].filter((w) => w.length >= 2 || /[a-z0-9]/.test(w));
      if (!words.length || !top) return { mass: 0, ratio: 0, specific: 0, anchor: 0, matched: [], unseen: [] };
      const idx = (chunksOf.get(top.key) || []).map((c) => chunkNo.get(c.id));
      const unseenIdf = Math.log(1 + (index.inN + 0.5) / 0.5);
      const w8 = (w) => index.idf.get(w) ?? unseenIdf;
      const matched = words.filter((w) => { const m = index.postings.get(w); return m && idx.some((i) => m.has(i)); });
      const mass = matched.reduce((a, w) => a + w8(w), 0);
      const anchors = anchorOf(top.key);
      // 자료 어디에도 없는 긴 낱말 (이름일 수 있다: '청년희망적금'). 의미 검색이 비슷한 사업을 '그 사업'인 것처럼 답하지 않게 하는 데 쓴다
      const unseen = words.filter(isUnseen);
      const spec = matched.filter((w) => w8(w) >= opt.specificIdf && !GENERIC.has(w));
      return { mass, ratio: mass / words.reduce((a, w) => a + w8(w), 0), specific: spec.length, anchor: spec.filter((w) => anchors.has(w)).length, matched, unseen };
    }
    // hasEvidence: 드문 낱말이 하나라도 그대로 겹친다(그 사업 이야기일 수 있다)
    // confident: 바로 답해도 될 만큼 겹친다 — 드문 낱말 2개 이상, 또는 질문 대부분이 겹치고 그 낱말이 그 사업의 이름·검색어에 있다('월세', '토익')
    //  드문 낱말 하나('지원금', '혼자')만 겹친 경우는 1위가 틀리는 일이 잦아서(2차 분석) 바로 답하지 않고 후보로 보여 준다
    const hasEvidence = (ev) => ev.specific >= 1 && ev.mass >= opt.minMass;
    const confident = (ev) => hasEvidence(ev) && (ev.specific >= 2 || (ev.ratio >= opt.minRatio && ev.anchor >= 1));

    function sectionOf(query) {
      for (const [sec, re] of SECTION_RULES) if (re.test(query)) return sec;
      return null;
    }

    function judge(pid, ctx) { return ctx.profile ? judgePolicy(P.get(pid), ctx.profile, ctx.today) : null; }
    function recruitLine(r) {
      const rc = r.recruit;
      if (rc.state === 'open') return `지금 접수 중이고 마감까지 ${josa('D-' + rc.dday, '이에요', '예요')}.`;
      if (rc.state === 'upcoming') return `접수 시작까지 ${josa('D-' + rc.dday, '이에요', '예요')}.`;
      if (rc.state === 'always') return '상시 신청할 수 있어요.';
      if (rc.state === 'closed') return '이번 모집은 마감됐어요.';
      return '모집 일정은 공고에서 확인해야 해요.';
    }
    function verdictLine(r, me = '내 조건') {
      const why = r.checks.filter((c) => c.state !== 'ok').map((c) => c.text);
      if (r.status === 'eligible') return `${me}으로는 거주·나이 조건을 모두 채웠어요(충족).`;
      if (r.status === 'eligible_if_move_in') return `${me}으로는 안산 주민등록만 없어요. 전입신고하면 충족이에요.`;
      if (r.status === 'eligible_from') return `${me}으로는 아직 모자라고, ${dot(r.eligibleFrom)}부터 충족이에요. (${why.join(' / ')})`;
      if (r.status === 'check') return `${me}만으로는 판정하지 못했어요(확인필요). ${r.hint || ''}`.trim();
      return `${me}으로는 미충족이에요. ${r.hint || ''} (${why.join(' / ')})`.replace(/\s+\(\)$/, '');
    }
    // 판정 결과를 모델에게 줄 '자료' 한 덩어리로
    function judgeFact(pid, r) {
      const lines = [`판정: ${STATUS_LABEL[r.status]}${r.eligibleFrom ? ` (${r.eligibleFrom}부터 충족)` : ''}`];
      r.checks.forEach((c) => lines.push(`${c.key === 'age' ? '나이' : '거주'}: ${c.text}`));
      if (r.hint) lines.push(`안내: ${r.hint}`);
      if (r.selfCheck?.length) lines.push(`직접 확인할 조건(판정 안 함): ${r.selfCheck.join(' / ')}`);
      lines.push(`모집 상태: ${recruitLine(r)}`);
      return `${P.get(pid).name} | 내 조건 판정 결과\n` + lines.map((l) => `- ${l}`).join('\n');
    }

    const src = (c) => ({
      chunkId: c.id, policyId: c.policyId, section: c.section, label: `${titleOf(c)} · ${SECTION_LABEL[c.section]}`,
      quote: c.quote || null, url: c.policyId ? P.get(c.policyId).sourceUrl : (c.sourceUrl || null),
      sourceLabel: c.policyId ? (meta[c.policyId]?.sourceLabel || '안산시청') : (c.sourceUrl ? '외부 자료' : '서비스 도움말'),
    });
    const getChunk = (pid, sec) => byId.get(`${pid}#${sec}`);
    // 나이 조건을 글로: 만 19~34세 / 만 29세 이하 / 만 19세 이상 / 제한 없음
    function ageText(p) {
      const { min, max } = p.age || {};
      if (min == null && max == null) return null;
      if (min != null && max != null) return min === max ? `만 ${min}세` : `만 ${min}~${max}세`;
      return min != null ? `만 ${min}세 이상` : `만 ${max}세 이하`;
    }
    const ageFits = (p, n) => (p.age?.min == null || n >= p.age.min) && (p.age?.max == null || n <= p.age.max);
    // 개요 문장에서 "○○은 △△ 분야 사업이에요." 를 뗀 나머지 (여러 사업을 나란히 보여 줄 때)
    const gist = (pid) => { const o = getChunk(pid, 'overview'); return o ? o.say.replace(/^[^.]*분야 사업이에요\.\s*/, '').trim() : P.get(pid).benefit; };
    // 질문 낱말과 가장 많이 겹치는 줄 (사업명 낱말은 빼고 센다) → 답 맨 앞에 보여 준다
    function bestLine(query, chunk) {
      const nameTok = new Set(tokenize(titleOf(chunk), false));
      const q = tokenize(query).filter((t) => !nameTok.has(t));
      let best = null, bestScore = 0;
      for (const line of chunk.text.split('\n').slice(1)) {
        const lt = new Set(tokenize(line));
        const s = q.reduce((a, t) => a + (lt.has(t) ? (t[0] === '§' ? 0.5 : 1.5) : 0), 0);
        if (s > bestScore) { best = line.replace(/^- /, ''); bestScore = s; }
      }
      return bestScore >= 1.5 ? best : null;
    }

    // 모델이 답을 쓰기 전에 먼저 묻는 것: 이 자료로 답할 수 있나 (예/아니오). 답이 한 낱말이라 빠르고, 숫자를 지어낼 틈이 없다
    function checkPrompt(query, contexts) {
      const body = contexts.map((t, i) => `[${i + 1}] ${t}`).join('\n\n');
      return { system: CHECK_SYSTEM, user: `[자료]\n${body}\n\n[질문] ${query}\n\n[자료만 보고 답할 수 있나요? 예 또는 아니오]` };
    }
    const SYSTEM = [
      "당신은 '안산 청년 혜택 알리미'의 공고문 안내 도우미입니다. 아래 규칙을 지켜 한국어 존댓말(해요체)로 답하세요.",
      '1. [자료]에 적힌 내용만 사용합니다. 자료에 없는 내용은 지어내지 말고 "수집한 공고 자료에는 그 내용이 없어요. 원문에서 확인해 주세요."라고 답합니다.',
      '2. 자격을 직접 판정하지 않습니다. [자료]에 "내 조건 판정 결과"가 있으면 그 결과를 그대로 전하고 이유를 설명합니다.',
      '3. 금액·날짜·나이·전화번호는 자료에 적힌 숫자 그대로 씁니다.',
      '4. 질문에 대한 답부터 말하고, 2~3문장으로 짧게 씁니다. 문장 끝에 근거 번호를 [1]처럼 붙입니다.',
    ].join('\n');
    function prompt(query, contexts) {
      const body = contexts.map((t, i) => `[${i + 1}] ${t}`).join('\n\n');
      return { system: SYSTEM, user: `[자료]\n${body}\n\n[질문] ${query}\n\n[답]` };
    }

    // ---- 목록·조건 질문: 질문 → 조건 {분류, 내 조건, 지금 신청, 나이, 항목} → 분류로 거르기 → 판정 엔진 → 모집 상태 ----
    const idsOfTopic = (t) => { const set = new Set(t.ids || []); return policies.filter((p) => set.has(p.id) || (meta[p.id]?.tags || []).some((g) => t.tags.includes(g))).map((p) => p.id); };
    // 질문에서 분류 고르기: '할 수 있는 ○○', '맞는 ○○'처럼 바로 뒤에 오는 분류가 먼저, 없으면 질문에서 가장 뒤에 나온 분류(한국어는 중심 낱말이 뒤에 온다)
    function listTopic(text) {
      const hits = [];
      for (const t of LIST_TOPICS) { const m = t.re.exec(text); if (m) { let at = m.index, end = m.index + m[0].length; for (const m2 of text.matchAll(new RegExp(t.re.source, 'g'))) { at = m2.index; end = m2.index + m2[0].length; } hits.push({ t, at, end, first: m.index }); } }
      if (!hits.length) return null;
      const fit = FIT.exec(text);
      if (fit) {
        const win = text.slice(fit.index + fit[0].length, fit.index + fit[0].length + 14);
        const after = hits.map((h) => ({ h, i: win.search(h.t.re) })).filter((x) => x.i >= 0).sort((a, b) => a.i - b.i)[0];
        if (after) return after.h.t;
      }
      // 문장 끝 쪽 분류를 고르되, 낱말이 겹치면('공공일자리' 안의 '일자리') 더 긴 쪽(더 좁은 분류)을 고른다
      return hits.sort((a, b) => b.end - a.end || (b.end - b.at) - (a.end - a.at))[0].t;
    }
    const monthsOf = (p, today) => {
      const a = p.apply || {};
      if (!a.start) return null;
      const [y1, m1] = a.start.split('-').map(Number), [y2, m2] = (a.end || a.start).split('-').map(Number), ty = Number(String(today || '').slice(0, 4)) || y1;
      const yy = y1 !== ty ? `${y1}년 ` : '';
      return m1 === m2 && y1 === y2 ? `${yy}${m1}월` : `${yy}${m1}~${y2 !== y1 ? y2 + '년 ' : ''}${m2}월`;
    };
    const RECRUIT_RANK = { open: 0, upcoming: 1, always: 2, unknown: 3, closed: 4 };
    // cond: { topic, personal, openOnly, age, section } — 규칙으로 만든 조건. 나중에 모델이 같은 모양의 조건을 만들어 넘겨도 된다
    function listByConditions(cond, ctx, scoreOf = new Map()) {
      const t = cond.topic, label = t.label, ids = idsOfTopic(t);
      const rs = new Map(ctx.profile ? ids.map((id) => [id, judgePolicy(P.get(id), ctx.profile, ctx.today)]) : []);
      const st = (id) => rs.get(id)?.status, rc = (id) => rs.get(id)?.recruit || { state: 'unknown' };
      const okNow = (id) => !cond.personal || ['eligible', 'eligible_if_move_in'].includes(st(id));
      const ageOk = (id) => cond.age == null || ageFits(P.get(id), cond.age);
      const isOpen = (id) => ['open', 'always'].includes(rc(id).state);
      ids.sort((a, b) => (isOpen(b) && okNow(b) && ageOk(b)) - (isOpen(a) && okNow(a) && ageOk(a)) || RECRUIT_RANK[rc(a).state] - RECRUIT_RANK[rc(b).state]
        || (rc(a).dday ?? 999) - (rc(b).dday ?? 999) || (scoreOf.get(b) || 0) - (scoreOf.get(a) || 0));
      const nm = (id) => shortName(P.get(id).name);
      const n = ids.length, parts = [];
      // 1) 분류와 개수
      const pool = ids.filter(ageOk);
      const now = pool.filter((id) => isOpen(id) && okNow(id));
      const allClosed = rs.size && ids.every((id) => rc(id).state === 'closed');
      if (cond.openOnly && rs.size && !now.length) parts.push(`지금 신청할 수 있는 '${label}' 사업은 없어요.`);
      const head = parts.length;
      parts.push(`'${label}' 사업은 ${n}건이에요` + (n <= 8 && !allClosed ? `: ${ids.map(nm).join(', ')}.` : '.'));
      // 2) 말한 나이 / 내 조건
      if (cond.age != null) parts.push(`그중 만 ${cond.age}세가 나이 조건에 드는 건 ${pool.length}건이에요${pool.length && pool.length < n ? `: ${pool.map(nm).join(', ')}` : ''}. (말한 나이를 만 나이로 봤어요)`);
      else if (cond.personal && rs.size) {
        const by = (s) => ids.filter((id) => st(id) === s);
        const kinds = [['eligible', '충족'], ['eligible_if_move_in', '전입하면 충족'], ['eligible_from', '곧 충족'], ['check', '확인필요'], ['ineligible', '미충족']].filter(([s]) => by(s).length);
        const from = (s) => (s === 'eligible_from' ? `(${[...new Set(by(s).map((id) => dot(rs.get(id).eligibleFrom)))].join(', ')}부터)` : '');
        if (kinds.length === 1) parts.push(`내 거주·나이 조건으로는 ${n}건 모두 ${kinds[0][1]}${from(kinds[0][0])}이에요.`);
        else parts.push(`내 거주·나이 조건으로는 ${kinds.map(([s, k]) => `${k} ${by(s).length}건${from(s)}`).join(', ')}이에요.`);
      }
      // 묻는 항목이 있으면("대회 신청 방법") 사업마다 그 항목 한 줄 (내 조건·나이를 물은 경우는 판정 요약이 먼저라 붙이지 않는다)
      const LINE = { period: ['접수 기간', '안내'], benefit: ['금액', '내용'], method: ['신청 방법'], contact: ['담당', '문의'], target: ['나이', '거주'] }[cond.section];
      const listSection = LINE && !cond.personal && cond.age == null && n <= 8 ? cond.section : null;
      if (listSection) {
        const lineOf = (id) => { const c = getChunk(id, listSection); if (!c || c.thin) return null; for (const lb of LINE) { const m = c.text.match(new RegExp(`\\n- ${lb}: ([^\\n]+)`)); if (m) return m[1]; } return null; };
        parts[head] = `'${label}' 사업 ${n}건의 ${SECTION_LABEL[listSection]}${hasFinal(SECTION_LABEL[listSection]) ? '이에요' : '예요'}: ` + ids.map((id, i) => `${'①②③④⑤⑥⑦⑧'[i]} ${nm(id)} — ${lineOf(id) || '자료에 없음'}`).join(' ') + '.';
      }
      // 3) 모집 상태: 지금 신청할 수 있는 것 / 모두 끝났으면 지난 접수 시기
      if (rs.size) {
        const tag = (id) => (rc(id).state === 'always' ? '상시' : `D-${rc(id).dday}`) + (st(id) === 'eligible_if_move_in' && cond.personal ? ', 전입하면' : '');
        const but = cond.personal || cond.age != null ? '하지만 ' : '';
        if (now.length) parts.push(`지금 신청할 수 있는 건 ${now.length}건이에요: ${now.slice(0, 5).map((id) => `${nm(id)}(${tag(id)})`).join(', ')}${now.length > 5 ? ' 등' : ''}.`);
        else if (allClosed) {
          // 모두 끝났으면 지난 접수 시기를 알려 준다 (사업마다 접수 기간을 이미 보여 준 경우는 빼고)
          const when = listSection === 'period' ? [] : ids.map((id) => [id, monthsOf(P.get(id), ctx.today)]).filter(([, w]) => w);
          // '지금 신청할 수 있는 건 없어요'로 이미 시작했으면 '지금은'을 되풀이하지 않는다
          parts.push(`${but}${cond.openOnly ? '' : '지금은 '}${n}건 모두 이번 모집이 끝났어요.` + (when.length ? ` 지난 접수 시기는 ${when.slice(0, 4).map(([id, w]) => `${nm(id)} ${w}`).join(', ')}${when.length > 4 ? ' 등' : ''}이었어요.` : '') + ' 다음 모집은 안산시청 공고에서 확인해 주세요.');
        } else if (!cond.openOnly) {
          const soon = ids.filter((id) => rc(id).state === 'upcoming');
          parts.push(`${but}지금 접수 중인 건 없어요.` + (soon.length ? ` 곧 접수가 시작되는 건 ${soon.map((id) => `${nm(id)}(D-${rc(id).dday})`).join(', ')}이에요.` : ''));
        }
      }
      const how = [`분류=${label}`, cond.personal ? '내 조건' : null, cond.openOnly ? '지금 신청' : null, cond.age != null ? `나이 ${cond.age}세` : null, listSection ? `항목=${SECTION_LABEL[listSection]}` : null].filter(Boolean).join(', ');
      return { kind: 'list', intent: 'list', section: listSection, policies: ids, cards: ids.slice(0, 10), text: parts.join(' '), cond: { ...cond, topic: label },
        sources: ids.slice(0, 3).map((id) => src(getChunk(id, 'overview'))), suggestions: now.length ? now.slice(0, 3).map((id) => `${nm(id)} 어디서 신청해요?`) : SUGGEST_HOME, llm: { use: false }, how };
    }

    const SUGGEST_HOME = ['전입신고하면 뭐가 달라져요?', '지금 신청할 수 있는 거 뭐 있어?', '거주 기간은 어떻게 계산해요?'];
    const suggestFor = () => ['나는 받을 수 있어?', '얼마 받아요?', '어디서 신청해요?', '언제 모집해요?'];
    const SCOPE_LINE = `저는 안산시청에 올라온 청년 사업 ${policies.length}건의 공고 내용만 답할 수 있어요.`;

    // ---- 답 만들기 ----
    function answer(query, ctx = {}) {
      const q = String(query || '').trim();
      const page = ctx.page && P.has(ctx.page) ? ctx.page : null;
      const prev = ctx.prev && P.has(ctx.prev) ? ctx.prev : null;      // 바로 앞 답에서 다룬 사업 (이어 묻는 질문용)
      const base = { query: q, kind: 'abstain', intent: null, section: null, focus: null, text: '', policies: [], sources: [], cards: [], abstain: false, reason: null, llm: { use: false }, suggestions: SUGGEST_HOME, debug: {} };
      const done = (route, o) => ({ ...base, ...o, debug: { ...base.debug, route } });
      if (!q) return done('empty', { abstain: true, reason: 'empty', text: '질문을 입력해 주세요.' });

      // (1) 인사·챗봇 소개
      if (THANKS.test(norm(q)) && q.length < 20) {
        return done('인사', { kind: 'meta', intent: 'meta', text: '도움이 됐다면 다행이에요. 더 궁금한 사업이 있으면 언제든 물어보세요.' });
      }
      if (META.test(norm(q)) && q.length < 30) {
        return done('챗봇 소개', { kind: 'meta', intent: 'meta', text: `안산시 청년 사업 ${policies.length}건의 공고 내용을 근거로 답하는 도우미예요. 지원 금액·대상·기간·신청 방법·문의처를 물어보거나, "나는 받을 수 있어?", "전입신고하면 뭐가 달라져요?"처럼 내 조건으로 물어볼 수 있어요. 자격 판정은 결과 화면의 규칙 엔진이 하고, 저는 그 결과와 공고 내용을 설명해요.` });
      }
      // (2) 다른 지역
      const region = q.match(OTHER_REGION);
      if (region && !/안산/.test(q)) {
        return done('다른 지역', { abstain: true, reason: 'other_region', intent: 'oos', text: `${region[0]} 사업은 다루지 않아요. 이 서비스는 안산시청에 올라온 청년 사업 ${policies.length}건만 다뤄요. 전국 사업은 온통청년(youthcenter.go.kr)에서 찾아볼 수 있어요.` });
      }

      const found = search(q, 6, ctx.dense || null);
      const mentioned = found.mentioned;
      const bare = withoutNames(q, mentioned);                    // 사업 이름을 뺀 질문 (의도 읽기용)
      const section = sectionOf(bare);
      const firstPerson = FIRST_PERSON.test(q), third = THIRD_PARTY.test(bare);
      const ev = found.evidence;
      const saidAge = (() => { const m = bare.match(/(?:만\s*)?(\d{1,2})\s*세(?!대)/); return m && ASK_OK.test(bare) ? Number(m[1]) : null; })();
      base.debug = { mode: found.dense ? 'dense' : 'bm25', z: found.z == null ? null : +found.z.toFixed(2), mass: +ev.mass.toFixed(1), specific: ev.specific, matched: ev.matched, unseen: ev.unseen,
        top: found.ranked.slice(0, 3).map((r) => [r.key, +r.score.toFixed(2)]), lexTop: found.lexTop ? found.lexTop.key : null, mentioned, section,
        scope: { lex: found.scope.lex ? [found.scope.lex.key, found.scope.lex.name || found.scope.lex.words.join('·')] : null, den: found.scope.den ? [found.scope.den.key, +found.scope.den.score.toFixed(2), +found.scope.den.margin.toFixed(2)] : null } };

      // 목록·조건 질문의 분류 (사업 이름을 말했으면 목록이 아니다)
      const topic = mentioned.length ? null : listTopic(rewrite(q));
      const topicCue = !!topic && (topic.always || LIST_ASK.test(bare) || FIT.test(bare) || NOW_LIST.test(bare));
      const tag = topic && topic.always ? topic.label : null;            // 범위 밖 안내에서 '안산의 ○○ 사업' 카드를 보여 줄 때 쓴다
      const tagIds = tag ? idsOfTopic(topic) : [];
      const listCond = () => ({ topic, personal: !!ctx.profile && !third && (firstPerson || /맞는|(받을|신청할|지원할|참여할|참가할|나갈)\s*수\s*있/.test(bare) || WHEN_OK.test(bare) || CAN_GET.test(bare)),
        openOnly: NOW_LIST.test(bare), age: saidAge, section });
      const listAnswer = (why) => { const o = listByConditions(listCond(), ctx, new Map(found.all.map((r) => [r.key, r.score]))); return done(`${why} (조건: ${o.how})`, o); };
      // 내 조건으로 지금 신청할 수 있는 사업 목록 ("지금 신청할 수 있는 거?", "뭐 받을 수 있어?", "지원금 뭐 있어?")
      const openList = (route) => {
        const res = policies.map((p) => judgePolicy(p, ctx.profile, ctx.today)).filter((r) => r.status === 'eligible');
        const open = res.filter((r) => r.recruit.state === 'open').sort((a, b) => a.recruit.dday - b.recruit.dday);
        const always = res.filter((r) => r.recruit.state === 'always');
        const nm = (r) => shortName(r.name);
        return done(route, { kind: 'judge', intent: 'now_open', policies: [...open, ...always].map((r) => r.id), cards: [...open, ...always].slice(0, 6).map((r) => r.id),
          text: `내 조건으로 지금 신청할 수 있는 사업은 접수 중 ${open.length}건, 상시 ${always.length}건이에요.` +
            (open.length ? ` 접수 중: ${open.map((r) => `${nm(r)}(D-${r.recruit.dday})`).join(', ')}.` : '') +
            (always.length ? ` 상시: ${always.slice(0, 4).map(nm).join(', ')}${always.length > 4 ? ' 등' : ''}.` : '') +
            ' 소득·취업·학적 조건은 각 사업 화면에서 직접 확인해 주세요.' });
      };
      // (3) 내 조건으로 훑어보는 질문 (판정 엔진 결과만으로 답한다)
      if (ctx.profile && !mentioned.length) {
        const all = () => policies.map((p) => judgePolicy(p, ctx.profile, ctx.today));
        const openNow = (r) => ['open', 'always'].includes(r.recruit.state);
        const nm = (r) => shortName(r.name);
        if (MOVE_IN.test(q) && /(뭐|무엇|어떤|달라|바뀌|더\s*받|좋|혜택)/.test(q)) {
          const res = all();
          if (ctx.profile.ansanRegistered) {
            const need = res.filter((r) => r.checks[0].state === 'ok' && P.get(r.id).residence.type !== 'R7' && P.get(r.id).residence.type !== 'R10');
            return done('판정 엔진(전입 효과)', { kind: 'judge', intent: 'move_in', policies: need.slice(0, 6).map((r) => r.id), cards: need.slice(0, 6).map((r) => r.id),
              text: `이미 안산으로 전입신고가 되어 있어요. 안산·경기도 주민등록이 필요한 사업 ${need.length}건은 거주 조건을 채운 상태예요. 거주 '기간'이 필요한 사업은 전입일부터 계산해요.` });
          }
          const mv = res.filter((r) => r.status === 'eligible_if_move_in');
          const open = mv.filter(openNow);
          const order = [...open, ...mv.filter((r) => !openNow(r))];
          return done('판정 엔진(전입 효과)', { kind: 'judge', intent: 'move_in', policies: order.map((r) => r.id), cards: order.slice(0, 6).map((r) => r.id),
            text: `전입신고하면 ${mv.length}건이 '충족'으로 바뀌어요. 그중 지금 신청할 수 있는 건 ${open.length}건이에요${open.length ? `: ${open.slice(0, 4).map(nm).join(', ')}` : ''}. 거주 '기간'이 필요한 사업(장학금 등)은 전입한 날부터 기간을 세기 시작해요.`,
            sources: [src(byId.get('HELP_MOVEIN'))] });
        }
        if (DEADLINE.test(q)) {
          const res = all().filter((r) => r.recruit.state === 'open' && r.status !== 'ineligible').sort((a, b) => a.recruit.dday - b.recruit.dday);
          const ok = res.filter((r) => r.status === 'eligible');
          const first = ok[0] || res[0];
          if (!first) return done('판정 엔진(마감 임박)', { kind: 'judge', intent: 'deadline', text: '지금 접수 중인 사업이 없어요.' });
          return done('판정 엔진(마감 임박)', { kind: 'judge', intent: 'deadline', policies: res.map((r) => r.id), cards: res.slice(0, 6).map((r) => r.id),
            text: `지금 접수 중인 사업은 ${res.length}건이에요. 내 조건으로 바로 신청할 수 있는 것 중 마감이 가장 가까운 건 ${nm(first)}(D-${first.recruit.dday})예요.` +
              (res[0] !== first ? ` ${nm(res[0])}(D-${res[0].recruit.dday})는 더 빨리 마감하지만 지금은 '${STATUS_LABEL[res[0].status]}' 상태예요.` : '') });
        }
        const whatCan = (WHAT_CAN.test(q) || (FIT.test(bare) && /(거|것|게|사업|혜택|지원)/.test(bare))) && !third && !topic;
        if (whatCan && saidAge != null) {
          const fit = all().filter((r) => ageFits(P.get(r.id), saidAge));
          const open = [...fit.filter((r) => r.recruit.state === 'open').sort((a, b) => a.recruit.dday - b.recruit.dday), ...fit.filter((r) => r.recruit.state === 'always')];
          return done('나이로 훑어보기', { kind: 'judge', intent: 'age_list', policies: open.map((r) => r.id), cards: open.slice(0, 6).map((r) => r.id),
            text: `만 ${saidAge}세가 나이 조건에 드는 사업은 ${policies.length}건 중 ${fit.length}건이에요. 그중 지금 신청할 수 있는 건 ${open.length}건이에요${open.length ? `: ${open.slice(0, 5).map(nm).join(', ')}${open.length > 5 ? ' 등' : ''}` : ''}. 말한 나이만 본 결과예요. 거주 조건까지 보려면 '내 조건'에 생년월일과 전입일을 넣어 주세요.` });
        }
        if ((NOW_OPEN.test(q) || whatCan) && !third && !topic) return openList('판정 엔진(지금 신청 가능)');
      }

      // (3-1) 다루지 않는 범위: 범위 밖 낱말·이름이 질문에 있거나(낱말), 범위 밖 예시가 사업보다 뚜렷이 가까울 때(의미)
      //       사업 이름을 말한 질문은 제외. 분류 이름('장학금')이 나온 질문은 자료에 없는 제도 이름('국가장학금')을 콕 집었을 때만
      const nearPolicies = () => found.all.filter((r) => r.type === 'policy').slice(0, 3).map((r) => r.key);
      if (!mentioned.length) {
        const sl = found.scope.lex, sd = found.scope.den && found.scope.den.margin >= opt.oosMargin ? found.scope.den : null;
        const hit = sl && (sl.name || !tag) ? sl : (!tag && sd ? sd : null);
        if (hit) {
          const head = byId.get(hit.key), nm = hit.name || null;
          const cards = head.near ? (tagIds.length ? tagIds.slice(0, 6) : nearPolicies()) : [];
          const text = (nm ? `'${nm}'${hasFinal(nm) ? '은' : '는'} ` : (head.names?.length ? '물어보신 제도는 ' : '')) + head.say + ' ' + SCOPE_LINE
            + (cards.length ? (tagIds.length ? ` 안산시청에 올라온 '${tag}' 사업은 아래와 같아요.` : ' 안산시 사업 중 가까운 것은 아래와 같아요.') : '');
          return done(`범위 밖(${hit === sl ? '낱말: ' + (nm || sl.words.join('·')) : '의미 검색'}) → ${head.title}`, { abstain: true, reason: 'out_of_scope', intent: 'oos', text, policies: cards, cards });
        }
        // 자료에 없는 제도 이름처럼 생긴 낱말('청년희망적금', '행복주택') → 비슷한 사업을 그 제도인 것처럼 답하지 않는다
        const unk = unknownNames(q);
        if (unk.length) {
          const cards = tagIds.length ? tagIds.slice(0, 6) : nearPolicies();
          return done(`자료에 없는 이름: ${unk[0]}`, { abstain: true, reason: 'unknown_name', intent: 'oos', policies: cards, cards,
            text: `'${unk[0]}'${hasFinal(unk[0]) ? '은' : '는'} 수집한 안산시 청년 사업 ${policies.length}건에 없는 이름이에요. 전국 단위 제도는 온통청년(youthcenter.go.kr)에서 찾아볼 수 있어요.`
              + (cards.length ? (tagIds.length ? ` 안산시청에 올라온 '${tag}' 사업은 아래와 같아요.` : ' 안산시 사업 중 가까운 것은 아래와 같아요.') : '') });
        }
      }

      // (3-2) 두 사업을 함께 말한 질문 → 나란히 보여 준다
      if (mentioned.length >= 2) {
        const ids = mentioned.slice(0, 3);
        const nameOf = (id) => shortName(P.get(id).name);
        const mark = (i) => '①②③'[i];
        const askMe = ctx.profile && !third && !saidAge && (WHY_NOT.test(bare) || WHEN_OK.test(bare) || (CAN_GET.test(bare) && (firstPerson || !section)));
        if (askMe) {
          const rs = ids.map((id) => judge(id, ctx));
          let text = ids.map((id, i) => `${mark(i)} ${nameOf(id)}: ${verdictLine(rs[i])}${['eligible', 'eligible_if_move_in'].includes(rs[i].status) ? ' ' + recruitLine(rs[i]) : ''}`).join(' ');
          if (/둘\s*다|같이|동시에|함께|중복/.test(bare)) text += ' 두 사업을 함께 받을 수 있는지(중복 여부)는 수집한 자료에 없어요. 공고 원문이나 담당부서에 확인해 주세요.';
          return done('비교(판정 엔진)', { kind: 'compare', intent: 'compare_judge', section: 'target', policies: ids, cards: ids, text,
            sources: ids.map((id) => src(getChunk(id, 'target'))), suggestions: [`${nameOf(ids[0])} 얼마 받아요?`, `${nameOf(ids[1])} 얼마 받아요?`],
            llm: { use: true, ...prompt(q, ids.flatMap((id, i) => [judgeFact(id, rs[i])])) } });
        }
        const sec = section && ids.every((id) => getChunk(id, section)) ? section : null;
        const parts = ids.map((id) => (sec ? getChunk(id, sec).say.trim() : gist(id)));
        let text = ids.map((id, i) => `${mark(i)} ${nameOf(id)}: ${parts[i]}`).join(' ');
        if (sec === 'benefit') text += ' 금액을 세는 기준(월·분기·총액)이 사업마다 달라서 나란히 보여 드려요.';
        const cs = ids.map((id) => getChunk(id, sec || 'overview'));
        return done('비교', { kind: 'compare', intent: 'compare', section: sec, policies: ids, cards: ids, text, sources: cs.map(src),
          suggestions: [`${nameOf(ids[0])} 나는 받을 수 있어?`, `${nameOf(ids[1])} 나는 받을 수 있어?`],
          llm: { use: true, ...prompt(q, sec ? cs.map((c) => c.text) : ids.flatMap((id) => [getChunk(id, 'benefit'), getChunk(id, 'target')].filter(Boolean).map((c) => c.text))) } });
      }

      // (4) 목록·조건 질문: 분류 이름이 나왔고(장학금·공모전…) 또는 분류 + 목록을 달라는 말(대회 뭐 있어·나한테 맞는 일자리…)
      if (topicCue && !(page && /이거|이건|여기|이 사업/.test(q))) return listAnswer(topic.always ? `분류 묶음: ${topic.label}` : '목록 질문');

      // (5) 어느 사업 이야기인지 정하기: 이름이 나온 사업 > 화면에서 보고 있는 사업 > 검색 1위
      let target = null, how = null;
      const top = found.ranked[0];
      const topIsHelp = top && top.type === 'help';
      const define = DEFINE.test(bare);
      // 뜻·계산법을 묻는 질문이면 도움말을 먼저 본다 (점수가 1위의 60% 이상일 때)
      const near = (x) => (found.dense ? x.score >= top.score - 0.05 : x.score >= 0.6 * top.score);
      const helpHit = top && found.ranked.slice(0, 3).find((x) => x.type === 'help' && near(x));
      // 상세 화면에서 물으면 그 사업에 대한 질문으로 본다 (다른 사업 이름을 말했거나 용어 뜻을 묻는 경우는 예외).
      // 단, 그 사업과 이어지는 단서가 하나는 있어야 한다: 묻는 항목·내 조건 표현·'이거'·수집 안 한 주제·겹치는 낱말·검색 1위
      const cue = section || CAN_GET.test(bare) || WHY_NOT.test(bare) || WHEN_OK.test(bare) || saidAge != null || (OTHER_COND.test(bare) && ASK_OK.test(bare)) || UNCOLLECTED.some(([, re]) => re.test(bare));
      // 두 경우 모두, 질문의 낱말이 다른 사업을 가리키면(낱말 근거) 그 사업을 찾는 질문으로 본다
      const lexOther = (cur) => hasEvidence(found.lexEvidence) && found.lexTop && found.lexTop.type === 'policy' && found.lexTop.key !== cur;
      const aboutPage = page && !lexOther(page) && (cue || /이거|이건|이 사업|여기|이게/.test(q) || evidence(q, { key: page }).matched.length > 0 || top?.key === page);
      // 사업 이름 없이 이어 묻는 질문("어디서 신청해요?", "나는 받을 수 있어?")은 바로 앞에서 다룬 사업으로 본다
      const followUp = prev && !lexOther(prev) && (cue || /이거|이건|이 사업|그거|그건|그 사업/.test(q));
      if (mentioned.length) { target = mentioned[0]; how = 'mention'; }
      else if (aboutPage && !(define && helpHit)) { target = page; how = 'page'; }
      else if (followUp && !(define && helpHit)) { target = prev; how = 'prev'; }

      // 검색 1위를 얼마나 믿을지: single(바로 답) / cand(가까운 사업 몇 개를 후보로 보여 줌) / none(못 찾음)
      //  - 낱말 근거가 충분하면(confident) single. 드문 낱말 하나만 겹치면 cand
      //  - 의미 검색: 1위 유사도가 너무 낮으면 none. 1위가 뚜렷하면(z ≥ denseZ) single, 덜 뚜렷하면 cand
      //  - 낱말 검색만: 드문 낱말이 하나라도 겹치면 cand
      let trust = 'none';
      if (confident(ev)) trust = 'single';
      else if (found.dense) {
        const cos = found.natural ? found.natural.score : 0;
        if (cos >= opt.denseFloor) trust = found.z >= opt.denseZ ? 'single' : (found.z >= opt.candZ ? 'cand' : 'none');
      } else if (ev.specific >= 1) trust = 'cand';
      base.debug.trust = trust;

      // (6) 도움말 (용어·사용법)
      if (!target && !mentioned.length) {
        // 도움말은 낱말 하나가 우연히 겹쳐서 뜨는 일이 없게 '겹친 낱말 2개 이상'일 때만 (뜻을 묻는 질문이면 1개)
        const pick = define && helpHit ? helpHit : (topIsHelp ? top : null);
        const hev = pick ? evidence(q, pick) : null;
        if (pick && ((hev.specific >= 1 && (hev.matched.length >= 2 || define)) || (found.dense && pick === top && trust === 'single'))) {
          const h = byId.get(pick.key);
          return done('도움말', { kind: 'help', intent: 'help', text: h.say, sources: [src(h)], llm: { use: true, ...prompt(q, [h.text]), check: checkPrompt(q, [h.text]), noAnswer: '수집한 도움말 자료로는 이 질문에 답할 수 없어요. 사업 이름을 넣어 다시 물어봐 주세요.' } });
        }
      }

      if (!target && top && top.type === 'policy' && trust === 'single') { target = top.key; how = 'search'; }

      // (7) 하나로 좁히지 못함 → 가까운 사업 후보를 보여 주거나(cand), 못 찾았다고 답한다(none)
      if (!target && topic && trust === 'none') return listAnswer('사업을 못 찾아 분류 목록');
      if (!target && ctx.profile && !third && !tag && GENERIC_LIST.test(bare) && !(trust === 'cand' && ev.anchor >= 1)) return openList('넓게 물은 질문 → 판정 엔진(지금 신청 가능)');
      if (!target) {
        const nearIds = found.ranked.filter((r) => r.type === 'policy').slice(0, 3).map((r) => r.key);
        if (trust === 'cand' && nearIds.length) {
          const list = nearIds.map((id, i) => `${'①②③'[i]} ${shortName(P.get(id).name)} — ${P.get(id).benefit}`).join(' ');
          return done('후보 제시', { kind: 'candidates', intent: 'find', policies: nearIds, cards: nearIds,
            text: `질문에 딱 맞는 사업 하나로 좁히지는 못했어요. ${found.dense ? '뜻이 가까운' : '낱말이 겹치는'} 사업은 이래요: ${list}. 찾던 사업이 있으면 이름을 눌러 보고, 없으면 사업 이름이나 "월세", "장학금" 같은 낱말로 다시 물어봐 주세요.`,
            sources: nearIds.slice(0, 2).map((id) => src(getChunk(id, 'overview'))), suggestions: nearIds.map((id) => `${shortName(P.get(id).name)} ${section ? SECTION_LABEL[section] : '알려줘'}`) });
        }
        if (trust === 'none') {
          const topicAny = UNCOLLECTED.find(([, re]) => re.test(bare));
          if (topicAny) {
            return done(`사업 모름 → 수집 안 한 주제(${topicAny[0]})`, { abstain: true, reason: 'uncollected', intent: 'unans',
              text: `'${topicAny[0]}'${hasFinal(topicAny[0]) ? '은' : '는'} 수집한 공고 자료에 없는 항목이에요. 해당 사업의 안산시청 공고 원문에서 확인해 주세요. 사업 이름을 알려 주시면 담당부서 연락처를 찾아 드릴게요.` });
          }
          const fewWords = wordTokens(bare).filter((w) => w.length >= 2).length <= 2;        // 낱말이 거의 없는 짧은 질문일 때만 되묻는다
          if (fewWords && (section || (!third && !/(거|것|게|사업|혜택)\s*(있|없)/.test(bare) && (CAN_GET.test(bare) || WHY_NOT.test(bare) || WHEN_OK.test(bare))))) {
            const what = section ? `어느 사업의 ${josa(SECTION_LABEL[section], '을', '를')} 찾는지` : '어느 사업을 말하는지';
            return done('어느 사업인지 되묻기', { abstain: true, reason: 'need_policy', intent: 'clarify',
              text: `${what} 사업 이름을 같이 알려 주세요. 예: "청년월세 지원사업 ${section ? SECTION_LABEL[section] : '나는 받을 수 있어?'}"` });
          }
        }
        return done('못 찾음', { abstain: true, reason: 'no_match', intent: 'oos', policies: nearIds, cards: nearIds,
          text: `수집한 안산시 청년 사업 ${policies.length}건에서 질문에 딱 맞는 내용은 찾지 못했어요.` + (nearIds.length ? ' 가장 가까운 사업은 아래와 같아요. 찾는 사업이 없으면 사업 이름이나 "월세", "장학금" 같은 낱말로 다시 물어봐 주세요.' : ' 사업 이름이나 "월세", "장학금" 같은 낱말로 다시 물어봐 주세요.') });
      }

      const p = P.get(target), r = judge(target, ctx);
      const mine = chunksOf.get(target);
      const others = found.ranked.filter((x) => x.type === 'policy' && x.key !== target).slice(0, 2).map((x) => x.key);
      const via = { mention: '사업 이름', page: '보고 있는 공고', prev: '앞 질문의 사업', search: found.dense ? '의미 검색 1위' : '낱말 검색 1위' }[how];
      // 판정 엔진이 보지 않는 조건(학적·취업·소득·가구·주택)을 붙여 물은 경우는 내 조건 판정으로 답하지 않는다
      const otherCond = how !== 'search' && saidAge == null && OTHER_COND.test(bare) && ASK_OK.test(bare) && !WHY_NOT.test(bare);
      const personal = !third && !otherCond && saidAge == null && (WHY_NOT.test(bare) || WHEN_OK.test(bare) || (CAN_GET.test(bare) && (firstPerson || how === 'page' || how === 'prev' || !section || MOVE_IN.test(bare))) || (firstPerson && ASK_OK.test(bare)));

      // (8) 수집하지 않은 주제 → 자료에 없다고 답한다
      const gap = UNCOLLECTED.find(([, re]) => re.test(bare) && !mine.some((c) => re.test(c.text.split('\n').slice(1).join(' '))));
      if (gap && !ctx.noGuard) {
        const contact = getChunk(target, 'contact');
        // 원문에서 그 주제를 다룬 부분(소제목·항목 이름으로 찾는다: '구비서류', '선발 방법', '4대보험' …)이 있으면 그 부분을 그대로 보여 준다
        const docRe = FULL_DOC[gap[0]];
        const hits = docRe ? fullRanked(target, q).filter((x) => docRe.test(bodyOf(x.chunk))) : [];
        if (hits.length) {
          const fc = hits.slice(0, 2).map((x) => x.chunk), body = bodyOf(fc[0]), at = body.search(docRe);
          const from = Math.max(0, at - 40), piece = (from ? '…' : '') + body.slice(from, from + 260).trim() + (body.length > from + 260 ? '…' : '');
          const facts = fc.map((c) => c.text);
          return done(`${via} → 공고 원문(${gap[0]})`, { kind: 'policy', intent: 'fulltext', section: 'full', focus: target, policies: [target],
            text: `${shortName(p.name)}: 정리한 항목에는 '${gap[0]}'${hasFinal(gap[0]) ? '이' : '가'} 없어서 공고 원문에서 관련 부분을 찾았어요. 질문의 답인지 직접 확인해 주세요. "${piece}"`,
            sources: [...fc, contact].filter(Boolean).map(src), suggestions: suggestFor(target),
            llm: { use: true, ...prompt(q, facts), check: checkPrompt(q, facts),
              noAnswer: `${shortName(p.name)}의 '${gap[0]}'${hasFinal(gap[0]) ? '은' : '는'} 수집한 공고 자료로는 확인할 수 없어요. 안산시청 공고 원문이나 담당부서에 확인해 주세요.` + (contact ? ` ${contact.say}` : '') } });
        }
        return done(`${via} → 수집 안 한 주제(${gap[0]})`, { kind: 'abstain', abstain: true, reason: 'uncollected', intent: 'unans', focus: target, policies: [target],
          text: `${shortName(p.name)}의 '${gap[0]}'${hasFinal(gap[0]) ? '은' : '는'} 수집한 공고 자료에 없어요. 안산시청 공고 원문에서 확인해 주세요.` + (contact ? ` ${contact.say}` : ''),
          sources: [contact, getChunk(target, 'method')].filter(Boolean).map(src), suggestions: suggestFor(target) });
      }

      // (9-1) 나이를 말하고 물은 질문: 내 생년월일이 아니라 말한 나이를 공고의 나이 조건에 대 본다 (거주 조건은 따로 안내)
      if (saidAge != null) {
        const t = getChunk(target, 'target'), at = ageText(p);
        const line = at == null ? `나이 제한이 없어서 만 ${saidAge}세도 나이 조건은 문제없어요.`
          : ageFits(p, saidAge) ? `만 ${saidAge}세는 나이 조건(${at})에 들어가요.` : `만 ${saidAge}세는 나이 조건(${at})에서 벗어나요.`;
        return done(`${via} → 말한 나이로 확인`, { kind: 'policy', intent: 'age', section: 'target', focus: target, policies: [target],
          text: `${shortName(p.name)}: ${line} 말한 나이를 만 나이로 봤고, 나이를 세는 기준일은 공고마다 달라서 경계에 있으면 원문을 확인해 주세요. ${t.say.replace(/^나이 조건은[^.]*\.\s*/, '')}`.trim(),
          sources: [src(t)], suggestions: suggestFor(target) });
      }

      // (9-2) 판정하지 않는 조건을 붙여 물은 질문: 공고의 '그 밖의 조건'을 먼저 보여 준다
      if (otherCond) {
        const t = getChunk(target, 'target'), oc = p.otherConditions || [];
        let text = `${shortName(p.name)}: 물어보신 조건은 제가 판정하지 않는 항목이에요(거주·나이만 판정해요). `;
        text += oc.length ? `공고에 적힌 그 밖의 조건은 ${oc.map((s) => `'${s}'`).join(', ')}${hasFinal(oc.at(-1)) ? '이에요' : '예요'}. 여기에 해당하는지 직접 확인해 주세요.`
          : '수집한 공고에는 거주·나이 말고 다른 조건이 적혀 있지 않아요. 정확한 내용은 원문에서 확인해 주세요.';
        if (r) text += ` 참고로 판정하는 항목은, ${verdictLine(r)}`;
        return done(`${via} → 판정하지 않는 조건`, { kind: 'policy', intent: 'cond', section: 'target', focus: target, policies: [target], text,
          sources: [src(t)], suggestions: suggestFor(target),
          llm: { use: true, ...prompt(q, r ? [t.text, judgeFact(target, r)] : [t.text]) } });
      }

      // (9-3) 내 조건 질문: 판정 결과를 근거로 설명
      if (personal && r) {
        const t = getChunk(target, 'target');
        let text = `${shortName(p.name)}: ${verdictLine(r)}`;
        if (r.status === 'eligible' || r.status === 'eligible_if_move_in') text += ` ${recruitLine(r)}`;
        if (r.selfCheck?.length) text += ` 그 밖에 ${r.selfCheck.map((s) => `'${s}'`).join(', ')} 조건은 직접 확인해야 해요.`;
        return done(`${via} → 판정 엔진`, { kind: 'judge', intent: WHY_NOT.test(bare) ? 'why_not' : WHEN_OK.test(bare) ? 'when_ok' : 'can_i', section: 'target', focus: target, policies: [target], text,
          sources: [src(t)], suggestions: suggestFor(target),
          llm: { use: true, ...prompt(q, [judgeFact(target, r), t.text]) } });
      }

      // (10) 사업 하나에 대한 사실 질문
      // 묻는 항목이 분명하면 그 섹션, 아니면 그 사업 안에서 점수가 가장 높은 청크(없으면 개요)
      const ranked = found.all.find((x) => x.key === target)?.chunks || [];
      let main = section ? getChunk(target, section) : null;
      if (!main) main = ranked[0]?.chunk || getChunk(target, 'overview');
      // 이름만 말했거나("○○ 알려줘") 검색으로 찾은 사업은 개요부터 보여 준다
      const residual = wordTokens(bare).filter((w) => w.length >= 2 && !/^(청년|안산|안산시|사업|지원|제도|프로그램|정책|소개|설명|정보)$/.test(w));
      if (!section && (how === 'search' || !residual.length)) main = getChunk(target, 'overview');
      // 모델에 줄 자료: 묻는 항목이 분명하면 그 섹션(+참고)만, 아니면 점수가 높은 청크 하나를 더 준다 (자료가 짧을수록 소형 모델이 덜 틀린다)
      const ctxChunks = [main];
      const second = section ? null : ranked.find((x) => x.chunk.id !== main.id && x.chunk.section !== 'overview')?.chunk;
      if (second) ctxChunks.push(second);
      const notes = getChunk(target, 'notes');
      if (notes && !ctxChunks.includes(notes) && ['benefit', 'target', 'period'].includes(main.section)) ctxChunks.push(notes);

      if (main.thin && !ctx.noGuard) {
        return done(`${via} → 자료가 빈 항목`, { kind: 'abstain', abstain: true, reason: 'thin', intent: 'unans', section: main.section, focus: target, policies: [target],
          text: `${shortName(p.name)}: ${main.say}`, sources: [main, getChunk(target, 'contact')].filter(Boolean).map(src), suggestions: suggestFor(target) });
      }

      const lead = bestLine(q, main);
      let text = `${shortName(p.name)}: ` + (lead && !main.say.includes(lead.replace(/^[^:]+:\s*/, '')) ? `${lead}. ` : '') + main.say;
      if (r && (main.section === 'period' || main.section === 'method')) text += ` ${recruitLine(r)}`;
      if (how === 'search' && others.length) text += ` 비슷한 사업: ${others.map((id) => shortName(P.get(id).name)).join(', ')}.`;
      // 모델에 줄 자료: 묻는 항목을 알면 그 항목(+참고), 모르면 그 사업의 항목 전부 ("어떻게 받아?"처럼 규칙이 못 읽은 말투도 모델이 고를 수 있게)
      const ORDER = ['overview', 'target', 'benefit', 'period', 'method', 'contact', 'notes'];
      const wide = !section ? ORDER.map((sc) => getChunk(target, sc)).filter((c) => c && !c.thin).concat(fullRanked(target, q).filter((x) => x.score > 0).slice(0, 2).map((x) => x.chunk)) : null;
      const facts = (wide || ctxChunks).map((c) => c.text);
      if (r) facts.push(`${p.name} | 오늘(${ctx.today}) 기준 모집 상태\n- ${recruitLine(r)}`);
      const contactC = getChunk(target, 'contact');
      return done(`${via} → ${SECTION_LABEL[main.section]}`, { kind: 'policy', intent: how === 'search' && !section ? 'find' : 'fact', section: main.section, focus: target, policies: [target, ...(how === 'search' ? others : [])],
        cards: how === 'search' ? [target, ...others] : [], text, sources: ctxChunks.map(src), suggestions: suggestFor(target),
        llm: { use: true, ...prompt(q, facts), wide: !!wide, check: checkPrompt(q, facts),
          noAnswer: `${shortName(p.name)}: 수집한 공고 자료로는 이 질문에 답할 수 없어요. 안산시청 공고 원문이나 담당부서에 확인해 주세요.` + (contactC ? ` ${contactC.say}` : '') } });
    }

    return { answer, search, mentions, sectionOf, evidence, index, chunks, byId, prompt, checkPrompt, SYSTEM, CHECK_SYSTEM, aliases: uniqueAliases, listTopic, listByConditions, topics: LIST_TOPICS };
  }

  // 모델에게 먼저 묻는 판정: 이 자료로 답할 수 있나
  const CHECK_SYSTEM = [
    "당신은 '안산 청년 혜택 알리미'의 자료 확인 담당입니다.",
    '[자료]만 보고 [질문]에 답할 수 있으면 "예", 답할 수 없으면 "아니오"라고 한 낱말로만 답하세요.',
    '비슷한 내용이 있어도 질문이 묻는 것(예: 지급일, 제출 서류, 사용처, 이자율)이 자료에 적혀 있지 않으면 "아니오"입니다.',
  ].join('\n');
  // 모델의 판정 답 → 'yes' | 'no' | null (알 수 없음)
  function parseCheck(text) {
    const t = String(text || '').replace(/<think>[\s\S]*?(<\/think>|$)/g, '').replace(/[\s"'`*.,:!()\[\]]+/g, ' ').trim().toLowerCase();
    if (!t) return null;
    if (/^(아니|아뇨|no(?![a-z])|없|불가|답할\s*수\s*없)/.test(t)) return 'no';
    if (/^(예|네|yes(?![a-z])|가능|있|답할\s*수\s*있)/.test(t)) return 'yes';
    if (/아니오|아니요|답할\s*수\s*없/.test(t)) return 'no';
    if (/(^|\s)(예|네)(\s|$)/.test(t)) return 'yes';
    return null;
  }

  // ============================================================
  // 5. 모델 답 검사: 답에 나온 숫자가 자료(와 질문)에 있는지
  // ============================================================
  // 숫자를 (값, 단위)로 읽는다. '20만원'과 날짜 속의 '20'을 구분하려고 단위까지 본다
  const UNIT_ALIAS = { '만': '만원', '억원': '억', '살': '세', '퍼센트': '%', '번': '회', '달': '개월' };
  const DATE_UNITS = new Set(['년', '월', '일']);
  function numTokens(text) {
    const src = String(text).replace(/\[\d+\]/g, ' ');
    const re = /(\d+(?:[.,]\d+)*)(\s*)(만\s*원|만|억\s*원|억|천\s*원|원|%|퍼센트|세|살|년|개월|달|월|일|회|번|명|건|가구|시간|분기|호|팀|점|배)?/g;
    const out = [];
    let m;
    while ((m = re.exec(src))) {
      let unit = (m[3] || '').replace(/\s+/g, '');
      unit = UNIT_ALIAS[unit] || unit;
      const raw = m[1], dots = (raw.match(/\./g) || []).length;
      if (dots >= 2 || (dots === 1 && /^(19|20)\d\d\./.test(raw))) {                       // 2026.03.30 같은 날짜
        const parts = raw.split('.').filter(Boolean);
        parts.forEach((p, k) => out.push({ v: String(parseInt(p, 10)), u: k === parts.length - 1 ? unit : '', at: m.index, end: re.lastIndex }));
      } else {
        const v = raw.includes('.') && !/,\d{3}/.test(raw) ? String(parseFloat(raw.replace(/,/g, ''))) : String(parseInt(raw.replace(/[.,]/g, ''), 10));
        out.push({ v, u: unit, at: m.index, end: re.lastIndex });
      }
    }
    // '18~34세', '1~2만원' 처럼 범위로 쓴 숫자는 뒤 숫자의 단위를 같이 쓴다
    for (let k = out.length - 2; k >= 0; k--) if (!out[k].u && /^\s*[~∼–-]\s*$/.test(src.slice(out[k].end, out[k + 1].at))) out[k].u = out[k + 1].u;
    return out;
  }
  function checkNumbers(answerText, contextText) {
    const ctx = numTokens(contextText), used = numTokens(answerText);
    const pairs = new Set(ctx.map((t) => t.v + '|' + t.u)), values = new Set(ctx.map((t) => t.v)), bare = new Set(ctx.filter((t) => !t.u).map((t) => t.v));
    const grounded = (t) => (t.u ? pairs.has(t.v + '|' + t.u) || (DATE_UNITS.has(t.u) && bare.has(t.v)) : values.has(t.v));
    const missing = [...new Set(used.filter((t) => !grounded(t)).map((t) => t.v + t.u))];
    return { total: used.length, missing, ok: missing.length === 0 };
  }
  // 답이 한국어인지: 한자·가나·키릴 문자가 없고, 한글이 영문자보다 많아야 한다 (LH·주소 같은 영문은 허용)
  function koreanOnly(text) {
    const t = String(text);
    if (/[぀-ヿ㐀-䶿一-鿿Ѐ-ӿ฀-๿]/.test(t)) return false;
    const plain = t.replace(/https?:\/\/[^\s)]+|[a-z0-9.-]+\.(?:go\.kr|or\.kr|net|com|kr|org)\b/gi, ' ');        // 주소는 세지 않는다
    const hangul = (plain.match(/[가-힣]/g) || []).length, latin = (plain.match(/[a-zA-Z]/g) || []).length;
    return hangul > 0 && hangul >= latin;
  }
  // "자료에 없다"는 뜻으로 답했는지
  const ABSTAIN_RE = /자료에(는|서|서는)?\s*.{0,12}(없어|없습|없는|없음|않아|않습)|(찾을|확인할|알|답할|답변할|말씀드릴|제공할|안내할)\s*수\s*(가\s*)?없|찾지\s*못|(나와|포함되어|적혀|언급되어|명시되어|기재되어)\s*있지\s*않|원문(에서|을)\s*확인|정보(가|는)\s*(없|부족)|다루지\s*않|모르겠/;

  // ============================================================
  // 6. 의미 검색용 문서 벡터 (build_embeddings.mjs 가 만든 embeddings_v3.json)
  //    질문 벡터는 브라우저에서 transformers.js 로 만들고, 여기서는 코사인 유사도만 계산한다
  // ============================================================
  function denseIndex(emb, chunkIds) {
    if (!emb || !emb.data) return null;
    if (chunkIds) chunkIds = chunkIds.filter((id) => !/#full\d+$/.test(id));      // 공고 원문 청크는 벡터를 만들지 않는다 (사업 찾기에 안 씀)

업 청년\n모집기간 : 연 2회(1월, 7월 공고 및 모집)\n근무기간\n상반기 : 3월 ~ 6월(4개월)\n하반기 : 9월 ~ 12월(4개월)\n신청방법 : 온라인 접수(잡아바 어플라이)\n근 무 지 : 안산시 소속부서ㆍ산하기관\n주요내용\n사업내용 : 시 소속 부서 행정사무 보조\n근무조건 : 전일제(주 40시간 / 일 8시간, 주5일 근무)"},{"id":"ANS012#full2","policyId":"ANS012","section":"full","text":"청년인턴 사업 | 공고 원문 2/2\n보    수 : 2026년 안산시 생활임금 적용(시급 11,710원), 주ㆍ연차 수당 지급\n신    분 : 공무원의 사무를 보조하는 공무원이 아닌 근로자\n후생복지 : 4대보험(건강보험, 국민연금, 고용보험, 산재보험) 가입\n※ 기타 : 취업지원 유급휴가, 취업특강 지원 등\n성과 및 기대효과\n청년들이 기초적인 사무능력을 함양할 수 있는 실무경험의 기회 제공으로 취업 준비 부담 감소 및 향후 취업 분야로의 연계도모\n담당부서\n청년정책관 청년일자리팀(031-481-3983)"},{"id":"ANS013#overview","policyId":"ANS013","section":"overview","text":"청년 행정체험 연수 | 개요\n- 분야: 교육일자리\n- 한 줄 요약: 방학 중 행정체험 2개월 (최저임금 시급 10,320원 + 교통비)\n- 대상: 만 19~39세, 공고일 기준 안산시 주민등록 필요\n- 조건: 청년 또는 대학생","say":"청년 행정체험 연수는 교육일자리 분야 사업이에요. 방학 중 행정체험 2개월 (최저임금 시급 10,320원 + 교통비). 대상은 만 19~39세, 거주 조건은 '안산 주민등록'이에요."},{"id":"ANS013#target","policyId":"ANS013","section":"target","text":"청년 행정체험 연수 | 지원 대상\n- 나이: 만 19~39세\n- 거주: 공고일 기준 안산시 주민등록 필요\n- 그 밖의 조건(본인 확인): 청년 또는 대학생\n- 공고 원문: \"공고일(2026.5.20.)기준 안산시에 주민등록이 되어있는 19~39세 청년 또는 대학생\"","say":"나이 조건은 만 19~39세예요. 공고일 기준으로 안산시에 주민등록이 되어 있어야 해요. 그 밖에 '청년 또는 대학생' 조건은 직접 확인해 주세요.","quote":"공고일(2026.5.20.)기준 안산시에 주민등록이 되어있는 19~39세 청년 또는 대학생"},{"id":"ANS013#benefit","policyId":"ANS013","section":"benefit","text":"청년 행정체험 연수 | 지원 내용\n- 내용: 방학 중 행정체험 2개월 (최저임금 시급 10,320원 + 교통비)\n- 상세: 방학 중 행정체험 2개월(주 25시간)\n- 금액: 최저임금 시급 10,320원 + 교통비","say":"지원 내용은 '방학 중 행정체험 2개월 (최저임금 시급 10,320원 + 교통비)'예요. 상세: 방학 중 행정체험 2개월(주 25시간)."},{"id":"ANS013#period","policyId":"ANS013","section":"period","text":"청년 행정체험 연수 | 신청 기간\n- 접수 기간: 2026.11.18 ~ 2026.11.26\n- 안내: 연 2회(5월·11월 모집)\n- 관련 공고: 안산시 공고 제2026-1126호(2026-05-20, 하계 모집)","say":"수집한 공고의 접수 기간은 2026.11.18 ~ 2026.11.26이에요. 안내: 연 2회(5월·11월 모집)."},{"id":"ANS013#method","policyId":"ANS013","section":"method","text":"청년 행정체험 연수 | 신청 방법\n- 신청 방법: 온라인 접수(잡아바 어플라이)\n- 신청 사이트: 잡아바 어플라이 (https://apply.jobaba.net), 로그인 필요\n- 찾는 법: 로그인한 뒤 검색창에 '청년 행정체험 연수' 검색 (사이트 첫 화면으로 열림)","say":"신청 방법은 '온라인 접수(잡아바 어플라이)'예요. 신청 사이트는 잡아바 어플라이예요. 첫 화면이 열리니 로그인한 뒤 검색창에 '청년 행정체험 연수'를 검색해 주세요."},{"id":"ANS013#contact","policyId":"ANS013","section":"contact","text":"청년 행정체험 연수 | 문의처\n- 담당: 청년정책관 청년일자리팀 031-481-3983","say":"담당은 청년정책관 청년일자리팀 031-481-3983이에요."},{"id":"ANS013#full1","policyId":"ANS013","section":"full","text":"청년 행정체험 연수 | 공고 원문 1/2\n추진배경,사업개요,주요내용,성과 및 기대효과,담당부서 순으로 정보를 제공합니다\n추진배경\n방학기간 중 관내 청년 및 대학생들에게 행정체험연수 기회를 제공하여 공직사회에 대한 이해를 높이고 바른 직업의식 함양에 기여\n사업개요\n선발대상 : 관내 거주 19~39세 청년 또는 대학생\n모집기간 : 연 2회(5월, 11월 공고 및 모집)\n근무기간\n동계 : 1월 ~ 2월(2개월)\n하계 : 7월 ~ 8월(2개월)\n신청방법 : 온라인 접수(잡아바 어플라이)\n근 무 지 : 시 본청, 직속기관, 사업소, 구청, 동 행정복지센터, 도서관 등\n사업내용 : 방학기간 동안 안산시 소속ㆍ산하기관에서 사무보조 등 다양한 행정체험 경험\n주요내용\n근무조건\n근무조건 : 주 25시간　/ 일 ５시간,　주 5일 근무"},{"id":"ANS013#full2","policyId":"ANS013","section":"full","text":"청년 행정체험 연수 | 공고 원문 2/2\n근 무 지 : 시 본청, 직속기관, 사업소, 구청, 동 행정복지센터, 도서관 등\n보 수 : 2026년 최저임금 적용(시급 10,320원), 교통비 5,000원, 주휴수당 지급\n후생복지 : 4대보험(건강보험, 국민연금, 고용보험, 산재보험) 가입\n성과 및 기대효과\n행정체험을 통해 공직사회에 대한 이해를 높이는 계기 마련\n다양한 직무경험을 통한 자기계발의 기회 제공\n향후 진로설정의 기반을 마련하고 바른 직업의식 함양 도모\n학비조달 등 경제적 도움 제공\n담당부서\n청년정책관 청년일자리팀(031-481-3983)"},{"id":"ANS014#overview","policyId":"ANS014","section":"overview","text":"경기청년 역량강화 기회 지원(구직자 응시료 지원) | 개요\n- 분야: 교육일자리\n- 한 줄 요약: 어학·자격시험 응시료 실비 지원 (1인 연 최대 30만원)\n- 대상: 만 19~39세, 신청일 기준 안산시 주민등록 필요\n- 조건: 응시일 기준 미취업(1년 미만 단기 근로자 포함)","say":"경기청년 역량강화 기회 지원(구직자 응시료 지원)은 교육일자리 분야 사업이에요. 어학·자격시험 응시료 실비 지원 (1인 연 최대 30만원). 대상은 만 19~39세, 거주 조건은 '안산 주민등록'이에요."},{"id":"ANS014#target","policyId":"ANS014","section":"target","text":"경기청년 역량강화 기회 지원(구직자 응시료 지원) | 지원 대상\n- 나이: 만 19~39세\n- 거주: 신청일 기준 안산시 주민등록 필요\n- 그 밖의 조건(본인 확인): 응시일 기준 미취업(1년 미만 단기 근로자 포함)\n- 공고 원문: \"거주요건 : 신청일 기준 주민등록상 안산시 거주\"","say":"나이 조건은 만 19~39세예요. 신청일 기준으로 안산시에 주민등록이 되어 있어야 해요. 그 밖에 '응시일 기준 미취업(1년 미만 단기 근로자 포함)' 조건은 직접 확인해 주세요.","quote":"거주요건 : 신청일 기준 주민등록상 안산시 거주"},{"id":"ANS014#benefit","policyId":"ANS014","section":"benefit","text":"경기청년 역량강화 기회 지원(구직자 응시료 류\n검증 및 지급\n응시료 지원\n’25. 12. 1. ~ ’26. 11. 30.\n’26. 5. 11. ~ ’26. 12. 4.\n’26. 5. ~ 12.\n주요내용\n지원내용 : 어학‧자격 취득을 위한 응시료 지원\n1인당 연 최대 30만원 범위 내 실비 지원\n지난 연도 지원여부, 지원횟수, 회당 지원금액 제한없음\n※ 단, 동일시험에 한하여 지원횟수 연 최대 3회로 제한\n지원분야(1,005종) : 어학 19종, 한국사, 국가기술자격 541종, 국가전문자격 345종, 국가공인민간자격 99종\n※ 지원 자격증은 「국가기술자격법」 Q-net, PQI에서 확인하며, 변동 가능\n※ 시험 절차 없이 교육 이수 등으로 취득 가능한 자격의 경우 지원불가\n성과 및 기대효과\n구직 청년의 자기계발 및 취업 경쟁력 강화 도모"},{"id":"ANS014#full3","policyId":"ANS014","section":"full","text":"경기청년 역량강화 기회 지원(구직자 응시료 지원) | 공고 원문 3/3\n담당부서\n청년정책관 청년지원팀(031-369-1655)"},{"id":"ANS019#overview","policyId":"ANS019","section":"overview","text":"청년취업 면접복장 무료대여 | 개요\n- 분야: 교육일자리\n- 한 줄 요약: 면접 정장 일체 무료 대여 (연 3회)\n- 대상: 만 18~39세, 신청일 기준 안산시 주민등록 필요 (원문에 기준일이 없어 신청일 기준으로 봄)","say":"청년취업 면접복장 무료대여는 교육일자리 분야 사업이에요. 면접 정장 일체 무료 대여 (연 3회). 대상은 만 18~39세, 거주 조건은 '안산 주민등록'이에요."},{"id":"ANS019#target","policyId":"ANS019","section":"target","text":"청년취업 면접복장 무료대여 | 지원 대상\n- 나이: 만 18~39세\n- 거주: 신청일 기준 안산시 주민등록 필요 (원문에 기준일이 없어 신청일 기준으로 봄)\n- 공고 원문: \"지원대상 : 안산시 거주 18세 ~ 39세 거주 청년\"","say":"나이 조건은 만 18~39세예요. 신청일 기준으로 안산시에 주민등록이 되어 있어야 해요. 원문에 기준일이 없어서 신청일 기준으로 봤어요.","quote":"지원대상 : 안산시 거주 18세 ~ 39세 거주 청년"},{"id":"ANS019#benefit","policyId":"ANS019","section":"benefit","text":"청년취업 면접복장 무료대여 | 지원 내용\n- 내용: 면접 정장 일체 무료 대여 (연 3회)\n- 금액: 무료","say":"지원 내용은 '면접 정장 일체 무료 대여 (연 3회)'예요."},{"id":"ANS019#period","policyId":"ANS019","section":"period","text":"청년취업 면접복장 무료대여 | 신청 기간\n- 안내: 상시","say":"안내: 상시."},{"id":"ANS019#method","policyId":"ANS019","section":"method","text":"청년취업 면접복장 무료대여 | 신청 방법\n- 신청 방법: 안산시청 홈페이지 온라인 신청\n- 신청 사이트: 안산시청 누리집 (https://www.ansan.go.kr/www/common/bbs/selectPageListBbs.do?bbs_code=B0627)","say":"신청 방법은 '안산시청 홈페이지 온라인 신청'이에요. 안산시청 누리집에서 신청해요."},{"id":"ANS019#contact","policyId":"ANS019","section":"contact","text":"청년취업 면접복장 무료대여 | 문의처\n- 담당: 일자리센터팀 031-481-2882","say":"담당은 일자리센터팀 031-481-2882예요."},{"id":"ANS019#notes","policyId":"ANS019","section":"notes","text":"청년취업 면접복장 무료대여 | 참고\n- 원문에 거주 기준일이 없어서 신청일 기준으로 판정해요","say":"원문에 거주 기준일이 없어서 신청일 기준으로 판정해요."},{"id":"ANS019#full1","policyId":"ANS019","section":"full","text":"청년취업 면접복장 무료대여 | 공고 원문 1/2\n추진배경,사업개요,주요내용,성과 및 기대효과,담당부서 순으로 정보를 제공합니다\n추진배경\n청년들의 경제적 부담을 경감시키고, 취업능력을 갖출 수 있도록 맞춤형 취업지원 서비스 제공\n사업개요\n지원대상 : 안산시 거주 18세 ~ 39세 거주 청년\n지원방법 : 대여시스템 활용\n신청방법\n안산시청 홈페이지 접속하여 온라인 신청\n시 홈페이지->분야별정보->경제/일자리->취업정보->청년취업 면접복장 무료대여\n(신청페이지 :\nhttps://www.ansan.go.kr/www/common/bbs/selectPageListBbs.do?bbs_code=B0627)\n주요내용\n면접정장 일체 무료 대여 / 1인당 연 3회까지 이용 가능\n남 : 상하정장, 와이셔츠, 넥타이, 벨트, 구두\n여 : 상하정장, 블라우스, 구두"},{"id":"ANS019#full2","policyId":"ANS019","section":"full","text":"청년취업 면접복장 무료대여 | 공고 원문 2/2\n성과 및 기대효과\n면접정장 일체를 무료로 대여하여 경제적 부담을 경감시키고 자신감을 높여 취업 성공으로 이어질 수 있도록 지원\n담당부서\n안산시 일자리센터팀(031-481-2882)"},{"id":"ANS030#overview","policyId":"ANS030","section":"overview","text":"청년 전·월세보증금 대출이자 지원 | 개요\n- 분야: 주거복지\n- 한 줄 요약: 보증금 대출잔액 2% 이내 이자 실비 지원 (연 최대 200만원)\n- 대상: 만 19~39세, 신청일 기준 안산시 주민등록 필요\n- 조건: 무주택, 전용 85㎡ 이하 & 보증금 3억 이하, 1년 이상 이자 납입 / 가구 기준 중위소득 180% 이하 / 신청일 기준 전입신고된 안산시 소재 주택만 인정","say":"청년 전·월세보증금 대출이자 지원은 주거복지 분야 사업이에요. 보증금 대출잔액 2% 이내 이자 실비 지원 (연 최대 200만원). 대상은 만 19~39세, 거주 조건은 '안산 주민등록'이에요."},{"id":"ANS030#target","policyId":"ANS030","section":"target","text":"청년 전·월세보증금 대출이자 지원 | 지원 대상\n- 나이: 만 19~39세\n- 거주: 신청일 기준 안산시 주민등록 필요\n- 그 밖의 조건(본인 확인): 무주택, 전용 85㎡ 이하 & 보증금 3억 이하, 1년 이상 이자 납입 / 가구 기준 중위소득 180% 이하 / 신청일 기준 전입신고된 안산시 소재 주택만 인정\n- 공고 원문: \"안산시에 주민등록을 둔 19~39세 무주택 청년\"","say":"나이 조건은 만 19~39세예요. 신청일 기준으로 안산시에 주민등록이 되어 있어야 해요. 그 밖에 '무주택, 전용 85㎡ 이하 & 보증금 3억 이하, 1년 이상 이자 납입', '가구 기준 중위소득 180% 이하', '신청일 기준 전입신고된 안산시 소재 주택만 인정' 조건은 직접 확인해 주세요.","quote":"안산시에 주민등록을 둔 19~39세 무주택 청년"},{"id":"ANS030#benefit","policyId":"ANS030","section":"benefit","text":"청년 전·월세보증금 대출이자 지원 | 지원 내용\n- 내용: 보증금 대출잔액 2% 이내 이자 실비 지원 (연 최대 200만원)\n- 금액: 연 최대 200만원(5년간 총 400만원)","say":"지원 내용은 '보증금 대출잔액 2% 이내 이자 실비 지원 (연 최대 200만원)'이에요. 금액은 연 최대 200만원(5년간 총 400만원)이에요."},{"id":"ANS030#period","policyId":"ANS030","section":"period","text":"청년 전·월세보증금 대출이자 지원 | 신청 기간\n- 접수 기간: 2026.08.01 ~ 2026.08.31\n- 안내: 매년 8월 신청\n- 관련 공고: 안산시 공고 제2026-1704호(2026-07-27)","say":"수집한 공고의 접수 기간은 2026.08.01 ~ 2026.08.31이에요. 안내: 매년 8월 신청."},{"id":"ANS030#method","policyId":"ANS030","section":"method","text":"청년 전·월세보증금 대출이자 지원 | 신청 방법\n- 신청 방법: 잡아바 어플라이 온라인\n- 신청 사이트: 잡아바 어플라이 (https://apply.jobaba.net), 로그인 필요\n- 찾는 법: 로그인한 뒤 검색창에 '청년 전·월세보증금 대출이자 지원' 검색 (사이트 첫 화면으로 열림)","say":"신청 방법은 '잡아바 어플라이 온라인'이에요. 신청 사이트는 잡아바 어플라이예요. 첫 화면이 열리니 로그인한 뒤 검색창에 '청년 전·월세보증금 대출이자 지원'을 검색해 주세요."},{"id":"ANS030#contact","policyId":"ANS030","section":"contact","text":"청년 전·월세보증금 대출이자 지원 | 문의처\n- 담당: 청년정책관 청년정책팀 031-369-1649","say":"담당은 청년정책관 청년정책팀 031-369-1649예요."},{"id":"ANS030#notes","policyId":"ANS030","section":"notes","text":"청년 전·월세보증금 대출이자 지원 | 참고\n- 신청일 기준 전입신고된 주택만 신청할 수 있어요(제2026-1704호 공고문).","say":"신청일 기준 전입신고된 주택만 신청할 수 있어요(제2026-1704호 공고문)."},{"id":"ANS030#full1","policyId":"ANS030","section":"full","text":"청년 전·월세보증금 대출이자 지원 | 공고 원문 1/2\n추진배경,사업개요,주요내용,성과 및 기대효과,담당부서 순으로 정보를 제공합니다\n추진배경\n목돈 마련이 어려운 청년의 사회 진입 초기의 주거비 부담 완화 지원을 통해 관내 청년인구 유입과 정주 여건 향상에 기여\n사업개요\n사업기간 : 매년 8월 중(하반기)\n신청기간 : 8. 1. ~ 8. 31.\n지원대상 : 안산시에 주민등록을 둔 19~39세 무주택 청년으로 금융기관 전·월세보증금 대출 후 1년 이상 이자를 납입한 자\n<소득> 기준 중위소득 180% 이하\n<주택> 면적 85㎡이하 & 임차보증금 3억원 이하(전ㆍ월세전환율 6.4% 이하)\n신청접수 : 온라인(잡아바 어플라이)\n주요내용\n지원금액 : 연 1회 최대 200만원, 5년 내(매년 신청) 총 400만원"},{"id":"ANS030#full2","policyId":"ANS030","section":"full","text":"청년 전·월세보증금 대출이자 지원 | 공고 원문 2/2\n지원내용 : 임대차계약 기간 및 금융기관 대출 실행기간 내 전ㆍ월세보증금 대출잔액의 2% 이내 이자 상환액 실비 지원\n선정방법 : 예산 초과 시 별도 배점표 적용 고득점순으로 선정\n지급방법 : 청년 본인계좌 현금 입금\n성과 및 기대효과\n청년의 주거안전망 구축과 정주여건 개선을 통한 자립과 지역 정착 유도\n담당부서\n청년정책관 청년정책팀(031-369-1649)"},{"id":"ANS031#overview","policyId":"ANS031","section":"overview","text":"청년우대 착한부동산 중개사무소 | 개요\n- 분야: 주거복지\n- 한 줄 요약: 참여 중개사무소 중개보수 자율 감면 (최대 6만원)\n- 대상: 만 19~29세, 신청일 기준 안산시 주민등록 필요 (원문에 기준일이 없어 신청일 기준으로 봄)\n- 조건: 무주택, 1억 이하 전·월세 계약","say":"청년우대 착한부동산 중개사무소는 주거복지 분야 사업이에요. 참여 중개사무소 중개보수 자율 감면 (최대 6만원). 대상은 만 19~29세, 거주 조건은 '안산 주민등록'이에요."},{"id":"ANS031#target","policyId":"ANS031","section":"target","text":"청년우대 착한부동산 중개사무소 | 지원 대상\n- 나이: 만 19~29세\n- 거주: 신청일 기준 안산시 주민등록 필요 (원문에 기준일이 없어 신청일 기준으로 봄)\n- 그 밖의 조건(본인 확인): 무주택, 1억 이하 전·월세 계약\n- 공고 원문: \"안산시에 주민등록을 둔 19~29세 무주택 청년\"","say":"나이 조건은 만 19~29세예요. 신청일 기준으로 안산시에 주민등록이 되어 있어야 해요. 원문에 기준일이 없어서 신청일 기준으로 봤어요. 그 밖에 '무주택, 1억 이하 전·월세 계약' 조건은 직접 확인해 주세요.","quote":"안산시에 주민등록을 둔 19~29세 무주택 청년"},{"id":"ANS031#benefit","policyId":"ANS031","section":"benefit","text":"청년우대 착한부동산 중개사무소 | 지원 내용\n- 내용: 참여 중개사무소 중개보수 자율 감면 (최대 6만원)\n- 상세: 참여 중개사무소 중개보수 자율 감면(20% 이내)\n- 금액: 최대 6만원 감면","say":"지원 내용은 '참여 중개사무소 중개보수 자율 감면 (최대 6만원)'이에요. 상세: 참여 중개사무소 중개보수 자율 감면(20% 이내)."},{"id":"ANS031#period","policyId":"ANS031","section":"period","text":"청년우대 착한부동산 중개사무소 | 신청 기간\n- 접수 기간: 2026.03.05 ~ 2026.12.31\n- 안내: 참여 중개사무소 이용 시\n- 관련 공고: 안산시 공고 제2026-117호(2026-01-15, 참여 중개사무소 모집)","say":"수집한 공고의 접수 기간은 2026.03.05 ~ 2026.12.31이에요. 안내: 참여 중개사무소 이용 시."},{"id":"ANS031#method","policyId":"ANS031","section":"method","text":"청년우대 착한부동산 중개사무소 | 신청 방법\n- 신청 방법: 참여 중개사무소 방문","say":"신청 방법은 '참여 중개사무소 방문'이에요."},{"id":"ANS031#contact","policyId":"ANS031","section":"contact","text":"청년우대 착한부동산 중개사무소 | 문의처\n- 담당: 청년정책관 031-369-1649","say":"담당은 청년정책관 031-369-1649예요."},{"id":"ANS031#notes","policyId":"ANS031","section":"notes","text":"청년우대 착한부동산 중개사무소 | 참고\n- 감면율은 공고(제2026-117호) 기준이에요\n- 원문에 거주 기준일이 없어서 신청일 기준으로 판정해요","say":"감면율은 공고(제2026-117호) 기준이에요. 원문에 거주 기준일이 없어서 신청일 기준으로 판정해요."},{"id":"ANS031#full1","policyId":"ANS031","section":"full","text":"청년우대 착한부동산 중개사무소 | 공고 원문 1/1\n추진배경,사업개요,주요내용,성과 및 기대효과,담당부서 순으로 정보를 제공합니다\n추진배경\n청년들에게 민관협력을 통해 부동산 중개수수료를 경감해줌으로써 청년층의 안전한 주거문화 형성과 정주여건 향상에 기여\n사업개요\n사업형태 : 민관협력<안산시 관내 개업공인중개사무소의 자발적 참여에 따른 재능기부>\n사업기간 : 2026. 3. 5. ~ 2026. 12. 31. (1년 단위 연장)\n지원대상 : 안산시에 주민등록을 둔 19~29세 무주택 청년\n지원내용 : 거래금액 1억원 이하 임대(전ㆍ월세) 계약 시 중개보수 자율 감면\n주요내용\n청년우대 착한부동산 현황\n청년우대 착한부동산 현황\n미리보기\n성과 및 기대효과\n지역상생, 주거안전, 정주여건 향상\n담당부서\n안산시 청년정책관(031-369-1649)"},{"id":"ANS034#overview","policyId":"ANS034","section":"overview","text":"안산시 병역의무 이행 청년카드 | 개요\n- 분야: 주거복지\n- 한 줄 요약: 시설 수강료·입장료·주차요금 감면\n- 대상: 만 39세 이하, 신청일 기준 안산시 주민등록 필요 (원문에 기준일이 없어 신청일 기준으로 봄)\n- 조건: 현역 복무 후 제대군인(보충역 등 제외)","say":"안산시 병역의무 이행 청년카드는 주거복지 분야 사업이에요. 시설 수강료·입장료·주차요금 감면. 대상은 만 39세 이하, 거주 조건은 '안산 주민등록'이에요."},{"id":"ANS034#target","policyId":"ANS034","section":"target","text":"안산시 병역의무 이행 청년카드 | 지원 대상\n- 나이: 만 39세 이하\n- 거주: 신청일 기준 안산시 주민등록 필요 (원문에 기준일이 없어 신청일 기준으로 봄)\n- 그 밖의 조건(본인 확인): 현역 복무 후 제대군인(보충역 등 제외)\n- 공고 원문: \"신청대상 : 안산시 주민등록 39세이하 현역 복무 후 제대군인\"","say":"나이 조건은 만 39세 이하예요. 신청일 기준으로 안산시에 주민등록이 되어 있어야 해요. 원문에 기준일이 없어서 신청일 기준으로 봤어요. 그 밖에 '현역 복무 후 제대군인(보충역 등 제외)' 조건은 직접 확인해 주세요.","quote":"신청대상 : 안산시 주민등록 39세이하 현역 복무 후 제대군인"},{"id":"ANS034#benefit","policyId":"ANS034","section":"benefit","text":"안산시 병역의무 이행 청년카드 | 지원 내용\n- 내용: 시설 수강료·입장료·주차요금 감면","say":"지원 내용은 '시설 수강료·입장료·주차요금 감면'이에요."},{"id":"ANS034#period","policyId":"ANS034","section":"period","text":"안산시 병역의무 이행 청년카드 | 신청 기간\n- 접수 기간: 2026.01.01 ~\n- 안내: 상시","say":"수집한 공고의 접수 기간은 2026.01.01 ~ (마감일 없음)이에요. 안내: 상시."},{"id":"ANS034#method","policyId":"ANS034","section":"method","text":"안산시 병역의무 이행 청년카드 | 신청 방법\n- 신청 방법: 안산통합예약시스템 온라인 신청 → 경기똑D 앱에서 발급","say":"신청 방법은 '안산통합예약시스템 온라인 신청 → 경기똑D 앱에서 발급'이에요."},{"id":"ANS034#contact","policyId":"ANS034","section":"contact","text":"안산시 병역의무 이행 청년카드 | 문의처\n- 담당: 청년정책관 청년지원팀 031-369-1649","say":"담당은 청년정책관 청년지원팀 031-369-1649예요."},{"id":"ANS034#notes","policyId":"ANS034","section":"notes","text":"안산시 병역의무 이행 청년카드 | 참고\n- 원문에 거주 기준일이 없어서 신청일 기준으로 판정해요","say":"원문에 거주 기준일이 없어서 신청일 기준으로 판정해요."},{"id":"ANS034#full1","policyId":"ANS034","section":"full","text":"안산시 병역의무 이행 청년카드 | 공고 원문 1/2\n추진배경,사업개요,주요내용,성과 및 기대효과,담당부서 순으로 정보를 제공합니다\n추진배경\n병역의무를 성실히 이행한 청년에 대한 예우와 지원을 통해 군복무 희생에 대한 긍지와 자부심을 높이고 사회복귀를 지원해 지역 정착 및 지역사회 발전에 기여\n사업개요\n사업기간 : 2026. 1. ~ 계속\n신청대상 : 안산시 주민등록 39세이하 현역 복무 후 제대군인\n※ 신청제외 : 보충역, 전환복무, 대체역 복무\n※ 현역군인 : 소속 부대장 발급 복무확인서 또는 휴가증 제시\n발급방법 : 안산통합예약시스템 온라인 신청 → 승인→ (경기똑D)앱 설치ㆍ 현장증빙\n혜택기간 : 현역병(복무기간) + 제대군인(현역복무 상당기간)\n주요내용\n주요혜택\n평생학습관, 평생비전센터, 화정영어마을 : 수강료 전액 면제(선착순)"},{"id":"ANS034#full2","policyId":"ANS034","section":"full","text":"안산시 병역의무 이행 청년카드 | 공고 원문 2/2\n화랑오토캠핑장 : 입장료 50% 감경\n동주염전, 어촌민속박물관, 별망어촌문화관, 누에섬등대전망대 : 입장료 전액 면제\n올림픽기념관 및 안산시 운영 체육시설 : 전용료 50% 감경, 연습료 30% 감경\n안산 기차카페 세라티 : 테이크아웃 음료 10% 할인\n도시공원 안산 썰매장 : 군인 가격 적용\n안산시 공영주차장 : 주차요금 50% 감경\n시정 소식 홍보 : 청년 주요정책 ‘청필모’ 모바일 발송\n성과 및 기대효과\n청년들의 군복무 긍정적 지지 변화 및 사회복귀 유도와 지역사회 발전에 기여\n담당부서\n청년정책관 청년지원팀(031-369-1649)"},{"id":"EXT005#overview","policyId":"EXT005","section":"overview","text":"안전대응 일자리사업 참여자 모집(하반기) | 개요\n- 분야: 교육일자리\n- 한 줄 요약: 공공 안전대응 일자리 (주 20시간, 71명)\n- 대상: 만 18세 이상, 공고일 기준 안산시 주민등록 필요\n- 조건: 가구 기준중위소득 70% 이하, 재산 4억 이하 / 실업급여 수급자·생계급여 수급권자 제외","say":"안전대응 일자리사업 참여자 모집(하반기)는 교육일자리 분야 사업이에요. 공공 안전대응 일자리 (주 20시간, 71명). 대상은 만 18세 이상, 거주 조건은 '안산 주민등록'이에요."},{"id":"EXT005#target","policyId":"EXT005","section":"target","text":"안전대응 일자리사업 참여자 모집(하반기) | 지원 대상\n- 나이: 만 18세 이상\n- 거주: 공고일 기준 안산시 주민등록 필요\n- 그 밖의 조건(본인 확인): 가구 기준중위소득 70% 이하, 재산 4억 이하 / 실업급여 수급자·생계급여 수급권자 제외\n- 공고 원문: \"공고일 현재 만18세 이상 근로능력자 … 가구소득이 기준중위소득의 70%이하이면서 재산이 4억원 이하인 안산 시민\"","say":"나이 조건은 만 18세 이상이에요. 공고일 기준으로 안산시에 주민등록이 되어 있어야 해요. 그 밖에 '가구 기준중위소득 70% 이하, 재산 4억 이하', '실업급여 수급자·생계급여 수급권자 제외' 조건은 직접 확인해 주세요.","quote":"공고일 현재 만18세 이상 근로능력자 … 가구소득이 기준중위소득의 70%이하이면서 재산이 4억원 이하인 안산 시민"},{"id":"EXT005#benefit","policyId":"EXT005","section":"benefit","text":"안전대응 일자리사업 참여자 모집(하반기) | 지원 내용\n- 내용: 공공 안전대응 일자리 (주 20시간, 71명)\n- 금액: 시급(최저임금 수준)","say":"지원 내용은 '공공 안전대응 일자리 (주 20시간, 71명)'이에요. 금액은 시급(최저임금 수준)이에요."},{"id":"EXT005#period","policyId":"EXT005","section":"period","text":"안전대응 일자리사업 참여자 모집(하반기) | 신청 기간\n- 접수 기간: 2026.06.08 ~ 2026.06.12\n- 안내: 상·하반기 연 2회(상반기 1월 모집)","say":"수집한 공고의 접수 기간은 2026.06.08 ~ 2026.06.12이에요. 안내: 상·하반기 연 2회(상반기 1월 모집)."},{"id":"EXT005#method","policyId":"EXT005","section":"method","text":"안전대응 일자리사업 참여자 모집(하반기) | 신청 방법\n- 신청 방법: 주민등록지 동 행정복지센터 방문","sa 일 4시간 이내)\n- 만 65세 이상 : 주15시간(주5일, 1일 3시간 이내)\n※ 만 65세 이상(사업참여일 기준)\n○\n구비서류\n·\n사업참여 신청서 및 (가구원)개인정보제공동의서\n(동행정복지센터 비치)\n-\n신청자 및 배우자\n(\n세대 분리된 배우자 포함\n),\n가구 세대원\n(\n동거인 포함\n)\n의 동의서 서명 또는 도장 날인\n·\n등본\n,\n가족관계증명서\n(\n동행정복지센터 방문시 공용발급\n)\n·\n외국인의 경우 국내거소사실증명서(또는 외국인사실증명서) 발급\n- 등본 또는 가족관계증명서 발급이 가능한 외국인의 경우 포함하여 제출\n·\n북한이탈주민등록확인서\n,\n취업보호ㆍ지원대상 증명서\n(\n해당자 지참\n)\n등의 가점 자료\n[\n붙임\n4]\n·"},{"id":"EXT005#full6","policyId":"EXT005","section":"full","text":"안전대응 일자리사업 참여자 모집(하반기) | 공고 원문 6/13\n신청자 본인이 심한 장애를 가지고 있는 경우\n근로능력평가용 진단서\n제출 필수(공고일 기준 최근 1년 이내 발급)\n※ 주민등록증 등 신분증 지참은 본인 확인 및 빠른 접수 업무에 도움이 됩니다.\n5. 사업 참여 신청자 심사\n: 2026. 6. 15. ~ 8. 11."},{"id":"EXT005#full7","policyId":"EXT005","section":"full","text":"안전대응 일자리사업 참여자 모집(하반기) | 공고 원문 7/13\n6. 선발자 발표 :\n2026. 8. 12.(수) 12:00\n안산시청 홈페이지 게시 및 선발자 개별통보\n※사업 미선발자에 대하여는 개별 통보 없음\n7\n.\n문의처\n:\n안산시 민원콜센터\n(\n☎\n1666-1234),\n안산시 노동일자리과\n(\n☎\n481-2978)\n8\n.\n유의사항\n· 신청서 및 제출서류의 기재 착오 및 누락 등으로 발생한 불이익은 참여자의 책임입니다.\n· 본 사업에 선발되어 참여 중 타 재정지원일자리사업에 중복 참여한 것이 확인될 시에는 지급한 임금을 회수합니다.\n· 기초생활수급자 등의 경우, 본 사업참여에 따른 소득발생으로 수급자격에 변동이 있을 수 있습니다.\n· 신청서 등 허위 제출 시 사업참여가 불가합니다."},{"id":"EXT005#full8","policyId":"EXT005","section":"full","text":"안전대응 일자리사업 참여자 모집(하반기) | 공고 원문 8/13\n· 적격자 미달의 경우, 선발하지 않을 수 있으며 선발이후 부적격자로 판정될 경우 선발 취소할 수 있습니다.\n· (불성실 근무자에 대한 제재) 3회 이상 경고 받은 자의 경우 근로계약 해지 등 참여 배제될 수 있습니다.\n· 동일 기간 접수하는 타 재정지원일자리와 중복 접수가 불가하며 중복 접수 시 모든 사업 선발 배제됩니다."},{"id":"EXT005#full9","policyId":"EXT005","section":"full","text":"안전대응 일자리사업 참여자 모집(하반기) | 공고 원문 9/13\n9. 사업참여 배제 기준\n① 공고일 기준 안산시민이 아닌 자\n②\n국민기초생활 보장법상의 생계급여 수급권자\n③\n가구소득이 기준 중위소득\n70%\n를 초과\n하거나 재산이\n4\n억 초과로 확인된 자\n*\n가구의 범위\n:\n‘\n주민등록등본 상 세대원\n(\n동거인 포함\n)\n’기준\n**\n채무 입증서류 제출 시 자산총액에서 채무액 차감한 액수로 판단\n※ 신청 대기자가 없을 시 기준 중위소득\n70%\n초과자는 참여 가능\n④\n본 사업\n직전에 시행된 재정지원 및 직접일자리사업 당초\n·\n중도 포기자\n*\n희망\n·\n안전대응\n및 지역공동체\n,\n대부도특화일자리 등 공공일자리\n※ 단\n,\n질병\n(\n진단서 제출\n),\n군복무\n,\n출산\n(\n본인\n)\n등의 사유는 제외\n※ 신청 대기자가 없을 시 전 단계 당초\n,\n중도 포기자 참여 가능\n⑤\n접수시작일 기준"},{"id":"EXT005#full10","policyId":"EXT005","section":"full","text":"안전대응 일자리사업 참여자 모집(하반기) | 공고 원문 10/13\n,\n전단계 재정지원\n일자리사업에\n2\n회 연속 참여한 자\n※ 반복참여 제한 기간이 도과한 자라도 취업지원프로그램을 참여해야 본 사업 참여 가능\n※ 단, 신청 대기자가 없을 시 2회 연속 참여자 참여 가능,\n단\n3\n회 연속 참여자 무조건 참여 배제\n⑥\n1세대 2인 이상 신청자\n* 청년 미취업자(만39세이하)는 1세대 2인 이상 신청 가능\n⑦\n소득보조형 직접일자리사업에 참여한 뒤 사업개시일 기준\n실업급여 수급권자\n*\n사업개시일 기준 실업급여를 수급한지\n90\n일이 경과하지 않은 자 또는 실업급여 수급 후 취업지원프로그램을 거치지 않은 자 포함\n⑧ 불성실 근무자 참여 배제 -> 배제일로부터 1년 참여 불가\n⑨\n공무원의 가족(사립학교 교직원 포함) : 공무원의 배우자 및 자녀"},{"id":"EXT005#full11","policyId":"EXT005","section":"full","text":"안전대응 일자리사업 참여자 모집(하반기) | 공고 원문 11/13\n* 단, 주민등록과 건강보험 모두 별도로 구성되어 있는 자녀의 경우는 허용\n⑩\n신청서\n,\n개인정보 수집ㆍ이용ㆍ제공 동의서 등 구비서류 미제출자 및 허위 작성자\n⑪\n기타 자치단체의 장이 지병ㆍ건강쇠약 등으로 근로가 불가하다고 판단되는 자\n⑫\nF2, F5, F6\n이외의\n비자 취득자\n*\n단\n, F2, F5, F6\n비자 취득자라도 가구 소득\n·\n재산조회가 불가능한 자는 참여 배제\n⑬\n정기소득이 있는 자\n(\n사업장 건강보험가입자\n,\n사업자등록자\n,\n고용보험가입자\n)\n*\n사업자등록자의 배우자 포함\n⑭\n접수시작일 이후 재정지원 일자리사업 선발자\n⑮ 공적연금 수령자 -> 공무원연금, 군인연금, 사학연금 수령자\n⑯ 사업 참여 후 건강검진 결과 근로능력 미약자로 판단되는 자\n⑰ 아동\n·\n청소년 관련 사업의 경우 「아동\n·"},{"id":"EXT005#full12","policyId":"EXT005","section":"full","text":"안전대응 일자리사업 참여자 모집(하반기) | 공고 원문 12/13\n청소년의 성보호에 관한 법률」에 따라 취업 제한 중인 자\n<2026년 가구원수별 참여가 제한되는 소득합산액 기준표\n(단위: 원)\n>\n가구원수\n1\n인\n2\n인\n3\n인\n4\n인\n5\n인\n기준 중위소득\n(70%)\n1,794,967\n2,939,504\n3,751,325\n4,546,317\n5,289,703\n가구원수\n6인\n7인\n8인\n9인\n10인\n기준 중위소득\n(70%)\n5,989,166\n6,660,605\n7,332,044\n8,003,482\n8,674,921\n*\n가구소득 및 재산 산정\n시 가구 단위는\n‘주민등록등본상 세대원’ 기준\n붙임"},{"id":"EXT005#full13","policyId":"EXT005","section":"full","text":"안전대응 일자리사업 참여자 모집(하반기) | 공고 원문 13/13\n1.\n2026\n년 하반기 안전대응 일자리사업 참여자\n모집내역\n1\n부\n.\n2.\n2026\n년 하반기 안전대응 일자리사업 참여신청서\n1\n부\n.\n3.\n가점 증빙서류\n1\n부\n.\n끝\n."},{"id":"EXT006#overview","policyId":"EXT006","section":"overview","text":"지역공동체 일자리사업 참여자 모집(하반기) | 개요\n- 분야: 교육일자리\n- 한 줄 요약: 지역공동체 공공일자리 (81명, 시급 10,320원)\n- 대상: 만 18세 이상, 공고일 기준 안산시 주민등록 필요\n- 조건: 가구 기준중위소득 70% 이하, 재산 4억 이하 / 고용보험 가입자·사업자등록자 제외","say":"지역공동체 일자리사업 참여자 모집(하반기)는 교육일자리 분야 사업이에요. 지역공동체 공공일자리 (81명
