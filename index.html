const KIND_TAG = { policy: '찾은 공고 내용', help: '도움말', list: '분류 묶음', judge: '판정 결과', compare: '나란히 보기', candidates: '후보 제시' };
const unitName = (k) => { const p = byId(k); if (p) return shortName(p.name); const c = CORPUS.chunks.find((x) => x.id === k); return c ? c.title : k; };
// 답이 나온 길 (발표·점검용): 어떤 규칙·검색으로 이 답이 나왔는지
function howHTML(m) {
  const d = m.a && m.a.debug;
  if (!d || !d.route) return '';
  const rows = [['답이 나온 길', d.route]];
  if (d.mode) rows.push(['검색 방식', d.mode === 'dense' ? '의미 검색 (문장 임베딩)' : '낱말 검색 (BM25)']);
  if (d.top && d.top.length) rows.push(['검색 상위', d.top.map(([k], i) => `${i + 1}. ${unitName(k)}`).join(' / ')]);
  if (d.matched && d.matched.length) rows.push(['겹친 낱말', d.matched.join(', ')]);
  if (d.trust) rows.push(['확신', { single: '바로 답함', cand: '후보로 제시', none: '못 찾음' }[d.trust] + (d.z != null ? ` (1위가 뚜렷한 정도 z=${d.z})` : '')]);
  if (m.gen) rows.push(['문장 정리', m.gen.state === 'done' ? `${m.gen.model} · 숫자·한국어 검사 통과` : m.gen.state === 'fail' ? `${m.gen.model} → 검사에 걸려 찾은 내용으로 대체` : m.gen.model]);
  return `<details class="msg-how"><summary>어떻게 찾았나요?</summary><dl>${rows.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}</dl></details>`;
}
function msgHTML(m, i) {
  if (m.role === 'user') return `<div class="msg user"><div class="msg-b">${esc(m.text)}</div></div>`;
  const a = m.a, g = m.gen;
  const byModel = g && (g.state === 'run' || g.state === 'done');
  const tag = byModel ? `AI 생성 · ${esc(g.model)}` : (a && !a.abstain ? (KIND_TAG[a.kind] || '') : '');
  const text = byModel ? (g.text ? esc(g.text) : '<span class="typing" aria-label="답을 쓰는 중"><i></i><i></i><i></i></span>') : esc(m.text);
  const seen = new Set();
  const srcs = a ? a.sources.filter((s) => { const k = s.policyId || s.chunkId; if (seen.has(k) || seen.size >= 2) return false; seen.add(k); return true; }) : [];
  // 낱말 검색으로 못 찾았거나 후보만 나온 마지막 답에는 '의미 검색으로 다시 찾기'를 붙인다
  const last = i === chat.msgs.length - 1, q = last && chat.msgs[i - 1] ? chat.msgs[i - 1].text : '';
  const retry = last && a && denseIx && !ai.semantic && (a.kind === 'candidates' || a.reason === 'no_match')
    ? `<button type="button" class="retry" data-retry="${esc(q)}" ${ai.embState === 'loading' ? 'disabled' : ''}>${ai.embState === 'loading' ? esc(ai.embMsg) : `의미 검색으로 다시 찾기${ai.embState === 'ready' ? '' : ` (${denseIx.downloadMB || 110}MB 내려받기)`}`}</button>` : '';
  const fb = ai.log && m.logId && a && a.kind !== 'meta' && !chat.busy ? `<button type="button" data-fb="1" data-i="${i}" aria-pressed="${m.fb === 1}">도움 됐어요</button><button type="button" data-fb="-1" data-i="${i}" aria-pressed="${m.fb === -1}">아니에요</button>` : '';
  return `<div class="msg bot"><span class="bubble-ic" aria-hidden="true">${robot(18)}</span><div class="msg-col">
    <div class="msg-b">${tag ? `<span class="msg-tag">${tag}</span>` : ''}<span class="msg-text">${text}</span>
      ${g && g.warn ? `<p class="msg-warn">${icon('warn', 13)}<span>${esc(g.warn)}</span></p>` : ''}
      ${g && g.state === 'done' ? `<details class="msg-alt"><summary>찾은 공고 내용 그대로 보기</summary><p>${esc(m.text)}</p></details>` : ''}</div>
    ${a && a.cards.length ? `<div class="minis">${a.cards.slice(0, 6).map(miniHTML).join('')}</div>` : ''}
    ${srcs.length ? `<div class="srcs"><span class="srcs-h">근거</span>${srcs.map(srcHTML).join('')}</div>` : ''}
    ${retry || fb ? `<div class="msg-acts">${retry}${fb}</div>` : ''}
    ${a ? howHTML(m) : ''}
  </div></div>`;
}
function renderChat() {
  const log = $('chat-log'), pid = pageId();
  log.innerHTML = msgHTML({ role: 'bot', text: WELCOME }) + chat.msgs.map(msgHTML).join('');
  log.scrollTop = log.scrollHeight;
  const sc = $('chat-scope');
  sc.hidden = !pid;
  if (pid) sc.innerHTML = chat.wide ? '<span>전체 사업에서 찾는 중이에요</span><button type="button" data-wide="0">이 공고로 물어보기</button>'
    : `<span>지금 보는 공고 <b>${esc(shortName(byId(pid).name))}</b>에 대해 답해요</span><button type="button" data-wide="1">전체에서 찾기</button>`;
  $('chat-chips').innerHTML = chipsFor().map((q) => `<button type="button" data-q="${esc(q)}">${esc(q)}</button>`).join('');
  $('chat-send').disabled = chat.busy;
}
function renderSet() {
  const box = $('chat-set'), btn = $('chat-set-btn');
  btn.setAttribute('aria-expanded', String(ai.setOpen));
  box.hidden = !ai.setOpen;
  box.parentElement.classList.toggle('set-open', ai.setOpen);
  if (!ai.setOpen) return;
  const on = (v) => (v ? '<span class="on">켜짐</span>' : '');
  const prog = (state, pct, msg) => (state === 'loading' ? `<span class="bar" aria-hidden="true"><i style="width:${pct}%"></i></span><span class="ai-msg" role="status">${esc(msg)}</span>` : state === 'error' ? `<span class="ai-msg err" role="alert">${esc(msg)}</span>` : '');
  box.innerHTML = `
    <h3>검색 방식</h3>
    <div class="ai-opt" data-on="${!ai.semantic}"><div class="ai-opt-h"><b>낱말 검색</b>${on(!ai.semantic)}</div><p>질문의 낱말이 들어 있는 공고를 찾아요. 내려받기 없이 바로 돼요. 사업 이름이나 "월세" 같은 낱말로 물을 때 잘 맞아요.</p>
      ${ai.semantic ? '<button type="button" class="ai-btn ghost" data-ai="sem-off">낱말 검색으로 바꾸기</button>' : ''}</div>
    ${denseIx ? `<div class="ai-opt" data-on="${ai.semantic}"><div class="ai-opt-h"><b>의미 검색</b>${on(ai.semantic)}</div><p>"집세가 부담돼요"처럼 바꿔 말해도 찾아요. 검색 모델 ${denseIx.downloadMB || 110}MB를 한 번 내려받아요.</p>
      ${ai.semantic ? '' : `<button type="button" class="ai-btn" data-ai="sem-on" ${ai.embState === 'loading' ? 'disabled' : ''}>${ai.embState === 'ready' ? '의미 검색 켜기' : '내려받고 켜기'}</button>`}${prog(ai.embState, ai.embPct, ai.embMsg)}</div>` : ''}
    <h3>답변 방식</h3>
    <div class="ai-opt" data-on="${ai.gen === 'search'}"><div class="ai-opt-h"><b>검색 답변</b>${on(ai.gen === 'search')}</div><p>찾은 공고 내용을 그대로 보여 줘요. 공고에 없는 세부 내용(지급일·제출 서류 등)을 물으면 가까운 항목을 대신 보여 줄 수 있어요.</p>
      ${ai.gen !== 'search' ? '<button type="button" class="ai-btn ghost" data-ai="gen-search">검색 답변으로 바꾸기</button>' : ''}</div>
    <div class="ai-opt" data-on="${ai.gen === 'webllm'}"><div class="ai-opt-h"><b>브라우저 AI</b>${on(ai.gen === 'webllm')}</div><p>이 기기 안에서 소형 언어모델이 찾은 내용을 짧게 정리해요. PC 크롬 권장, 처음에 모델을 내려받아요.</p>
      <div class="ai-row"><select id="ai-model" aria-label="모델 선택" ${ai.llmState === 'loading' ? 'disabled' : ''}>${LLM_MODELS.map((m) => `<option value="${m.id}" ${m.id === ai.model ? 'selected' : ''}>${m.label} · 약 ${m.gb}GB</option>`).join('')}</select>
      <button type="button" class="ai-btn" data-ai="llm-on" ${ai.llmState === 'loading' ? 'disabled' : ''}>${ai.gen === 'webllm' ? '다시 불러오기' : '켜기'}</button></div>${prog(ai.llmState, ai.llmPct, ai.llmMsg)}</div>
    <div class="ai-opt" data-on="${ai.gen === 'server'}"><div class="ai-opt-h"><b>서버 연결</b>${on(ai.gen === 'server')}</div><p>OpenAI 호환 주소(…/v1)를 넣으면 그 서버의 모델이 답해요. 질문과 찾은 공고 내용이 그 서버로 전송돼요.</p>
      <input id="ai-server" type="url" inputmode="url" placeholder="https://….trycloudflare.com/v1" value="${esc(ai.server)}" aria-label="서버 주소">
      <div class="ai-row"><input id="ai-server-model" type="text" placeholder="모델 이름 (예: exaone3.5:2.4b)" value="${esc(ai.serverModel)}" aria-label="모델 이름">
      <button type="button" class="ai-btn" data-ai="server-on">연결</button></div></div>
    <h3>사용자 테스트</h3>
    <div class="ai-opt" data-on="${ai.log}"><div class="ai-opt-h"><b>질문 기록</b>${on(ai.log)}</div><p>질문, 답이 나온 길, 평가(도움 됐어요 / 아니에요)를 이 기기에만 모아요. 내 조건(생년월일·전입일)은 넣지 않고, '내려받기'를 눌러야 파일로 나와요. 지금 ${readLog().length}건.</p>
      <div class="ai-row"><button type="button" class="ai-btn${ai.log ? ' ghost' : ''}" data-ai="${ai.log ? 'log-off' : 'log-on'}">${ai.log ? '기록 끄기' : '기록 켜기'}</button><button type="button" class="ai-btn ghost" data-ai="log-save">내려받기</button></div>
      ${readLog().length ? '<button type="button" class="ai-btn ghost" data-ai="log-clear">기록 지우기</button>' : ''}</div>
    <button type="button" class="ai-btn ghost" data-ai="close">대화로 돌아가기</button>`;
}

/* ----- 질문 처리 ----- */
async function ask(text) {
  const q = String(text || '').trim();
  if (!q || chat.busy) return;
  chat.busy = true;
  chat.msgs.push({ role: 'user', text: q });
  $('chat-q').value = '';
  let dense = null;
  if (ai.semantic && ai.emb) { try { dense = denseIx.scores(await ai.emb(q)); } catch (e) { dense = null; } }
  const prev = chat.msgs.filter((x) => x.role === 'bot' && x.a).at(-1);          // 바로 앞 답이 다룬 사업 → 이어 묻는 질문에 사용
  const a = rag.answer(q, { profile: state.profile, today: TODAY, page: chat.wide ? null : pageId(), prev: prev ? prev.a.focus : null, dense });
  const m = { role: 'bot', text: a.text, a, gen: null, fb: 0 };
  chat.msgs.push(m);
  logQA(m, q);
  renderChat();
  if (a.llm.use && llmReady()) { await generate(m); logUpdate(m, { gen: m.gen.model, genState: m.gen.state, genAnswer: m.gen.state === 'done' ? m.gen.text.slice(0, 300) : undefined }); }
  chat.busy = false;
  renderChat();
}
// 낱말 검색으로 못 찾은 질문을 의미 검색으로 다시 찾는다 (모델이 없으면 내려받는다)
async function retrySemantic(q) {
  if (!denseIx || !q || chat.busy) return;
  if (ai.embState !== 'ready') { await loadEmbedder(); renderChat(); }
  if (ai.embState !== 'ready') { toast('검색 모델을 불러오지 못했어요. 낱말을 바꿔서 다시 물어봐 주세요'); return; }
  ai.semantic = true;
  ask(q);
}
async function generate(m) {
  m.gen = { state: 'run', text: '', model: llmLabel(), warn: '' };
  renderChat();
  const el = [...document.querySelectorAll('#chat-log .msg.bot .msg-text')].at(-1), log = $('chat-log');
  try {
    let raw = '';
    for await (const piece of llmStream([{ role: 'system', content: m.a.llm.system }, { role: 'user', content: m.a.llm.user }])) {
      raw += piece; m.gen.text = cleanGen(raw);
      if (el && m.gen.text) { el.textContent = m.gen.text; log.scrollTop = log.scrollHeight; }
    }
    m.gen.text = cleanGen(raw).trim();
    const nums = RAG.checkNumbers(m.gen.text, m.a.llm.user);
    if (!m.gen.text) { m.gen.state = 'fail'; m.gen.warn = 'AI 모델이 답을 만들지 못해서 검색 답변을 보여 드려요.'; }
    else if (!nums.ok) { m.gen.state = 'fail'; m.gen.warn = `AI 답에 자료에 없는 숫자(${nums.missing.slice(0, 3).join(', ')})가 있어서 검색 답변을 대신 보여 드려요.`; }
    else if (!RAG.koreanOnly(m.gen.text)) { m.gen.state = 'fail'; m.gen.warn = 'AI 답에 한국어가 아닌 글자가 섞여서 검색 답변을 대신 보여 드려요.'; }
    else m.gen.state = 'done';
  } catch (e) { m.gen.state = 'fail'; m.gen.warn = 'AI 모델에 연결하지 못해서 검색 답변을 보여 드려요.'; }
}

function openSheet() { sheet.hidden = false; renderSet(); renderChat(); $('chat-q').focus(); }
function closeSheet() { sheet.hidden = true; $('fab').focus(); }
$('chat-set-btn').innerHTML = icon('gear', 20);
$('chat-send').innerHTML = icon('send', 18);
$('fab').addEventListener('click', openSheet);
$('sheet-close').addEventListener('click', closeSheet);
$('chat-set-btn').addEventListener('click', () => { ai.setOpen = !ai.setOpen; renderSet(); });
$('chat-form').addEventListener('submit', (e) => { e.preventDefault(); ask($('chat-q').value); });
sheet.addEventListener('click', (e) => {
  if (e.target === sheet) { closeSheet(); return; }
  const chip = e.target.closest('[data-q]');
  if (chip) { ask(chip.dataset.q); return; }
  const wide = e.target.closest('[data-wide]');
  if (wide) { chat.wide = wide.dataset.wide === '1'; renderChat(); return; }
  const re = e.target.closest('[data-retry]');
  if (re) { retrySemantic(re.dataset.retry); renderChat(); return; }
  const fbBtn = e.target.closest('[data-fb]');
  if (fbBtn) { const m = chat.msgs[Number(fbBtn.dataset.i)], v = Number(fbBtn.dataset.fb); if (m) { m.fb = m.fb === v ? 0 : v; logUpdate(m, { fb: m.fb }); renderChat(); } return; }
  const act = e.target.closest('[data-ai]');
  if (!act) return;
  const k = act.dataset.ai;
  if (k === 'close') { ai.setOpen = false; renderSet(); renderChat(); $('chat-q').focus(); }
  else if (k === 'sem-on') { if (ai.embState === 'ready') { ai.semantic = true; renderSet(); } else loadEmbedder(); }
  else if (k === 'sem-off') { ai.semantic = false; renderSet(); }
  else if (k === 'gen-search') { ai.gen = 'search'; renderSet(); }
  else if (k === 'llm-on') { ai.model = $('ai-model').value; saveAI(); loadWebLLM(); }
  else if (k === 'log-on' || k === 'log-off') { ai.log = k === 'log-on'; saveAI(); renderSet(); }
  else if (k === 'log-save') downloadLog();
  else if (k === 'log-clear') { writeLog([]); renderSet(); toast('기록을 지웠어요'); }
  else if (k === 'server-on') {
    ai.server = $('ai-server').value.trim(); ai.serverModel = $('ai-server-model').value.trim(); saveAI();
    if (/^https?:\/\//.test(ai.server)) ai.gen = 'server'; else toast('서버 주소를 https://…/v1 형태로 넣어 주세요');
    renderSet();
  }
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !sheet.hidden) closeSheet(); });
window.__ansan = { rag, ai, chat, ask, readLog, retrySemantic };                      // 테스트·발표 시연용

route();
</script>
</body>
</html>
