<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>안산 청년 혜택 알리미</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet">
<style>
:root {
  /* 11/18 색 변경: 대표색 #321A88(딥 퍼플) + 보조색 #36A2C9(블루). 보조색은 흰 배경 글자 대비가 낮아 면·포인트에만 쓰고, 글자는 --secondary-ink */
  --page: #F3F2F8; --bg: #FFFFFF; --soft: #F6F6FA;
  --ink: #17181F; --ink2: #454856; --muted: #6E7281; --faint: #B4B7C3;
  --line: #ECECF3; --field: #D9DAE4;
  --primary: #321A88; --primary-press: #26136B; --primary-soft: #EEEBF8; --primary-soft2: #DCD5F1;
  --secondary: #36A2C9; --secondary-soft: #E3F3F9; --secondary-ink: #17708F;
  --hero: linear-gradient(120deg, #2A1478 0%, #321A88 40%, #3B47A6 72%, #36A2C9 110%);
  --dark: #1B1E29;
  --good: #0B7A5E; --good-bg: #DDF5EC;
  --soon: #8A5A00; --soon-bg: #FFF2CC; --soon-bar: #F5B83D;
  --check: #4B5263; --check-bg: #EEF0F5;
  --no: #C23B3B; --no-bg: #FDEBEB;
  --urgent: #D93D42;
  --shadow: 0 2px 10px rgba(50, 26, 136, .07);
  --font: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--page); color: var(--ink); font-family: var(--font); -webkit-text-size-adjust: 100%; }
body { font-size: 15px; line-height: 1.5; letter-spacing: -0.01em; word-break: keep-all; overflow-wrap: anywhere; }
a { color: var(--primary); }
button, input, select { font-family: inherit; color: inherit; letter-spacing: inherit; }
:focus-visible { outline: 2px solid var(--secondary); outline-offset: 2px; }
[hidden] { display: none !important; }
svg.i { fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; flex: none; }
h1, h2, h3 { text-wrap: balance; }
.num { font-variant-numeric: tabular-nums; }

.app { max-width: 440px; margin: 0 auto; min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; background: var(--bg); }
main { flex: 1; padding-bottom: 150px; }

/* 상단 바: 뒤로 · 워드마크 · 마감 알림 */
.top { position: sticky; top: 0; z-index: 4; display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; padding: 8px 12px; background: rgba(255, 255, 255, .95); }
.top-btn { position: relative; width: 44px; height: 44px; display: grid; place-items: center; border-radius: 12px; color: var(--ink); text-decoration: none; }
.top-btn .dot { position: absolute; top: 10px; right: 10px; width: 8px; height: 8px; border-radius: 50%; background: var(--urgent); border: 2px solid var(--bg); box-sizing: content-box; }
.wordmark { justify-self: center; display: inline-flex; align-items: center; gap: 7px; font-size: 18px; font-weight: 800; letter-spacing: -0.03em; color: var(--ink); text-decoration: none; }
.wordmark i { font-style: normal; color: var(--primary); }
.mark { width: 26px; height: 26px; border-radius: 8px; background: var(--hero); color: #fff; display: grid; place-items: center; }

.page-title { margin: 0; padding: 10px 20px 14px; font-size: 22px; line-height: 1.35; font-weight: 700; letter-spacing: -0.02em; }
.note { margin: 0; font-size: 12.5px; line-height: 1.55; color: var(--muted); }
.under { padding: 10px 20px 0; }

/* 요약 카드 */
.hero { position: relative; overflow: hidden; margin: 0 20px; padding: 18px; border-radius: 18px; background: var(--hero); color: #fff; display: flex; flex-direction: column; gap: 4px; }
.hero-label { font-size: 13px; opacity: .92; }
.hero-num { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
.hero-pill { align-self: flex-start; margin-top: 8px; padding: 6px 12px; border-radius: 14px; background: rgba(255, 255, 255, .2); font-size: 12.5px; display: flex; flex-wrap: wrap; gap: 2px 8px; align-items: center; max-width: 100%; }
.hero-pill span::after { content: '/'; margin-left: 8px; opacity: .6; }
.hero-pill a { color: #fff; font-weight: 700; text-underline-offset: 3px; padding: 4px 2px; margin: -4px 0; }
.hero-deco { position: absolute; right: -10px; top: -8px; width: 110px; height: 110px; color: #fff; opacity: .2; pointer-events: none; }

.promo { margin: 12px 20px 0; padding: 16px 18px; border-radius: 16px; background: var(--primary-soft); display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px 12px; align-items: center; }
.promo-text { display: flex; flex-direction: column; gap: 2px; }
.promo-text b { font-size: 15px; line-height: 1.45; }
.promo-text span { font-size: 13px; color: var(--ink2); }
.promo-n { font-size: 34px; font-weight: 800; color: var(--primary); line-height: 1; }
.promo .btn-sm { grid-column: 1 / -1; justify-self: start; }

/* 버튼 */
.btn { height: 52px; border-radius: 12px; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 16px; font-weight: 600; text-decoration: none; border: 0; cursor: pointer; }
.btn-primary { background: var(--primary); color: #fff; }
.btn-primary:hover { background: var(--primary-press); }
.btn-soft { background: var(--primary-soft); color: var(--primary); }
.btn-soft:hover { background: var(--primary-soft2); }
.btn-sm { height: 40px; padding: 0 18px; border-radius: 10px; border: 0; background: var(--primary); color: #fff; font-size: 14px; font-weight: 600; cursor: pointer; }
.btn-sm:hover { background: var(--primary-press); }

/* 필터 칩 */
.filters { display: flex; gap: 8px; padding: 16px 20px 2px; overflow-x: auto; white-space: nowrap; scrollbar-width: none; }
.filters::-webkit-scrollbar { display: none; }
.filters button { flex: none; height: 38px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--bg); box-shadow: var(--shadow); font-size: 13.5px; color: var(--ink2); display: inline-flex; align-items: center; gap: 5px; cursor: pointer; }
.filters button[aria-pressed="true"] { background: var(--primary); border-color: var(--primary); color: #fff; font-weight: 600; box-shadow: none; }
.filters .n { font-size: 12.5px; opacity: .8; }

/* 목록 */
.group-title { margin: 0; padding: 22px 20px 10px; font-size: 16px; font-weight: 700; display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 8px; }
.group-title small { font-size: 13px; font-weight: 400; color: var(--muted); }
.list { display: flex; flex-direction: column; gap: 10px; padding: 0 20px; }
.row { display: grid; grid-template-columns: 40px minmax(0, 1fr) 16px; gap: 12px; align-items: center; padding: 14px 10px 14px 14px; border-radius: 16px; background: var(--bg); border: 1px solid var(--line); box-shadow: var(--shadow); color: var(--ink); text-decoration: none; }
.row:hover { border-color: var(--primary-soft2); }
.row-ic { align-self: start; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; }
.row-body { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.row-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
.row-top b { font-size: 15px; font-weight: 600; line-height: 1.4; overflow-wrap: anywhere; }
.row-sub { font-size: 13px; line-height: 1.45; color: var(--muted); }
.row-why { margin-top: 4px; display: flex; gap: 5px; font-size: 12.5px; line-height: 1.45; color: var(--ink2); }
.row-why svg { margin-top: 2px; }
.row-chev { color: var(--faint); display: grid; }

/* 상태 색 */
.t-good { background: var(--good-bg); color: var(--good); }
.t-move { background: var(--primary-soft); color: var(--primary); }
.t-soon { background: var(--soon-bg); color: var(--soon); }
.t-check { background: var(--check-bg); color: var(--check); }
.t-no { background: var(--no-bg); color: var(--no); }
.c-good { color: var(--good); } .c-move { color: var(--primary); } .c-soon { color: var(--soon); } .c-check { color: var(--check); } .c-no { color: var(--no); }

.badge { display: inline-flex; align-items: center; gap: 4px; height: 24px; padding: 0 9px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.dday { flex: none; display: inline-flex; align-items: center; height: 24px; padding: 0 9px; border-radius: 999px; background: var(--primary-soft); color: var(--primary); font-size: 12px; font-weight: 700; white-space: nowrap; font-variant-numeric: tabular-nums; }
.dday.next { background: var(--secondary-soft); color: var(--secondary-ink); }
.dday.urgent { background: var(--urgent); color: #fff; }
.dday.quiet { background: var(--soft); color: var(--muted); font-weight: 500; }

.prog { margin-top: 6px; display: flex; flex-direction: column; gap: 6px; }
.prog-row { display: flex; justify-content: space-between; gap: 8px; font-size: 12.5px; color: var(--ink2); }
.prog-row b { font-weight: 600; color: var(--soon); font-variant-numeric: tabular-nums; white-space: nowrap; }
.bar { display: block; height: 8px; border-radius: 999px; background: var(--primary-soft); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--secondary), var(--primary)); }

details.fold { margin: 24px 20px 0; padding: 0 16px; border-radius: 16px; background: var(--bg); border: 1px solid var(--line); box-shadow: var(--shadow); }
details.fold + details.fold { margin-top: 12px; }
details.fold summary { min-height: 54px; display: flex; justify-content: space-between; align-items: center; font-size: 15px; font-weight: 700; cursor: pointer; list-style: none; }
details.fold summary::-webkit-details-marker { display: none; }
details.fold summary small { font-size: 13px; font-weight: 400; color: var(--muted); display: flex; align-items: center; gap: 4px; }
.fold-desc { margin: -4px 0 10px; font-size: 13px; line-height: 1.5; color: var(--muted); }
.fold-row { display: block; padding: 12px 0; border-top: 1px solid var(--line); color: var(--ink); text-decoration: none; }
.fold-row b { display: block; font-size: 14px; font-weight: 600; margin-bottom: 4px; }
.fold-row > span { display: flex; gap: 6px; font-size: 13px; line-height: 1.5; color: var(--no); }
.fold-row > span svg { margin-top: 3px; }
.fold-row.closed > span { color: var(--muted); }
.fold-meta { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }

/* 상세 */
.sum { margin: 0 20px; padding: 16px 18px; border-radius: 16px; background: var(--primary-soft); display: flex; flex-direction: column; gap: 6px; }
.sum-label { font-size: 12.5px; color: var(--ink2); }
.sum strong { font-size: 18px; line-height: 1.45; font-weight: 700; letter-spacing: -0.02em; }
.sum-meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.sum-meta .badge.t-move, .sum-meta .dday:not(.urgent):not(.next) { background: var(--bg); }
.segtabs { margin: 14px 20px 0; padding: 4px; border-radius: 12px; background: var(--bg); border: 1px solid var(--line); box-shadow: var(--shadow); display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; }
.segtabs button { height: 40px; border: 0; border-radius: 9px; background: transparent; font-size: 14px; color: var(--ink2); cursor: pointer; }
.segtabs button[aria-selected="true"] { background: var(--primary); color: #fff; font-weight: 600; }
.sec { margin: 12px 20px 0; padding: 18px 16px; border-radius: 16px; background: var(--bg); border: 1px solid var(--line); box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 12px; }
.sec h2 { margin: 0; font-size: 15px; font-weight: 700; }
.verdict { margin: 0; padding: 12px 14px; border-radius: 12px; font-size: 14.5px; line-height: 1.5; font-weight: 600; }
.checks { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.checks li { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 10px; padding: 11px 0; border-top: 1px solid var(--line); }
.checks li:first-child { border-top: 0; padding-top: 0; }
.checks li:last-child { padding-bottom: 0; }
.checks .ic { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; }
.checks b { display: block; font-size: 12.5px; font-weight: 600; color: var(--muted); }
.checks span { font-size: 14px; line-height: 1.5; }
.self { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.self li { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 10px; font-size: 14px; line-height: 1.5; }
.self .ic { width: 22px; height: 22px; display: grid; place-items: center; color: #D99A00; }
.callout { padding: 12px 14px; border-radius: 12px; font-size: 13.5px; line-height: 1.55; }
blockquote { margin: 0; padding: 14px 16px; border-radius: 12px; background: var(--primary-soft); font-size: 14px; line-height: 1.65; color: var(--ink2); }
blockquote b { display: block; margin-bottom: 4px; font-size: 13px; color: var(--primary); }
.src { align-self: flex-start; display: inline-flex; align-items: center; gap: 4px; padding: 6px 0; font-size: 14px; font-weight: 600; text-decoration: none; }
.kv { margin: 0; display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 10px 12px; font-size: 14px; line-height: 1.5; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; overflow-wrap: anywhere; }
.login-pill { display: inline-flex; align-items: center; gap: 3px; margin-left: 6px; padding: 1px 8px; border-radius: 999px; background: var(--check-bg); color: var(--check); font-size: 11.5px; font-weight: 600; vertical-align: 1px; }
.cta { padding: 16px 20px 0; display: flex; flex-direction: column; gap: 10px; }
.cta > p { margin: 0; text-align: center; font-size: 12px; line-height: 1.5; color: var(--muted); }
/* 11/24: 외부 신청 사이트는 첫 화면으로만 열리므로 로그인 → 검색 순서를 안내 */
.guide { padding: 14px 16px; border-radius: 14px; background: var(--secondary-soft); display: flex; flex-direction: column; gap: 6px; font-size: 13.5px; line-height: 1.55; color: var(--ink2); }
.guide-head { display: flex; align-items: center; gap: 6px; font-weight: 700; color: var(--ink); }
.guide-head svg { color: var(--secondary-ink); }
.guide ol { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 2px; }
.guide mark { background: var(--bg); color: var(--ink); font-weight: 600; padding: 0 4px; border-radius: 4px; }
.closed-box { padding: 14px 16px; border-radius: 14px; background: var(--soft); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 4px; font-size: 13.5px; line-height: 1.55; color: var(--ink2); }
.closed-box b { display: flex; align-items: center; gap: 6px; font-size: 14.5px; color: var(--ink); }
.toast { position: fixed; left: 50%; bottom: 100px; transform: translateX(-50%); z-index: 30; max-width: calc(100% - 40px); padding: 10px 16px; border-radius: 999px; background: var(--dark); color: #fff; font-size: 13.5px; box-shadow: 0 6px 16px rgba(0, 0, 0, .2); }

/* 내 조건 */
.intro { padding: 6px 20px 18px; display: flex; flex-direction: column; gap: 8px; }
.intro h1 { margin: 0; font-size: 22px; line-height: 1.4; font-weight: 700; letter-spacing: -0.02em; }
.intro h1 em { font-style: normal; color: var(--primary); }
.intro p { margin: 0; font-size: 14px; line-height: 1.55; color: var(--muted); }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tags span { padding: 4px 10px; border-radius: 999px; background: var(--primary-soft); color: var(--primary); font-size: 12px; font-weight: 600; }
.form { margin: 0 20px; display: flex; flex-direction: column; gap: 24px; }
.field { display: flex; flex-direction: column; gap: 8px; }
.field-label { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; font-size: 15px; font-weight: 600; }
.req { font-size: 12px; font-weight: 600; color: var(--primary); }
.optl { font-size: 12px; font-weight: 500; color: var(--muted); }
.help { margin: 0; font-size: 13px; line-height: 1.5; color: var(--muted); }
.ok { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 500; color: var(--good); }
.err { margin: 0; padding: 12px 14px; border-radius: 12px; background: var(--no-bg); color: var(--no); font-size: 13.5px; font-weight: 500; }
.input { width: 100%; height: 52px; padding: 0 14px; border: 1.5px solid var(--field); border-radius: 12px; background: var(--bg); font-size: 16px; }
.input:focus { border-color: var(--primary); outline: none; }
.opts { display: flex; flex-direction: column; gap: 10px; }
.opt-card { min-height: 54px; padding: 12px 16px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--bg); box-shadow: var(--shadow); display: flex; align-items: center; gap: 12px; font-size: 14.5px; text-align: left; cursor: pointer; }
.opt-card .radio { flex: none; width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid var(--field); background: var(--bg); }
.opt-card[aria-checked="true"] { border-color: var(--primary); background: var(--primary-soft); font-weight: 600; box-shadow: none; }
.opt-card[aria-checked="true"] .radio { border: 6px solid var(--primary); }
.check-row { display: flex; align-items: center; gap: 10px; min-height: 44px; font-size: 14px; cursor: pointer; }
.check-row input { width: 20px; height: 20px; margin: 0; accent-color: var(--primary); }
.seg { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.seg button { min-height: 48px; padding: 6px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--bg); box-shadow: var(--shadow); font-size: 13.5px; cursor: pointer; }
.seg button[aria-pressed="true"] { border-color: var(--primary); background: var(--primary-soft); color: var(--primary); font-weight: 600; box-shadow: none; }
.examples { margin: 20px 20px 0; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.examples button { height: 36px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--bg); box-shadow: var(--shadow); font-size: 13px; cursor: pointer; }
.privacy { margin: 14px 20px 0; padding: 14px 16px; border-radius: 14px; background: var(--secondary-soft); display: flex; gap: 10px; align-items: flex-start; font-size: 13px; line-height: 1.55; color: var(--ink2); }
.privacy svg { margin-top: 1px; color: var(--secondary-ink); }

/* 마감 캘린더 */
.cal-row { display: grid; grid-template-columns: 60px minmax(0, 1fr); gap: 12px; align-items: center; padding: 12px 14px 12px 12px; border-radius: 16px; background: var(--bg); border: 1px solid var(--line); box-shadow: var(--shadow); color: var(--ink); text-decoration: none; }
.cal-date { align-self: stretch; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 8px 0; border-radius: 12px; background: var(--primary-soft); }
.cal-date b { font-size: 16px; font-weight: 700; color: var(--primary); font-variant-numeric: tabular-nums; }
.cal-date span { font-size: 11.5px; color: var(--ink2); }
.cal-date.next { background: var(--secondary-soft); }
.cal-date.next b { color: var(--secondary-ink); }
.cal-date.urgent { background: var(--no-bg); }
.cal-date.urgent b { color: var(--urgent); }
.cal-date.quiet { background: var(--soft); }
.cal-date.quiet b { color: var(--ink2); }
.cal-body { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.cal-body h3 { margin: 0; font-size: 15px; line-height: 1.4; font-weight: 600; overflow-wrap: anywhere; }
.cal-meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.empty { margin: 0 20px; padding: 22px; border-radius: 16px; background: var(--soft); text-align: center; font-size: 14px; color: var(--muted); }

/* 하단 탭 · AI 버튼 · 시트 */
nav.tabs { position: fixed; bottom: 0; left: 0; right: 0; z-index: 5; }
nav.tabs div { max-width: 440px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); padding: 6px 0 10px; background: var(--bg); border-top: 1px solid var(--line); }
nav.tabs a { min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11.5px; font-weight: 500; color: var(--muted); text-decoration: none; }
nav.tabs a[aria-current="page"] { color: var(--primary); font-weight: 700; }
.fab-wrap { position: fixed; bottom: 84px; left: 0; right: 0; z-index: 6; pointer-events: none; }
.fab-wrap div { max-width: 440px; margin: 0 auto; padding: 0 20px; display: flex; justify-content: flex-end; }
.fab { pointer-events: auto; width: 56px; height: 56px; border-radius: 50%; border: 0; background: linear-gradient(135deg, #321A88 15%, #3B47A6 55%, #36A2C9 100%); color: #fff; display: grid; place-items: center; box-shadow: 0 6px 16px rgba(50, 26, 136, .36); cursor: pointer; }
.fab:hover { filter: brightness(1.08); }
.robot { fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.robot .fill { fill: currentColor; stroke: none; }
.sheet { position: fixed; inset: 0; z-index: 20; background: rgba(23, 20, 46, .45); display: flex; align-items: flex-end; justify-content: center; }

.chat-log { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 20px 12px; display: flex; flex-direction: column; gap: 12px; overscroll-behavior: contain; }
.msg { display: flex; gap: 8px; max-width: 100%; }
.msg.user { justify-content: flex-end; }

.msg-alt { margin-top: 8px; font-size: 13px; color: var(--ink2); }
.msg-alt summary { cursor: pointer; font-weight: 600; color: var(--primary); }
.msg-alt p { margin: 6px 0 0; line-height: 1.55; }
/* 11/24 2차: 답이 나온 길 보기 · 평가 버튼 · 의미 검색으로 다시 찾기 */
.msg-how { font-size: 12.5px; color: var(--ink2); }

@media (prefers-reduced-motion: no-preference) { .typing i { animation: blink 1.2s infinite; } .typing i:nth-child(2) { animation-delay: .2s; } .typing i:nth-child(3) { animation-delay: .4s; } }

.chat-chips button:hover { border-color: var(--primary-soft2); color: var(--primary); }
.sheet-input { flex: none; display: grid; grid-template-columns: minmax(0, 1fr) 44px; gap: 8px; padding: 0 20px; }

.ai-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; }
.ai-btn { height: 40px; padding: 0 14px; border-radius: 10px; border: 0; background: var(--primary); color: #fff; font-size: 13.5px; font-weight: 600; cursor: pointer; white-space: nowrap; }

const CAT_ICON = { '교육일자리': 'brief', '주거복지': 'home', '참여권리': 'people', '문화예술': 'star' };

};
const hostOf = (url) => { try { return new URL(url).hostname.replace(/^www\./, ''); } catch (e) { return ''; } };
// 검색어: 괄호·낫표 안 설명을 빼고 짧게 ('경기청년 역량강화 기회 지원(구직자 응시료 지원)' → '경기청년 역량강화 기회 지원')
const searchWord = (name) => name.replace(/\([^)]*\)|[「」『』'"]/g, ' ').replace(/\s+/g, ' ').trim();
function siteOf(url) {
  if (!url) return null;
  const host = hostOf(url);
  if (host === 'ansan.go.kr') return { name: '안산시청', login: false, ansan: true, host };
  return { ...(SITES[host] || { name: host, login: false }), host };
}

const badge = (status) => `<span class="badge t-${UI[status].cls}">${icon(UI[status].icon, 12)}${UI[status].label}</span>`;
function ddayBadge(rc) {
  if (rc.state === 'open') return `<span class="dday${rc.dday <= 7 ? ' urgent' : ''}">D-${rc.dday}</span>`;
  if (rc.state === 'upcoming') return `<span class="dday next">접수 D-${rc.dday}</span>`;
  if (rc.state === 'always') return '<span class="dday quiet">상시</span>';
  if (rc.state === 'closed') return '<span class="dday quiet">모집 마감</span>';
  return '<span class="dday quiet">공고 확인</span>';
}

function results() { return judgeAll(POLICIES, state.profile, TODAY); }
const byId = (id) => POLICIES.find((p) => p.id === id);
// 11/24: 모집이 끝난 사업은 목록에서 빼고 '모집 마감' 접힘 영역으로 (미충족은 원래 자리)
const isClosed = (r) => r.recruit.state === 'closed';

// '곧 충족' 진행 막대: 거주 시작일 → 충족일
function progressOf(r) {
  const p = byId(r.id), u = state.profile;
  if (!r.eligibleFrom || !u.ansanRegistered) return null;
  const res = p.residence;
  const start = res.type === 'R4' && u.gyeonggiBeforeAnsan && u.gyeonggiSinceDate ? u.gyeonggiSinceDate : u.ansanMoveInDate;
  const total = daysBetween(start, r.eligibleFrom), done = daysBetween(start, TODAY);
  const pct = Math.max(0, Math.min(100, Math.round(done / total * 100)));
  const label = res.minContinuousYears
    ? `${res.type === 'R4' ? '경기도' : '안산'} 거주 ${ym(yearsBetween(start, TODAY))} / ${res.minContinuousYears}년`
    : '나이 요건까지';
  return { pct, label };
}
const progressHTML = (r, prog) => `<span class="prog"><span class="prog-row"><span>${esc(prog.label)}</span><b>${dot(r.eligibleFrom)} 충족</b></span><span class="bar" aria-hidden="true"><i style="width:${prog.pct}%"></i></span></span>`;

function profileParts() {
  const u = state.profile, parts = [`만 ${ageOn(u.birthDate, TODAY)}세`];
  if (u.ansanRegistered) {
    parts.push(`안산 전입 ${ym(yearsBetween(u.ansanMoveInDate, TODAY))}`);
    if (u.ansanPriorYears > 0) parts.push(`이전 안산 거주 ${u.ansanPriorYears}년`);
    if (u.gyeonggiBeforeAnsan && u.gyeonggiSinceDate) parts.push(`경기도 전입 ${dot(u.gyeonggiSinceDate)}`);
  } else {
    parts.push('안산 전입신고 전');
    if (u.currentRegion) parts.push(u.currentRegion === 'gyeonggi' ? '주소 경기도' : '주소 경기도 밖');
    (u.lifeZones || []).forEach((z) => parts.push(`안산 소재 ${z}`));
  }
  return parts.map((c) => `<span>${esc(c)}</span>`).join('');
}

function row(r) {
  const p = byId(r.id), ui = UI[r.status];
  const why = r.status === 'eligible' ? r.checks[0].text : r.hint;
  const prog = r.status === 'eligible_from' ? progressOf(r) : null;
  return `<a class="row" href="#p-${r.id}">
    <span class="row-ic t-${ui.cls}">${icon(CAT_ICON[p.category] || 'star', 18)}</span>
    <span class="row-body">
      <span class="row-top"><b>${esc(p.name)}</b>${ddayBadge(r.recruit)}</span>
      <span class="row-sub">${esc(p.benefit)}</span>
      ${prog ? progressHTML(r, prog) : `<span class="row-why">${icon(ui.icon, 13, 'c-' + ui.cls)}<span>${esc(why)}</span></span>`}
    </span>
    <span class="row-chev">${icon('right', 16)}</span>
  </a>`;
}

/* ---------- 결과 화면 ---------- */
function viewResults() {
  const all = results();
  const closed = all.filter((r) => isClosed(r) && r.status !== 'ineligible');
  const groups = groupByStatus(all.filter((r) => !isClosed(r) || r.status === 'ineligible'));
  const counts = Object.fromEntries(Object.entries(groups).map(([k, v]) => [k, v.length]));
  counts.closed = closed.length;
  const order = ['eligible', 'eligible_if_move_in', 'eligible_from', 'check'];
  const show = (s) => state.filter === 'all' || state.filter === s;
  const chipBtn = (key, label) => `<button type="button" data-filter="${key}" aria-pressed="${state.filter === key}">${label}${key !== 'all' ? ` <span class="n">${counts[key]}</span>` : ''}</button>`;

  let html = `
  <h1 class="page-title">청년 혜택</h1>
  <section class="hero" aria-label="판정 요약">
    <svg class="i hero-deco" viewBox="0 0 16 16" aria-hidden="true" style="stroke-width:1.1"><path d="M4 11V7.5a4 4 0 0 1 8 0V11l1 1.5H3z"/><path d="M6.5 14a1.6 1.6 0 0 0 3 0"/></svg>
    <span class="hero-label">${state.isExample ? '예시 프로필(도현)이' : '내 조건으로'} 지금 신청할 수 있는 혜택</span>
    <strong class="hero-num">${counts.eligible}개의 혜택을 찾았어요</strong>
    <div class="hero-pill">${profileParts()}<a href="#input">수정</a></div>
  </section>
  <div class="under"><p class="note">안산시 청년 사업 ${POLICIES.length}건을 ${Number(TODAY.slice(5, 7))}월 ${Number(TODAY.slice(8))}일 기준으로 맞춰 봤어요.${counts.closed ? ` 이번 모집이 끝난 ${counts.closed}건은 맨 아래 '모집 마감'에 모았어요.` : ''}${state.isExample ? ' 지금은 예시(ERICA 3학년, 2025년 2월 안산 전입)예요. <a href="#input">내 조건 넣기</a>' : ''}</p></div>`;

  if (counts.eligible_if_move_in > 0) {
    html += `<section class="promo">
      <div class="promo-text"><b>전입신고만 하면 ${counts.eligible_if_move_in}건을 더 받을 수 있어요</b><span>안산으로 주민등록을 옮기면 바로 자격이 생겨요.</span></div>
      <span class="promo-n num" aria-hidden="true">+${counts.eligible_if_move_in}</span>
      ${state.filter !== 'eligible_if_move_in' ? '<button type="button" class="btn-sm" data-filter="eligible_if_move_in">어떤 혜택인지 보기</button>' : ''}
    </section>`;
  }

  html += `<div class="filters" role="group" aria-label="판정 결과 필터">
    ${chipBtn('all', '전체')}
    ${order.filter((s) => counts[s]).map((s) => chipBtn(s, UI[s].label)).join('')}
    ${counts.ineligible ? chipBtn('ineligible', '미충족') : ''}
    ${counts.closed ? chipBtn('closed', '모집 마감') : ''}
  </div>`;

  for (const s of order) {
    if (!counts[s] || !show(s)) continue;
    html += `<h2 class="group-title">${UI[s].label} <small>${UI[s].sub} · ${counts[s]}건</small></h2><div class="list">${groups[s].map(row).join('')}</div>`;
  }
  if (state.filter !== 'all' && state.filter !== 'closed' && state.filter !== 'ineligible' && !counts[state.filter]) {
    html += '<p class="empty" style="margin-top:16px">지금 모집 중인 사업이 없어요.</p>';
  }
  if (counts.ineligible && show('ineligible')) {
    html += `<details class="fold"${state.filter === 'ineligible' ? ' open' : ''}><summary>미충족 ${counts.ineligible}건<small>왜 안 되는지 보기${icon('down')}</small></summary>
      ${groups.ineligible.map((r) => `<a class="fold-row" href="#p-${r.id}"><b>${esc(byId(r.id).name)}</b><span>${icon('x')}${esc(r.hint)}</span></a>`).join('')}
    </details>`;
  }
  if (counts.closed && show('closed')) {
    const rank = { eligible: 0, eligible_if_move_in: 1, eligible_from: 2, check: 3 };
    closed.sort((a, b) => rank[a.status] - rank[b.status]);
    html += `<details class="fold"${state.filter === 'closed' ? ' open' : ''}><summary>모집 마감 ${counts.closed}건<small>다음 모집 일정 보기${icon('down')}</small></summary>
      <p class="fold-desc">이번 모집은 끝났어요. 대부분 매년 다시 열리니 다음 모집 때 신청하세요.</p>
      ${closed.map((r) => { const p = byId(r.id); return `<a class="fold-row closed" href="#p-${r.id}"><b>${esc(p.name)}</b><div class="fold-meta">${badge(r.status)}${p.apply.end ? `<span class="dday quiet">${dot(p.apply.end)} 마감</span>` : ''}</div><span>${icon('cal')}${esc(p.apply.periodText || '다음 공고는 안산시청 원문에서 확인')}</span></a>`; }).join('')}
    </details>`;
  }
  return html;
}

/* ---------- 상세 화면 ---------- */
function gcalLink(p, r) {
  const rc = r.recruit, isOpen = rc.state === 'open';
  const day = isOpen ? p.apply.end : p.apply.start;
  if (!day) return '';
  const next = addDays(day, 1).replaceAll('-', '');
  const text = `${isOpen ? '[마감]' : '[접수 시작]'} ${p.name}`;
  const q = new URLSearchParams({ action: 'TEMPLATE', text, dates: `${day.replaceAll('-', '')}/${next}`, details: `${p.benefit}\n${p.sourceUrl}` });
  return `https://calendar.google.com/calendar/render?${q}`;
}

// 하단 버튼 영역: 마감 / 외부 신청 사이트 / 안산시청 공고 세 경우
function ctaHTML(p, r) {
  const site = siteOf(p.apply.url);
  const notice = (cls, label) => `<a class="btn ${cls}" href="${esc(p.sourceUrl)}" target="_blank" rel="noopener">${label}${icon('out', 16)}</a>`;
  const foot = '<p>공고문 원문 조건으로 판정해요. 최종 선정은 담당 기관이 확인해요.</p>';
  if (isClosed(r)) {
    return `<div class="closed-box"><b>${icon('info', 16)}이번 모집은 ${p.apply.end ? `${dot(p.apply.end)}에 ` : ''}마감됐어요</b>
      ${p.apply.periodText ? `<span>${esc(p.apply.periodText)}</span>` : ''}<span>다음 공고가 올라오면 이 화면에 다시 표시돼요.</span></div>
      ${notice('btn-soft', '안산시청 공고 원문 보기')}${foot}`;
  }
  if (site && !site.ansan) {
    return `<div class="guide">
        <span class="guide-head">${icon('info', 16)}신청 사이트(${esc(site.name)}) 첫 화면이 열려요</span>
        <ol>${site.login ? '<li>로그인해 주세요. 로그인하면 첫 화면으로 돌아가요</li>' : ''}<li>검색창에 <mark>${esc(searchWord(p.name))}</mark> 검색</li><li>못 찾으면 아래 안산시청 공고 원문의 신청 안내를 보세요</li></ol>
        <span class="note">버튼을 누르면 검색어가 복사돼요.</span>
      </div>
      <a class="btn btn-primary" href="${esc(p.apply.url)}" target="_blank" rel="noopener" data-copy="${esc(searchWord(p.name))}">검색어 복사하고 ${esc(site.name)} 열기${icon('out', 16)}</a>
      ${notice('btn-soft', '안산시청 공고 원문 보기')}${foot}`;
  }
  if (site && site.ansan && p.apply.url !== p.sourceUrl) {
    return `<a class="btn btn-primary" href="${esc(p.apply.url)}" target="_blank" rel="noopener">안산시청에서 신청하기${icon('out', 16)}</a>${notice('btn-soft', '안산시청 공고 원문 보기')}${foot}`;
  }
  return `${notice('btn-primary', '안산시청 공고 보기')}${foot}`;
}

function viewDetail(id) {
  const p = byId(id);
  if (!p) return '<h1 class="page-title">혜택 상세</h1><p class="empty">해당 사업을 찾을 수 없어요.</p>';
  const r = judgePolicy(p, state.profile, TODAY), prog = r.status === 'eligible_from' ? progressOf(r) : null;
  const ui = UI[r.status], tab = state.detailTab, site = siteOf(p.apply.url);
  const verdict = {
    eligible: '거주·나이 조건을 모두 채웠어요.',
    eligible_if_move_in: r.hint,
    eligible_from: `${dot(r.eligibleFrom)}부터 자격이 생겨요.`,
    check: r.hint,
    ineligible: r.hint,
  }[r.status];
  const period = p.apply.start || p.apply.end
    ? `<span class="num">${dot(p.apply.start) || '?'} ~ ${dot(p.apply.end) || ''}</span>${isClosed(r) ? ' (마감)' : ''}` : '공고 확인';
  const cal = ['open', 'upcoming'].includes(r.recruit.state) ? gcalLink(p, r) : '';
  const tabBtn = (key, label) => `<button type="button" role="tab" id="tab-${key}" aria-selected="${tab === key}" aria-controls="tab-panel" data-dtab="${key}">${label}</button>`;

  const panels = {
    fit: `
    <section class="sec">
      <h2>나는 받을 수 있을까?</h2>
      <p class="verdict t-${ui.cls}">${esc(verdict)}</p>
      ${prog ? progressHTML(r, prog) : ''}
      <ul class="checks">
        ${r.checks.map((c) => { const [ic, cls] = CHECK_ICON[c.state]; return `<li><span class="ic t-${cls}">${icon(ic, 13)}</span><div><b>${esc(c.label)}</b><span>${esc(c.text)}</span></div></li>`; }).join('')}
      </ul>
      ${r.bonus ? `<div class="callout t-soon"><b>가점</b> · ${esc(r.bonus)}</div>` : ''}
    </section>
    ${r.selfCheck.length ? `<section class="sec">
      <h2>직접 확인해야 하는 조건</h2>
      <ul class="self">${r.selfCheck.map((c) => `<li><span class="ic">${icon('warn', 16)}</span><span>${esc(c)}</span></li>`).join('')}</ul>
      <p class="note">소득·취업·학적 조건은 아직 판정하지 않아요. 공고문과 비교해 직접 확인해 주세요.</p>
    </section>` : ''}`,
    proof: `
    <section class="sec">
      <h2>공고 원문 근거</h2>
      <blockquote><b>공고문에 이렇게 적혀 있어요</b>${esc(p.evidence)}</blockquote>
      ${p.residence.basisAssumed ? '<p class="note">원문에 기준일이 없어 신청일 기준으로 판정했어요.</p>' : ''}
      <a class="src" href="${esc(p.sourceUrl)}" target="_blank" rel="noopener">안산시청 원문 보기${icon('out')}</a>
    </section>`,
    apply: `
    <section class="sec">
      <h2>신청 방법</h2>
      <dl class="kv">
        <dt>접수 기간</dt><dd>${period}</dd>
        ${p.apply.periodText ? `<dt>안내</dt><dd>${esc(p.apply.periodText)}</dd>` : ''}
        <dt>신청하는 곳</dt><dd>${site ? `${esc(site.name)}${site.login ? `<span class="login-pill">${icon('lock', 11)}로그인 필요</span>` : ''}` : '공고문에서 확인'}</dd>
        <dt>분야</dt><dd>${esc(p.category)}</dd>
      </dl>
      ${cal ? `<a class="btn btn-soft" href="${esc(cal)}" target="_blank" rel="noopener">${icon('cal', 16)}구글 캘린더에 ${r.recruit.state === 'open' ? '마감일' : '접수 시작일'} 넣기</a>` : ''}
    </section>`,
  };

  return `
  <h1 class="page-title">${esc(p.name)}</h1>
  <section class="sum">
    <span class="sum-label">${esc(p.category)} · 혜택</span>
    <strong>${esc(p.benefit)}</strong>
    <div class="sum-meta">${badge(r.status)}${ddayBadge(r.recruit)}</div>
  </section>
  <div class="segtabs" role="tablist" aria-label="상세 정보">${tabBtn('fit', '내 자격')}${tabBtn('proof', '공고 근거')}${tabBtn('apply', '신청 방법')}</div>
  <div id="tab-panel" role="tabpanel" aria-labelledby="tab-${tab}">${panels[tab]}</div>
  <div class="cta">${ctaHTML(p, r)}</div>`;
}

/* ---------- 마감 캘린더 ---------- */
function viewCalendar() {
  const all = results();
  const rs = all.filter((r) => r.status !== 'ineligible' && ['open', 'upcoming'].includes(r.recruit.state));
  const key = (r) => { const p = byId(r.id); return r.recruit.state === 'open' ? p.apply.end : p.apply.start; };
  rs.sort((a, b) => key(a).localeCompare(key(b)));
  const always = all.filter((r) => r.recruit.state === 'always' && ['eligible', 'eligible_if_move_in'].includes(r.status));
  const calRow = (r) => {
    const p = byId(r.id), d = key(r), open = r.recruit.state === 'open';
    return `<a class="cal-row" href="#p-${r.id}">
      <div class="cal-date${open ? (r.recruit.dday <= 7 ? ' urgent' : '') : ' next'}"><b>${md(d)}</b><span>${open ? '마감' : '접수 시작'}</span></div>
      <div class="cal-body"><h3>${esc(p.name)}</h3><div class="cal-meta">${badge(r.status)}${ddayBadge(r.recruit)}</div></div>
    </a>`;
  };
  return `
  <h1 class="page-title">마감 캘린더</h1>
  <section class="intro"><p>지금 접수 중이거나 곧 열리는 사업이에요. 미충족은 뺐어요. 상세 화면의 신청 방법에서 구글 캘린더에 넣을 수 있어요.</p></section>
  ${rs.length ? `<div class="list">${rs.map(calRow).join('')}</div>` : '<p class="empty">지금 접수 중인 사업이 없어요.</p>'}
  ${always.length ? `<h2 class="group-title">상시 신청 <small>언제든 신청할 수 있어요 · ${always.length}건</small></h2>
    <div class="list">${always.map((r) => `<a class="cal-row" href="#p-${r.id}"><div class="cal-date quiet"><b>상시</b><span>신청</span></div><div class="cal-body"><h3>${esc(byId(r.id).name)}</h3><div class="cal-meta">${badge(r.status)}</div></div></a>`).join('')}</div>` : ''}`;
}

/* ---------- 내 조건 입력 ---------- */
function viewInput() {
  const d = state.draft || (state.draft = { ...state.profile, lifeZones: [...(state.profile.lifeZones || [])] });
  const reg = d.ansanRegistered === true;
  const age = d.birthDate ? ageOn(d.birthDate, TODAY) : null;
  const zones = d.lifeZones || [];
  const zoneBtn = (z, label) => `<button type="button" data-zone="${z}" aria-pressed="${zones.includes(z)}">${label}</button>`;
  const regionBtn = (v, label) => `<button type="button" data-region="${v}" aria-pressed="${(d.currentRegion || '') === v}">${label}</button>`;
  const regCard = (v, on, label) => `<button type="button" class="opt-card" role="radio" aria-checked="${on}" data-reg="${v}"><span class="radio" aria-hidden="true"></span>${label}</button>`;
  return `
  <section class="intro">
    <h1>받을 수 있는 <em>혜택만</em><br>골라 드릴게요</h1>
    <p>생년월일과 안산 전입일을 알려 주면 공고문의 거주·나이 조건과 하나씩 맞춰 볼게요.</p>
    <div class="tags"><span>필수 3가지</span><span>약 1분</span><span>로그인 없음</span></div>
  </section>

  <form class="form" id="profile-form" novalidate>
    <div class="field">
      <label class="field-label" for="birthDate">생년월일 <span class="req">필수</span></label>
      <input class="input" id="birthDate" type="date" value="${esc(d.birthDate || '')}" max="${TODAY}">
      ${age != null ? `<span class="help">만 ${age}세로 계산해요</span>` : ''}
    </div>

    <div class="field">

   역할 분담: 판정은 judge.js, 검색·답 조립은 rag.js, 이 부분은 화면과 모델 연결만 맡는다.

                     server: OpenAI 호환 서버 주소로 요청(발표 때 Colab 등)
   모델이 만든 답은 숫자가 자료에 있는지 검사하고, 통과하지 못하면 검색 답변을 대신 보여 준다. */

const saveAI = () => { try { localStorage.setItem(AI_KEY, JSON.stringify({ model: ai.model, server: ai.server, serverModel: ai.serverModel, log: ai.log })); } catch (e) { /* 저장 못 해도 동작 */ } };

/* ----- 모델 연결 ----- */
async function loadWebLLM() {
  if (!navigator.gpu) { ai.llmState = 'error'; ai.llmMsg = '이 브라우저는 WebGPU를 지원하지 않아요. PC 크롬·엣지 최신 버전에서 켜 주세요.'; renderSet(); return; }
  ai.llmState = 'loading'; ai.llmPct = 0; ai.llmMsg = '모델을 준비하고 있어요'; renderSet();
  try {
    const webllm = await import(WEBLLM_URL);
    ai.llm = await webllm.CreateMLCEngine(ai.model, { initProgressCallback: (p) => { ai.llmPct = Math.round((p.progress || 0) * 100); ai.llmMsg = `모델을 내려받는 중 ${ai.llmPct}%`; renderSet(); } });
    ai.llmState = 'ready'; ai.gen = 'webllm'; ai.llmMsg = ''; saveAI();
  } catch (e) { ai.llm = null; ai.llmState = 'error'; ai.llmMsg = '모델을 불러오지 못했어요. ' + (e && e.message ? e.message : ''); }
  renderSet();
}
async function loadEmbedder() {
  if (!denseIx) return;
  ai.embState = 'loading'; ai.embPct = 0; ai.embMsg = '검색 모델을 준비하고 있어요'; renderSet();
  try {
    const tf = await import(TFJS_URL);
    const extract = await tf.pipeline('feature-extraction', denseIx.model, { dtype: denseIx.dtype, model_file_name: denseIx.file,
      progress_callback: (p) => { if (p.status === 'progress' && String(p.file || '').endsWith('.onnx')) { const v = Math.round(p.progress || 0); if (v !== ai.embPct) { ai.embPct = v; ai.embMsg = `검색 모델을 내려받는 중 ${v}%`; renderSet(); const b = document.querySelector('#chat-log .retry'); if (b) b.textContent = ai.embMsg; } } } });
    ai.emb = async (text) => (await extract(denseIx.queryPrefix + text, { pooling: 'mean', normalize: true })).data;
    await ai.emb('준비');
    ai.embState = 'ready'; ai.semantic = true; ai.embMsg = '';
  } catch (e) { ai.emb = null; ai.semantic = false; ai.embState = 'error'; ai.embMsg = '검색 모델을 불러오지 못했어요. ' + (e && e.message ? e.message : ''); }
  renderSet();
}
// 모델이 내놓는 글자를 조각조각 돌려준다 (브라우저 모델·서버 공통)
async function* llmStream(messages, extra = {}) {
  const opts = { messages, stream: true, temperature: 0.2, max_tokens: 320, ...extra };
  if (ai.gen === 'webllm') {
    if (/Qwen3/.test(ai.model)) opts.extra_body = { enable_thinking: false };
    const stream = await ai.llm.chat.completions.create(opts);
    for await (const ch of stream) { const t = ch.choices && ch.choices[0] && ch.choices[0].delta && ch.choices[0].delta.content; if (t) yield t; }
    return;
  }
  const res = await fetch(ai.server.replace(/\/+$/, '') + '/chat/completions', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ ...opts, model: ai.serverModel || 'default' }) });
  if (!res.ok || !res.body) throw new Error('HTTP ' + res.status);
  const reader = res.body.getReader(), dec = new TextDecoder();
  let buf = '';
  for (;;) {
    const { done, value } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });
    let i;
    while ((i = buf.indexOf('\n')) >= 0) {
      const line = buf.slice(0, i).trim(); buf = buf.slice(i + 1);
      if (!line.startsWith('data:')) continue;
      const data = line.slice(5).trim();
      if (data === '[DONE]') return;
      try { const t = JSON.parse(data).choices[0].delta.content; if (t) yield t; } catch (e) { /* 조각이 덜 온 줄은 건너뜀 */ }
    }
  }
}

function srcHTML(s) {
  const links = (s.policyId ? `<a href="#p-${s.policyId}">상세 화면${icon('right', 12)}</a>` : '') + (s.url ? `<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.sourceLabel)} 원문${icon('out', 12)}</a>` : '');
  return `<div class="src-card"><b>${icon('doc', 13)}<span>${esc(s.label)}</span></b>${s.quote ? `<q>“${esc(s.quote)}”</q>` : ''}${links ? `<div class="src-links">${links}</div>` : ''}</div>`;
}
// 답 종류 표시: 무엇을 보여 주는지 그대로 적는다 (모델이 쓴 글이면 'AI 생성')
const KIND_TAG = { policy: '찾은 공고 내용', help: '도움말', list: '목록', judge: '판정 결과', compare: '나란히 보기', candidates: '후보 제시' };
const unitName = (k) => { const p = byId(k); if (p) return shortName(p.name); const c = CORPUS.chunks.find((x) => x.id === k); return c ? c.title : k; };
// 답이 나온 길 (발표·점검용): 어떤 규칙·검색으로 이 답이 나왔는지
function howHTML(m) {
  const d = m.a && m.a.debug;
  if (!d || !d.route) return '';
  const rows = [['답이 나온 길', d.route]];
  if (d.mode) rows.push(['검색 방식', d.mode === 'dense' ? '의미 검색 (문장 임베딩)' : '낱말 검색 (BM25)']);
  if (d.top && d.top.length) rows.push(['검색 상위', d.top.map(([k], i) => `${i + 1}. ${unitName(k)}`).join(' / ')]);
  if (d.matched && d.matched.length) rows.push(['겹친 낱말', d.matched.join(', ')]);
  if (d.trust) rows.push(['확신', { single: '바로 답함', cand: '후보로 제시', none: '못 찾음' }[d.trust] + (d.z != null ? ` (1위가 뚜렷한 정도 z=${d.z})` : '')]);
  if (m.a.llm && m.a.llm.wide && m.gen) rows.push(['모델에 준 자료', '그 사업의 항목 전부 (묻는 항목을 정하지 못해서)']);
  if (m.gen && m.gen.check) rows.push(['자료로 답할 수 있나 (AI 판단)', { yes: '예', no: '아니오 → 지어내지 않고 안내만 함', unknown: `알 수 없음(${m.gen.checkRaw || '빈 답'}) → 그대로 답함`, error: '확인 실패 → 그대로 답함' }[m.gen.check]]);
  if (m.gen && m.gen.state !== 'abstain') rows.push(['문장 정리', m.gen.state === 'done' ? `${m.gen.model} · 숫자·한국어 검사 통과` : m.gen.state === 'fail' ? `${m.gen.model} → 검사에 걸려 찾은 내용으로 대체` : m.gen.model]);
  return `<details class="msg-how"><summary>어떻게 찾았나요?</summary><dl>${rows.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}</dl></details>`;
}
function msgHTML(m, i) {
  if (m.role === 'user') return `<div class="msg user"><div class="msg-b">${esc(m.text)}</div></div>`;
  const a = m.a, g = m.gen;
  const byModel = g && ['run', 'done', 'check', 'abstain'].includes(g.state);
  const tag = g && g.state === 'abstain' ? `AI 판단 · ${esc(g.model)}` : byModel ? `AI 생성 · ${esc(g.model)}` : (a && !a.abstain ? (KIND_TAG[a.kind] || '') : '');
  const typing = (label) => `<span class="typing" aria-label="${label}"><i></i><i></i><i></i></span>`;
  const text = !byModel ? esc(m.text) : g.state === 'check' ? typing('찾은 자료로 답할 수 있는지 확인하는 중') : g.text ? esc(g.text) : typing('답을 쓰는 중');
  const seen = new Set();
  const srcs = a ? a.sources.filter((s) => { const k = s.policyId || s.chunkId; if (seen.has(k) || seen.size >= 2) return false; seen.add(k); return true; }) : [];
  // 낱말 검색으로 못 찾았거나 후보만 나온 마지막 답에는 '의미 검색으로 다시 찾기'를 붙인다
  const last = i === chat.msgs.length - 1, q = last && chat.msgs[i - 1] ? chat.msgs[i - 1].text : '';
  const retry = last && a && denseIx && !ai.semantic && (a.kind === 'candidates' || a.reason === 'no_match')
    ? `<button type="button" class="retry" data-retry="${esc(q)}" ${ai.embState === 'loading' ? 'disabled' : ''}>${ai.embState === 'loading' ? esc(ai.embMsg) : `의미 검색으로 다시 찾기${ai.embState === 'ready' ? '' : ` (${denseIx.downloadMB || 110}MB 내려받기)`}`}</button>` : '';
  const fb = ai.log && m.logId && a && a.kind !== 'meta' && !chat.busy ? `<button type="button" data-fb="1" data-i="${i}" aria-pressed="${m.fb === 1}">도움 됐어요</button><button type="button" data-fb="-1" data-i="${i}" aria-pressed="${m.fb === -1}">아니에요</button>` : '';
  return `<div class="msg bot"><span class="bubble-ic" aria-hidden="true">${robot(18)}</span><div class="msg-col">
    <div class="msg-b">${tag ? `<span class="msg-tag">${tag}</span>` : ''}<span class="msg-text">${text}</span>
      ${g && g.warn ? `<p class="msg-warn">${icon('warn', 13)}<span>${esc(g.warn)}</span></p>` : ''}
      ${g && (g.state === 'done' || g.state === 'abstain') ? `<details class="msg-alt"><summary>찾은 공고 내용 그대로 보기</summary><p>${esc(m.text)}</p></details>` : ''}</div>
    ${a && a.cards.length ? `<div class="minis">${a.cards.slice(0, a.kind === 'list' ? 10 : 6).map(miniHTML).join('')}</div>` : ''}
    ${srcs.length ? `<div class="srcs"><span class="srcs-h">근거</span>${srcs.map(srcHTML).join('')}</div>` : ''}
    ${retry || fb ? `<div class="msg-acts">${retry}${fb}</div>` : ''}
    ${a ? howHTML(m) : ''}
  </div></div>`;
}
function renderChat() {
  const log = $('chat-log'), pid = pageId();
  log.innerHTML = msgHTML({ role: 'bot', text: WELCOME }) + chat.msgs.map(msgHTML).join('');
  log.scrollTop = log.scrollHeight;
  const sc = $('chat-scope');
  sc.hidden = !pid;
  if (pid) sc.innerHTML = chat.wide ? '<span>전체 사업에서 찾는 중이에요</span><button type="button" data-wide="0">이 공고로 물어보기</button>'
    : `<span>지금 보는 공고 <b>${esc(shortName(byId(pid).name))}</b>에 대해 답해요</span><button type="button" data-wide="1">전체에서 찾기</button>`;
  $('chat-chips').innerHTML = chipsFor().map((q) => `<button type="button" data-q="${esc(q)}">${esc(q)}</button>`).join('');
  $('chat-send').disabled = chat.busy;
}
function renderSet() {
  const box = $('chat-set'), btn = $('chat-set-btn');
  btn.setAttribute('aria-expanded', String(ai.setOpen));
  box.hidden = !ai.setOpen;
  box.parentElement.classList.toggle('set-open', ai.setOpen);
  if (!ai.setOpen) return;
  const on = (v) => (v ? '<span class="on">켜짐</span>' : '');
  const prog = (state, pct, msg) => (state === 'loading' ? `<span class="bar" aria-hidden="true"><i style="width:${pct}%"></i></span><span class="ai-msg" role="status">${esc(msg)}</span>` : state === 'error' ? `<span class="ai-msg err" role="alert">${esc(msg)}</span>` : '');
  box.innerHTML = `
    <h3>검색 방식</h3>
    <div class="ai-opt" data-on="${!ai.semantic}"><div class="ai-opt-h"><b>낱말 검색</b>${on(!ai.semantic)}</div><p>질문의 낱말이 들어 있는 공고를 찾아요. 내려받기 없이 바로 돼요. 사업 이름이나 "월세" 같은 낱말로 물을 때 잘 맞아요.</p>
      ${ai.semantic ? '<button type="button" class="ai-btn ghost" data-ai="sem-off">낱말 검색으로 바꾸기</button>' : ''}</div>
    ${denseIx ? `<div class="ai-opt" data-on="${ai.semantic}"><div class="ai-opt-h"><b>의미 검색</b>${on(ai.semantic)}</div><p>"집세가 부담돼요"처럼 바꿔 말해도 찾아요. 검색 모델 ${denseIx.downloadMB || 110}MB를 한 번 내려받아요.</p>
      ${ai.semantic ? '' : `<button type="button" class="ai-btn" data-ai="sem-on" ${ai.embState === 'loading' ? 'disabled' : ''}>${ai.embState === 'ready' ? '의미 검색 켜기' : '내려받고 켜기'}</button>`}${prog(ai.embState, ai.embPct, ai.embMsg)}</div>` : ''}
    <h3>답변 방식</h3>
    <div class="ai-opt" data-on="${ai.gen === 'search'}"><div class="ai-opt-h"><b>검색 답변</b>${on(ai.gen === 'search')}</div><p>찾은 공고 내용을 그대로 보여 줘요. 공고에 없는 세부 내용(지급일·제출 서류 등)을 물으면 가까운 항목을 대신 보여 줄 수 있어요.</p>
      ${ai.gen !== 'search' ? '<button type="button" class="ai-btn ghost" data-ai="gen-search">검색 답변으로 바꾸기</button>' : ''}</div>
    <div class="ai-opt" data-on="${ai.gen === 'webllm'}"><div class="ai-opt-h"><b>브라우저 AI</b>${on(ai.gen === 'webllm')}</div><p>이 기기 안에서 소형 언어모델이 먼저 '찾은 자료로 답할 수 있는지' 확인하고, 답할 수 있을 때만 짧게 정리해요. PC 크롬 권장, 처음에 모델을 내려받아요.</p>
      <div class="ai-row"><select id="ai-model" aria-label="모델 선택" ${ai.llmState === 'loading' ? 'disabled' : ''}>${LLM_MODELS.map((m) => `<option value="${m.id}" ${m.id === ai.model ? 'selected' : ''}>${m.label} · 내려받기 약 ${m.dl}GB</option>`).join('')}</select>
      <button type="button" class="ai-btn" data-ai="llm-on" ${ai.llmState === 'loading' ? 'disabled' : ''}>${ai.gen === 'webllm' ? '다시 불러오기' : '켜기'}</button></div>${prog(ai.llmState, ai.llmPct, ai.llmMsg)}</div>
    <div class="ai-opt" data-on="${ai.gen === 'server'}"><div class="ai-opt-h"><b>서버 연결</b>${on(ai.gen === 'server')}</div><p>OpenAI 호환 주소(…/v1)를 넣으면 그 서버의 모델이 같은 순서(답할 수 있는지 확인 → 정리)로 답해요. 질문과 찾은 공고 내용이 그 서버로 전송돼요.</p>
      <input id="ai-server" type="url" inputmode="url" placeholder="https://….trycloudflare.com/v1" value="${esc(ai.server)}" aria-label="서버 주소">
      <div class="ai-row"><input id="ai-server-model" type="text" placeholder="모델 이름 (예: exaone3.5:2.4b)" value="${esc(ai.serverModel)}" aria-label="모델 이름">
      <button type="button" class="ai-btn" data-ai="server-on">연결</button></div></div>
    <h3>사용자 테스트</h3>
    <div class="ai-opt" data-on="${ai.log}"><div class="ai-opt-h"><b>질문 기록</b>${on(ai.log)}</div><p>질문, 답이 나온 길, 평가(도움 됐어요 / 아니에요)를 이 기기에만 모아요. 내 조건(생년월일·전입일)은 넣지 않고, '내려받기'를 눌러야 파일로 나와요. 지금 ${readLog().length}건.</p>
      <div class="ai-row"><button type="button" class="ai-btn${ai.log ? ' ghost' : ''}" data-ai="${ai.log ? 'log-off' : 'log-on'}">${ai.log ? '기록 끄기' : '기록 켜기'}</button><button type="button" class="ai-btn ghost" data-ai="log-save">내려받기</button></div>
      ${readLog().length ? '<button type="button" class="ai-btn ghost" data-ai="log-clear">기록 지우기</button>' : ''}</div>
    <button type="button" class="ai-btn ghost" data-ai="close">대화로 돌아가기</button>`;
}

/* ----- 질문 처리 ----- */
async function ask(text) {
  const q = String(text || '').trim();
  if (!q || chat.busy) return;
  chat.busy = true;
  chat.msgs.push({ role: 'user', text: q });
  $('chat-q').value = '';
  let dense = null;
  if (ai.semantic && ai.emb) { try { dense = denseIx.scores(await ai.emb(q)); } catch (e) { dense = null; } }
  const prev = chat.msgs.filter((x) => x.role === 'bot' && x.a).at(-1);          // 바로 앞 답이 다룬 사업 → 이어 묻는 질문에 사용
  const a = rag.answer(q, { profile: state.profile, today: TODAY, page: chat.wide ? null : pageId(), prev: prev ? prev.a.focus : null, dense });
  const m = { role: 'bot', text: a.text, a, gen: null, fb: 0 };
  chat.msgs.push(m);
  logQA(m, q);
  renderChat();
  if (a.llm.use && llmReady()) { await generate(m); logUpdate(m, { gen: m.gen.model, genState: m.gen.state, check: m.gen.check, genAnswer: m.gen.state === 'done' ? m.gen.text.slice(0, 300) : undefined }); }
  chat.busy = false;
  renderChat();
}
// 낱말 검색으로 못 찾은 질문을 의미 검색으로 다시 찾는다 (모델이 없으면 내려받는다)
async function retrySemantic(q) {
  if (!denseIx || !q || chat.busy) return;
  if (ai.embState !== 'ready') { await loadEmbedder(); renderChat(); }
  if (ai.embState !== 'ready') { toast('검색 모델을 불러오지 못했어요. 낱말을 바꿔서 다시 물어봐 주세요'); return; }
  ai.semantic = true;
  ask(q);
}
async function generate(m) {
  const g = (m.gen = { state: 'run', text: '', model: llmLabel(), warn: '', check: null });
  // 1) 답을 쓰기 전에 "이 자료로 답할 수 있나"를 먼저 묻는다 (예/아니오 한 낱말 → 빠르고, 숫자를 지어낼 틈이 없다)
  if (m.a.llm.check) {
    g.state = 'check'; renderChat();
    try {
      let raw = '';
      for await (const piece of llmStream([{ role: 'system', content: m.a.llm.check.system }, { role: 'user', content: m.a.llm.check.user }], { temperature: 0, max_tokens: 8 })) raw += piece;
      g.check = RAG.parseCheck(raw) || 'unknown'; g.checkRaw = cleanGen(raw).trim().slice(0, 30);
    } catch (e) { g.check = 'error'; }
    if (g.check === 'no') { g.state = 'abstain'; g.text = m.a.llm.noAnswer || '수집한 공고 자료로는 이 질문에 답할 수 없어요. 안산시청 공고 원문에서 확인해 주세요.'; return; }
    g.state = 'run';
  }
  // 2) 답할 수 있으면(또는 판정을 못 읽으면) 답을 쓴다 → 숫자·한국어 검사
  renderChat();
  const el = [...document.querySelectorAll('#chat-log .msg.bot .msg-text')].at(-1), log = $('chat-log');
  try {
    let raw = '';
    for await (const piece of llmStream([{ role: 'system', content: m.a.llm.system }, { role: 'user', content: m.a.llm.user }])) {
      raw += piece; m.gen.text = cleanGen(raw);
      if (el && m.gen.text) { el.textContent = m.gen.text; log.scrollTop = log.scrollHeight; }
    }
    m.gen.text = cleanGen(raw).trim();
    const nums = RAG.checkNumbers(m.gen.text, m.a.llm.user);
    if (!m.gen.text) { m.gen.state = 'fail'; m.gen.warn = 'AI 모델이 답을 만들지 못해서 검색 답변을 보여 드려요.'; }
    else if (!nums.ok) { m.gen.state = 'fail'; m.gen.warn = `AI 답에 자료에 없는 숫자(${nums.missing.slice(0, 3).join(', ')})가 있어서 검색 답변을 대신 보여 드려요.`; }
    else if (!RAG.koreanOnly(m.gen.text)) { m.gen.state = 'fail'; m.gen.warn = 'AI 답에 한국어가 아닌 글자가 섞여서 검색 답변을 대신 보여 드려요.'; }
    else m.gen.state = 'done';
  } catch (e) { m.gen.state = 'fail'; m.gen.warn = 'AI 모델에 연결하지 못해서 검색 답변을 보여 드려요.'; }
}

function openSheet() { sheet.hidden = false; renderSet(); renderChat(); $('chat-q').focus(); }
function closeSheet() { sheet.hidden = true; $('fab').focus(); }
$('chat-set-btn').innerHTML = icon('gear', 20);
$('chat-send').innerHTML = icon('send', 18);
$('fab').addEventListener('click', openSheet);
$('sheet-close').addEventListener('click', closeSheet);
$('chat-set-btn').addEventListener('click', () => { ai.setOpen = !ai.setOpen; renderSet(); });
$('chat-form').addEventListener('submit', (e) => { e.preventDefault(); ask($('chat-q').value); });
sheet.addEventListener('click', (e) => {
  if (e.target === sheet) { closeSheet(); return; }
  const chip = e.target.closest('[data-q]');
  if (chip) { ask(chip.dataset.q); return; }
  const wide = e.target.closest('[data-wide]');
  if (wide) { chat.wide = wide.dataset.wide === '1'; renderChat(); return; }
  const re = e.target.closest('[data-retry]');
  if (re) { retrySemantic(re.dataset.retry); renderChat(); return; }
  const fbBtn = e.target.closest('[data-fb]');
  if (fbBtn) { const m = chat.msgs[Number(fbBtn.dataset.i)], v = Number(fbBtn.dataset.fb); if (m) { m.fb = m.fb === v ? 0 : v; logUpdate(m, { fb: m.fb }); renderChat(); } return; }
  const act = e.target.closest('[data-ai]');
  if (!act) return;
  const k = act.dataset.ai;
  if (k === 'close') { ai.setOpen = false; renderSet(); renderChat(); $('chat-q').focus(); }
  else if (k === 'sem-on') { if (ai.embState === 'ready') { ai.semantic = true; renderSet(); } else loadEmbedder(); }
  else if (k === 'sem-off') { ai.semantic = false; renderSet(); }
  else if (k === 'gen-search') { ai.gen = 'search'; renderSet(); }
  else if (k === 'llm-on') { ai.model = $('ai-model').value; saveAI(); loadWebLLM(); }
  else if (k === 'log-on' || k === 'log-off') { ai.log = k === 'log-on'; saveAI(); renderSet(); }
  else if (k === 'log-save') downloadLog();
  else if (k === 'log-clear') { writeLog([]); renderSet(); toast('기록을 지웠어요'); }
  else if (k === 'server-on') {
    ai.server = $('ai-server').value.trim(); ai.serverModel = $('ai-server-model').value.trim(); saveAI();
    if (/^https?:\/\//.test(ai.server)) ai.gen = 'server'; else toast('서버 주소를 https://…/v1 형태로 넣어 주세요');
    renderSet();
  }
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !sheet.hidden) closeSheet(); });
window.__ansan = { rag, ai, chat, ask, readLog, retrySemantic };                      // 테스트·발표 시연용

route();
</script>
